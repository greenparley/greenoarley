<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GreenPicks Pro - App Deportiva</title>
    <style>
        :root { --bg-principal: #0b0f19; --tarjeta-bg: #151f32; --tarjeta-borde: #223452; --verde-principal: #2ecc71; --oro: #f1c40f; --alerta: #e74c3c; --texto-blanco: #ffffff; --texto-gris: #8a99ad; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg-principal); color: var(--texto-blanco); padding-bottom: 60px; }
        .contenedor-app { max-width: 500px; margin: 0 auto; padding: 15px; position: relative; }
        .oculto { display: none !important; }
        .lobby-container { text-align: center; padding: 30px 20px; }
        .lobby-titulo { font-size: 2.4rem; color: var(--verde-principal); margin-bottom: 8px; font-weight: 800; }
        .lobby-sub { color: var(--texto-gris); margin-bottom: 30px; font-size: 1rem; }
        
        .caja-config-api { background: #111827; border: 1px dashed var(--tarjeta-borde); padding: 15px; border-radius: 12px; margin-bottom: 25px; text-align: left; }
        .caja-config-api label { display: block; font-size: 0.8rem; color: var(--oro); margin-bottom: 5px; font-weight: bold; }
        .input-api-key { width: 100%; background: var(--tarjeta-bg); border: 1px solid var(--tarjeta-borde); padding: 8px 12px; border-radius: 6px; color: white; font-size: 0.85rem; margin-bottom: 8px; }
        
        .btn-deporte-card { background: linear-gradient(145deg, #151f32, #111827); border: 1px solid var(--tarjeta-borde); border-radius: 16px; padding: 22px 25px; margin-bottom: 20px; display: flex; align-items: center; justify-content: space-between; cursor: pointer; width: 100%; text-align: left; }
        .deporte-info h3 { color: var(--texto-blanco); font-size: 1.25rem; margin-bottom: 6px; }
        .deporte-info p { color: var(--texto-gris); font-size: 0.88rem; }
        .deporte-icono { font-size: 2.2rem; background: rgba(255,255,255,0.03); padding: 12px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.05); }
        .app-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; padding-bottom: 10px; border-bottom: 1px solid var(--tarjeta-borde); }
        .btn-volver-lobby { background: transparent; border: 1px solid var(--tarjeta-borde); color: var(--texto-gris); padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 0.85rem; }
        .herramientas-grid { display: flex; gap: 10px; margin-bottom: 15px; }
        .buscador-input { flex: 1; background: var(--tarjeta-bg); border: 1px solid var(--tarjeta-borde); padding: 10px; border-radius: 8px; color: white; font-size: 0.9rem; }
        .btn-refresh-live { background: var(--tarjeta-bg); border: 1px solid var(--tarjeta-borde); color: white; width: 42px; border-radius: 8px; cursor: pointer; }
        .nav-filtros { display: flex; background: var(--tarjeta-bg); padding: 4px; border-radius: 10px; margin-bottom: 20px; gap: 4px; }
        .btn-filto-main { flex: 1; background: transparent; border: none; color: var(--texto-gris); padding: 10px 5px; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 0.8rem; }
        .btn-filto-main.activo { background: var(--bg-principal); color: var(--verde-principal); }
        .tarjeta-partido { background: var(--tarjeta-bg); border: 1px solid var(--tarjeta-borde); border-radius: 12px; padding: 15px; margin-bottom: 12px; cursor: pointer; }
        
        .encabezado-liga { font-size: 0.75rem; color: var(--texto-blanco); display: flex; align-items: center; gap: 8px; margin-bottom: 10px; border-bottom: 1px solid rgba(255,255,255,0.03); padding-bottom: 5px; font-weight: bold; text-transform: uppercase;}
        .etiqueta-hora { color: var(--oro); background: rgba(0,0,0,0.4); padding: 4px 8px; border-radius: 4px; font-size: 0.75rem; display: flex; align-items: center; gap: 4px; letter-spacing: 0.5px;}
        
        .cuerpo-partido { display: flex; justify-content: space-between; align-items: center; }
        .equipos { flex: 1; display: flex; flex-direction: column; gap: 8px; }
        .equipo-linea { display: flex; align-items: center; gap: 10px; font-size: 0.95rem; font-weight: 500; }
        .escudo-dinamico { width: 26px; height: 26px; background: linear-gradient(135deg, #1e293b, #0f172a); border: 1px solid var(--tarjeta-borde); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 0.65rem; font-weight: 800; color: #cbd5e1; text-transform: uppercase; }
        
        .cabecera-detalle-grid { display: flex; justify-content: space-between; align-items: center; margin-top: 15px; background: var(--tarjeta-bg); padding: 20px 10px; border-radius: 14px; border: 1px solid var(--tarjeta-borde); }
        .caja-consejo { background: rgba(46, 204, 113, 0.08); border-left: 4px solid var(--verde-principal); padding: 12px 15px; border-radius: 0 8px 8px 0; margin-bottom: 20px; font-size: 0.85rem; line-height: 1.5; }
        .barra-container { margin-bottom: 15px; }
        .barra-container span { display: block; font-size: 0.85rem; margin-bottom: 5px; color: var(--texto-blanco); }
        .barra-fondo { background: rgba(255,255,255,0.06); height: 10px; border-radius: 5px; overflow: hidden; width: 100%; }
        .barra-progreso { height: 100%; width: 0%; border-radius: 5px; transition: width 0.6s; }
        .cuota-real-badge { background: rgba(255,255,255,0.1); padding: 2px 6px; border-radius: 4px; color: var(--oro); font-size: 0.8rem; margin-left: 8px;}
        .tarjeta-combinada { background: var(--tarjeta-bg); border: 1px solid var(--tarjeta-borde); border-radius: 12px; padding: 15px; margin-bottom: 15px; border-top: 4px solid var(--verde-principal); }
        .ticket-item { background: rgba(0,0,0,0.2); padding: 10px; border-radius: 6px; margin-bottom: 8px; font-size: 0.85rem; }
        .bottom-nav { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 500px; background: #0e1726; border-top: 1px solid var(--tarjeta-borde); display: flex; height: 55px; z-index: 999; }
        .nav-item-btn { flex: 1; background: transparent; border: none; color: var(--texto-gris); display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 0.75rem; cursor: pointer; }
        .nav-item-btn.activo { color: var(--verde-principal); }
        .badge-contador { background: var(--verde-principal); color: #111; font-size: 0.7rem; font-weight: bold; padding: 1px 5px; border-radius: 10px; position: absolute; top: 4px; right: 22%; }
        .panel-picks-lateral { position: fixed; top: 0; right: 0; width: 100%; max-width: 320px; height: 100%; background: #0c1322; border-left: 1px solid var(--tarjeta-borde); z-index: 10000; padding: 20px; transition: transform 0.3s; }
        .oculto-panel { transform: translateX(100%); }
        .panel-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid var(--tarjeta-borde); padding-bottom: 10px; }
        .item-pick-guardado { background: var(--tarjeta-bg); border: 1px solid var(--tarjeta-borde); border-radius: 8px; padding: 12px; font-size: 0.85rem; margin-bottom:10px; }
    </style>
</head>
<body>

    <div class="contenedor-app">
        <div id="lobby-selector" class="lobby-container">
            <h1 class="lobby-titulo">GreenPicks Pro</h1>
            <p class="lobby-sub">Plataforma de Tendencias Deportivas</p>
            
            <div class="caja-config-api">
                <label>⚙️ LLAVE API PERSONALIZADA (OPCIONAL):</label>
                <input type="text" id="user-api-key" class="input-api-key" placeholder="Pega tu API Key si querés usar una propia..." onchange="guardarLlaveManual()">
                <p style="font-size: 0.7rem; color: var(--texto-gris);">Por defecto la app ahora usa la Key alternativa que funciona bien.</p>
            </div>

            <button class="btn-deporte-card" onclick="irADeporte('futbol')">
                <div class="deporte-info"><h3>Fútbol Profesional ⚽</h3><p>Consultando cartelera con llave alternativa activa</p></div><div class="deporte-icono">🏟️</div>
            </button>
            <button class="btn-deporte-card" onclick="irADeporte('basquet')">
                <div class="deporte-info"><h3>Básquetbol Global 🏀</h3><p>Cartelera Directa de ESPN (Sin Llaves)</p></div><div class="deporte-icono">🏀</div>
            </button>
            <button class="btn-deporte-card" onclick="irADeporte('tenis')">
                <div class="deporte-info"><h3>Tenis Internacional 🎾</h3><p>Torneos ATP, WTA y Challengers</p></div><div class="deporte-icono">🎾</div>
            </button>
        </div>

        <div id="app-content" class="oculto">
            <div class="app-header"><button class="btn-volver-lobby" onclick="volverAlLobby()">⬅️ Volver</button><h2 id="titulo-deporte-activo" style="color: var(--verde-principal);">FÚTBOL</h2></div>
            <div id="logs-servidor-error" class="oculto"></div>
            <div id="herramientas-top" class="herramientas-grid">
                <input type="text" id="filtro-ligas-input" oninput="aplicarFiltrosMaster()" placeholder="Buscar equipo o liga..." class="buscador-input">
                <button id="btn-refresh" class="btn-refresh-live" onclick="forzarActualizacion()">🔄</button>
            </div>
            <div class="nav-filtros">
                <button id="btn-proximos" class="btn-filto-main activo" onclick="setFiltroEstado('proximos')">Próximos (7 días)</button>
                <button id="btn-envivo" class="btn-filto-main" onclick="setFiltroEstado('envivo')">🔴 En Vivo</button>
                <button id="btn-combinada" class="btn-filto-main" onclick="setFiltroEstado('combinada')">Combinada IA</button>
            </div>
            <div id="contenedor-partidos"></div><div id="seccion-combinada" class="oculto"></div>
        </div>

        <div id="vista-detalle" class="oculto">
            <div style="display: flex; justify-content: space-between; align-items: center;"><button class="btn-volver-lobby" onclick="cerrarDetalle()">⬅️ Volver atrás</button></div>
            <div class="cabecera-detalle-grid" id="detalle-cabecera"></div>
            <div id="detalle-consejo" style="margin-top: 15px;"></div>
            <div id="detalle-barras"></div>
        </div>
    </div>

    <div class="bottom-nav"><button class="nav-item-btn activo" onclick="cerrarDetalle(); setFiltroEstado('proximos');"><span>🏟️</span><span>Eventos</span></button><button class="nav-item-btn" style="position:relative;" onclick="togglePanelPicks()"><span id="contador-picks-badge" class="badge-contador">0</span><span>📋</span><span>Mis Picks</span></button></div>
    <div id="panel-picks" class="panel-picks-lateral oculto-panel"><div class="panel-header"><h3>Mis Picks</h3><button class="btn-volver-lobby" onclick="togglePanelPicks()">❌</button></div><div id="contenedor-lista-picks"></div></div>

    <script>
        // ASIGNADA LA KEY DE TENIS PARA AMBOS DEPORTES
        let INTERCAMBIO_KEY = "d3d7b6a1627d78292b24d7b2554e8c5d"; 

        let baseDeDatosHoy = [];
        let estadoFiltroActual = 'proximos';
        let ticketsMultiplesGenerados = {}; 
        let deporteActivo = 'futbol'; 

        function obtenerApiKeyActiva() {
            const guardada = localStorage.getItem('gp_user_api_key');
            return (guardada && guardada.trim() !== "") ? guardada.trim() : INTERCAMBIO_KEY;
        }

        function guardarLlaveManual() {
            const val = document.getElementById('user-api-key').value;
            localStorage.setItem('gp_user_api_key', val);
        }

        function cargarLlaveEnPantalla() {
            const guardada = localStorage.getItem('gp_user_api_key');
            if(guardada) document.getElementById('user-api-key').value = guardada;
        }

        function generarMonograma(nombre, extraClass = "") {
            if(!nombre) nombre = "X";
            const iniciales = nombre.substring(0,3).toUpperCase();
            return `<div class="escudo-dinamico ${extraClass}">${iniciales}</div>`;
        }

        function esPartidoEnVivo(p) { return p.isLiveNative === true; }

        function formatearFechaHoraLocal(fechaIso) {
            if (!fechaIso) return "--/-- --:--";
            const f = new Date(fechaIso);
            const dia = String(f.getDate()).padStart(2, '0');
            const mes = String(f.getMonth() + 1).padStart(2, '0');
            const horas = String(f.getHours()).padStart(2, '0');
            const mins = String(f.getMinutes()).padStart(2, '0');
            return `${dia}/${mes} - ${horas}:${mins}`;
        }

        function mostrarError(mensaje) {
            const logBox = document.getElementById('logs-servidor-error');
            logBox.innerHTML = `<div class="banner-error-api" style="background: rgba(231, 76, 60, 0.15); border: 1px solid var(--alerta); color: #ff7675; padding: 15px; border-radius: 10px; margin-bottom: 15px; font-size: 0.9rem; text-align: center;"><b>⚠️ Estado del Servidor</b><br>${mensaje}</div>`;
            logBox.classList.remove('oculto');
        }

        async function cargarDatosDeportivos() {
            document.getElementById('logs-servidor-error').classList.add('oculto');
            const cacheKey = `sports_cache_mix_${deporteActivo}`;
            const cachedData = localStorage.getItem(cacheKey);
            
            if (cachedData) {
                const parsed = JSON.parse(cachedData);
                if (Date.now() - parsed.timestamp < 600000 && parsed.data && parsed.data.length > 0) {
                    return parsed.data; 
                }
            }

            let datosProcesados = [];
            if (deporteActivo === 'futbol') datosProcesados = await fetchFutbolOddsApi();
            else if (deporteActivo === 'basquet') datosProcesados = await fetchBasketESPNPublico();
            else if (deporteActivo === 'tenis') datosProcesados = await fetchTenisOddsApi();

            if (datosProcesados.length > 0) {
                datosProcesados.sort((a, b) => new Date(a.utcDate) - new Date(b.utcDate));
                localStorage.setItem(cacheKey, JSON.stringify({ timestamp: Date.now(), data: datosProcesados }));
            }
            return datosProcesados;
        }

        async function fetchFutbolOddsApi() {
            const API_KEY = obtenerApiKeyActiva();
            try {
                const hoyStr = new Date().toISOString().split('T')[0];
                let ligasFutbolObj = JSON.parse(localStorage.getItem('gp_ligas_futbol_odds_cache'));
                
                if (!ligasFutbolObj || ligasFutbolObj.fecha !== hoyStr) {
                    const resSports = await fetch(`https://api.the-odds-api.com/v4/sports/?apiKey=${API_KEY}`);
                    if (!resSports.ok) {
                        mostrarError("La API Key compartida arrojó un error de conexión o alcanzó su cuota.");
                        return [];
                    }
                    const sports = await resSports.json();
                    let torneosActivos = sports.filter(s => s.group === 'Soccer' || s.key.startsWith('soccer_')).map(s => s.key);
                    ligasFutbolObj = { fecha: hoyStr, ligas: torneosActivos };
                    localStorage.setItem('gp_ligas_futbol_odds_cache', JSON.stringify(ligasFutbolObj));
                }

                // Selección dinámica amplia para encontrar partidos en mayo de 2026
                let torneosPrioritarios = ligasFutbolObj.ligas.filter(l => 
                    l.includes('argentina') || l.includes('epl') || l.includes('spain') || 
                    l.includes('champions') || l.includes('italy') || l.includes('brazil') || 
                    l.includes('mexico') || l.includes('usa')
                ).slice(0, 3);

                if (torneosPrioritarios.length === 0) torneosPrioritarios = ligasFutbolObj.ligas.slice(0, 2);

                let poolResultados = [];
                const promesas = torneosPrioritarios.map(async (liga) => {
                    try {
                        const res = await fetch(`https://api.the-odds-api.com/v4/sports/${liga}/odds/?apiKey=${API_KEY}&regions=eu&markets=h2h`);
                        if (res.ok) return await res.json();
                    } catch (e) {}
                    return [];
                });

                const resultadosLigas = await Promise.all(promesas);
                resultadosLigas.forEach(data => { if (Array.isArray(data)) poolResultados = poolResultados.concat(data); });

                const limiteTiempoFiltro = new Date(Date.now() - 7200000);

                return poolResultados.map(partido => {
                    let cuotas = { local: "N/A", empate: "N/A", visita: "N/A" };
                    if (partido.bookmakers && partido.bookmakers.length > 0) {
                        const h2hMarket = partido.bookmakers[0].markets.find(m => m.key === 'h2h');
                        if (h2hMarket && h2hMarket.outcomes) {
                            h2hMarket.outcomes.forEach(out => { 
                                if (out.name === partido.home_team) cuotas.local = out.price; 
                                else if (out.name === partido.away_team) cuotas.visita = out.price; 
                                else cuotas.empate = out.price;
                            });
                        }
                    }
                    return {
                        id: 'fb_' + partido.id, utcDate: partido.commence_time, 
                        competition: { name: partido.sport_title.replace("Soccer - ", "") },
                        homeTeam: { name: partido.home_team }, awayTeam: { name: partido.away_team },
                        cuotasReales: cuotas, isLiveNative: false
                    };
                }).filter(p => new Date(p.utcDate) >= limiteTiempoFiltro);

            } catch (error) {
                mostrarError("No se pudo obtener la cartelera de fútbol.");
                return [];
            }
        }

        async function fetchBasketESPNPublico() {
            let pool = [];
            const endpoints = [{ id: "nba", tag: "NBA" }, { id: "mens-euroleague", tag: "Euroliga" }];
            let d1 = new Date(); let d2 = new Date(); d2.setDate(d2.getDate() + 3);
            let fechas = `dates=${d1.toISOString().split('T')[0].replace(/-/g, '')}-${d2.toISOString().split('T')[0].replace(/-/g, '')}`;
            
            for (let liga of endpoints) {
                try {
                    const res = await fetch(`https://site.api.espn.com/apis/site/v2/sports/basketball/${liga.id}/scoreboard?${fechas}&limit=35`);
                    if (!res.ok) continue; 
                    const data = await res.json();
                    if (!data || !data.events) continue;
                    const procesados = data.events.map(evento => {
                        const localRaw = evento.competitions[0].competitors.find(c => c.homeAway === 'home');
                        const visitaRaw = evento.competitions[0].competitors.find(c => c.homeAway === 'away');
                        return {
                            id: 'bk_' + evento.id, utcDate: evento.date, competition: { name: liga.tag }, homeTeam: { name: localRaw.team.displayName },
                            awayTeam: { name: visitaRaw.team.displayName }, cuotasReales: { local: 1.91, empate: "N/A", visita: 1.82 },
                            isLiveNative: (evento.status.type.state === "in")
                        };
                    });
                    pool = pool.concat(procesados);
                } catch (err) {}
            }
            return pool;
        }

        async function fetchTenisOddsApi() {
            const API_KEY = obtenerApiKeyActiva();
            let resultadosTotales = [];
            try {
                const resSports = await fetch(`https://api.the-odds-api.com/v4/sports/?apiKey=${API_KEY}`);
                if (!resSports.ok) { mostrarError("La Key no responde para la consulta de Tenis."); return []; }
                const sports = await resSports.json();
                let torneosTenis = sports.filter(s => s.group === 'Tennis').map(s => s.key).slice(0, 2);

                const promesas = torneosTenis.map(async (liga) => {
                    const res = await fetch(`https://api.the-odds-api.com/v4/sports/${liga}/odds/?apiKey=${API_KEY}&regions=eu&markets=h2h`);
                    if (res.ok) return await res.json();
                    return [];
                });
                const resultados = await Promise.all(promesas);
                resultados.forEach(data => { if (Array.isArray(data)) resultadosTotales = resultadosTotales.concat(data); });
                
                const limiteTiempoFiltro = new Date(Date.now() - 7200000);
                return resultadosTotales.map(partido => {
                    let cuotas = { local: "N/A", empate: "N/A", visita: "N/A" };
                    if (partido.bookmakers && partido.bookmakers.length > 0) {
                        const h2hMarket = partido.bookmakers[0].markets.find(m => m.key === 'h2h');
                        if (h2hMarket && h2hMarket.outcomes) {
                            h2hMarket.outcomes.forEach(out => { 
                                if (out.name === partido.home_team) cuotas.local = out.price; 
                                else if (out.name === partido.away_team) cuotas.visita = out.price; 
                            });
                        }
                    }
                    return { 
                        id: 'tn_' + partido.id, utcDate: partido.commence_time, competition: { name: partido.sport_title }, 
                        homeTeam: { name: partido.home_team }, awayTeam: { name: partido.away_team }, cuotasReales: cuotas, isLiveNative: false 
                    };
                }).filter(p => new Date(p.utcDate) >= limiteTiempoFiltro);
            } catch (error) { return []; }
        }

        async function iniciarApp() {
            const contenedor = document.getElementById('contenedor-partidos');
            contenedor.innerHTML = `<p style="color: var(--verde-principal); padding:20px; text-align:center;">⏳ Conectando con los servidores en tiempo real...</p>`;
            baseDeDatosHoy = await cargarDatosDeportivos();
            
            if (baseDeDatosHoy.length > 0) { 
                generarCombinadaDelDia(); aplicarFiltrosMaster(); 
            } else { 
                contenedor.innerHTML = `<p style="text-align:center; color:var(--texto-gris); background:rgba(255,255,255,0.05); padding:20px; border-radius:10px;">⚠️ Cartelera vacía o sin respuesta del servidor.</p>`; 
            }
        }

        function abrirDetalle(id) {
            const p = baseDeDatosHoy.find(item => item.id === id); if (!p) return;
            document.getElementById('herramientas-top').classList.add('oculto'); document.getElementById('contenedor-partidos').classList.add('oculto'); document.getElementById('seccion-combinada').classList.add('oculto'); document.getElementById('vista-detalle').classList.remove('oculto');
            document.getElementById('detalle-cabecera').innerHTML = `<div style="text-align:center; width:45%;">${generarMonograma(p.homeTeam.name, 'detalle')}<p style="font-size:0.90rem; font-weight:bold;">${p.homeTeam.name}</p></div><h2 style="width:10%; text-align:center; color:var(--verde-principal);">VS</h2><div style="text-align:center; width:45%;">${generarMonograma(p.awayTeam.name, 'detalle')}<p style="font-size:0.90rem; font-weight:bold;">${p.awayTeam.name}</p></div>`;
            
            let probL = p.cuotasReales.local !== "N/A" ? Math.round((1 / p.cuotasReales.local) * 100) : 45;
            let probV = p.cuotasReales.visita !== "N/A" ? Math.round((1 / p.cuotasReales.visita) * 100) : 35;
            let probE = (deporteActivo === 'futbol' && p.cuotasReales.empate !== "N/A") ? Math.round((1 / p.cuotasReales.empate) * 100) : 0;
            
            let totalProb = probL + probE + probV; 
            probL = Math.round((probL / totalProb) * 100); probV = Math.round((probV / totalProb) * 100); 
            if(probE > 0) probE = Math.round((probE / totalProb) * 100);

            document.getElementById('detalle-consejo').innerHTML = `<div class="caja-consejo">💡 <b>Cálculo Probabilístico Pro:</b><br>Análisis estructural completado para mercados principales basados en cuotas reales.</div>`;

            let htmlTabs = `<div>
                <h4 style="margin-bottom:12px; color:white; font-size:0.9rem;">Probabilidad Estimada (Algoritmo)</h4>
                <div class="barra-container"><div style="display:flex; justify-content:space-between;"><span>Gana Local <span class="cuota-real-badge">x${p.cuotasReales.local}</span></span><span>${probL}%</span></div><div class="barra-fondo"><div class="barra-progreso" style="background:var(--verde-principal); width:${probL}%"></div></div></div>`;
            
            if(deporteActivo === 'futbol' && p.cuotasReales.empate !== "N/A") {
                htmlTabs += `<div class="barra-container"><div style="display:flex; justify-content:space-between;"><span>Empate <span class="cuota-real-badge">x${p.cuotasReales.empate}</span></span><span>${probE}%</span></div><div class="barra-fondo"><div class="barra-progreso" style="background:var(--oro); width:${probE}%"></div></div></div>`;
            }
            
            htmlTabs += `<div class="barra-container"><div style="display:flex; justify-content:space-between;"><span>Gana Visita <span class="cuota-real-badge">x${p.cuotasReales.visita}</span></span><span>${probV}%</span></div><div class="barra-fondo"><div class="barra-progreso" style="background:var(--alerta); width:${probV}%"></div></div></div></div>`;
            document.getElementById('detalle-barras').innerHTML = htmlTabs;
        }

        function cerrarDetalle() { document.getElementById('vista-detalle').classList.add('oculto'); setFiltroEstado(estadoFiltroActual); }
        
        function setFiltroEstado(estado) {
            estadoFiltroActual = estado; document.querySelectorAll('.btn-filto-main').forEach(b => b.classList.remove('activo')); document.getElementById('btn-' + estado).classList.add('activo');
            if (estado === 'combinada') { document.getElementById('herramientas-top').classList.add('oculto'); document.getElementById('contenedor-partidos').classList.add('oculto'); document.getElementById('seccion-combinada').classList.remove('oculto'); } 
            else { document.getElementById('herramientas-top').classList.remove('oculto'); document.getElementById('contenedor-partidos').classList.remove('oculto'); document.getElementById('seccion-combinada').classList.add('oculto'); aplicarFiltrosMaster(); }
        }
        
        function aplicarFiltrosMaster() {
            if (estadoFiltroActual === 'combinada') return; 
            let f = baseDeDatosHoy; 
            if (estadoFiltroActual === 'envivo') f = f.filter(p => esPartidoEnVivo(p));
            const i = document.getElementById('filtro-ligas-input'); 
            if (i && i.value.trim() !== '') { const txt = i.value.toLowerCase().trim(); f = f.filter(p => p.competition.name.toLowerCase().includes(txt) || p.homeTeam.name.toLowerCase().includes(txt) || p.awayTeam.name.toLowerCase().includes(txt)); }
            
            const c = document.getElementById('contenedor-partidos'); c.innerHTML = '';
            if (f.length === 0) { c.innerHTML = `<p style="padding:30px; text-align:center; color:var(--texto-gris);">No hay partidos en esta categoría en este momento.</p>`; return; }
            
            f.forEach(p => { 
                let renderEstado = esPartidoEnVivo(p) ? `<span style="color:var(--alerta); font-weight:bold;">🔴 EN VIVO</span>` : `🏟️ Ver Análisis`;
                let renderHora = p.utcDate ? `<span class="etiqueta-hora">🕒 ${formatearFechaHoraLocal(p.utcDate)}</span>` : '';
                
                c.innerHTML += `<div class="tarjeta-partido" onclick="abrirDetalle('${p.id}')">
                    <div class="encabezado-liga">${renderHora} <span>${p.competition.name}</span></div>
                    <div class="cuerpo-partido"><div class="equipos"><div class="equipo-linea">${generarMonograma(p.homeTeam.name)} ${p.homeTeam.name}</div><div class="equipo-linea">${generarMonograma(p.awayTeam.name)} ${p.awayTeam.name}</div></div><div class="marcador-live">${renderEstado}</div></div></div>`;
            });
        }

        function generarCombinadaDelDia() {
            const s = document.getElementById('seccion-combinada'); s.innerHTML = ''; ticketsMultiplesGenerados = {};
            if (baseDeDatosHoy.length < 2) { s.innerHTML = `<p style="padding:20px; text-align:center; color:var(--texto-gris);">Se necesitan al menos 2 partidos vigentes.</p>`; return; }
            
            let pool = baseDeDatosHoy.slice(0, 2);
            let idTicket = "cb_sports_day";
            ticketsMultiplesGenerados[idTicket] = pool.map(x => ({ p: x, mercado: `Ganador Directo`, cuota: (x.cuotasReales.local !== "N/A" ? parseFloat(x.cuotasReales.local) : 1.80) }));
            
            let h = `<div class="tarjeta-combinada"><h4>📊 Sugerencia Múltiple Automática</h4>`;
            let totalCuota = 1.0;
            ticketsMultiplesGenerados[idTicket].forEach(c => {
                totalCuota *= c.cuota;
                h += `<div class="ticket-item">📍 ${c.p.homeTeam.name} vs ${c.p.awayTeam.name}<br>🎯 <b>${c.mercado}</b> <strong style="color:var(--verde-principal); float:right;">x${c.cuota}</strong></div>`;
            });
            h += `<div style="text-align:right; margin:10px 0; color:var(--oro)">Cuota Combinada: x${totalCuota.toFixed(2)}</div><button onclick="guardarCombinada('${idTicket}')" style="width:100%; background:rgba(255,255,255,0.08); color:white; border:1px solid var(--tarjeta-borde); padding:8px; border-radius:6px;">Fijar en Mis Picks</button></div>`;
            s.innerHTML = h;
        }

        function obtenerPicksLocales() { return JSON.parse(localStorage.getItem('gp_picks')) || []; }
        function guardarCombinada(idT) { let h = obtenerPicksLocales(); let tk = ticketsMultiplesGenerados[idT]; if (!tk) return; tk.forEach(i => { h.push({ id: Date.now(), home: i.p.homeTeam.name, away: i.p.awayTeam.name, mercado: i.mercado, cuota: i.cuota, estado: 'PROYECTADO' }); }); localStorage.setItem('gp_picks', JSON.stringify(h)); actualizarEstructuraPicksLocales(); alert("Guardado en la sección Mis Picks"); }
        function actualizarEstructuraPicksLocales() { let h = obtenerPicksLocales(); document.getElementById('contador-picks-badge').innerText = h.length; let c = document.getElementById('contenedor-lista-picks'); c.innerHTML = ""; h.reverse().forEach(p => { c.innerHTML += `<div class="item-pick-guardado"><span style="color:var(--verde-principal); float:right;">${p.estado}</span><div style="color:var(--texto-gris); font-size:0.75rem;">${p.home} vs ${p.away}</div><strong style="color:white;">${p.mercado} (x${p.cuota})</strong></div>`; }); }
        
        function togglePanelPicks() { document.getElementById('panel-picks').classList.toggle('oculto-panel'); }
        function irADeporte(dep) { deporteActivo = dep; let tit = 'FÚTBOL'; if(dep === 'basquet') tit = 'BÁSQUETBOL'; if(dep === 'tenis') tit = 'TENIS'; document.getElementById('titulo-deporte-activo').innerText = tit; document.getElementById('lobby-selector').classList.add('oculto'); document.getElementById('app-content').classList.remove('oculto'); setFiltroEstado('proximos'); iniciarApp(); }
        function volverAlLobby() { document.getElementById('lobby-selector').classList.remove('oculto'); document.getElementById('app-content').classList.add('oculto'); document.getElementById('vista-detalle').classList.add('oculto'); document.getElementById('logs-servidor-error').classList.add('oculto'); }
        
        function forzarActualizacion() { localStorage.removeItem(`sports_cache_mix_${deporteActivo}`); iniciarApp(); }
        
        window.onload = () => { cargarLlaveEnPantalla(); actualizarEstructuraPicksLocales(); };
    </script>
</body>
</html>
