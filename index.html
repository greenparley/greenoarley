<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>GreenPicks Pro - Agenda Premium</title>

<style>
:root{
    --bg:#090d16;
    --card:#111827;
    --border:#1f2937;
    --text:#f3f4f6;
    --muted:#9ca3af;
    --green:#10b981;
    --danger:#ef4444;
    --gold:#facc15;
}

*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:Segoe UI, sans-serif;
    padding:20px;
}

.container{
    max-width:1600px;
    margin:auto;
}

header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:15px;
    flex-wrap:wrap;
    margin-bottom:25px;
    border-bottom:1px solid var(--border);
    padding-bottom:20px;
}

h1{
    margin:0;
    font-size:28px;
    font-weight:900;
}

.api-group{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
}

input{
    background:var(--card);
    border:1px solid var(--border);
    color:white;
    padding:12px;
    border-radius:8px;
    width:320px;
    outline:none;
}

button{
    background:var(--green);
    border:none;
    color:white;
    padding:12px 20px;
    border-radius:8px;
    font-weight:bold;
    cursor:pointer;
    transition:.2s;
}

button:hover{
    background:#059669;
}

.stats-bar{
    display:flex;
    gap:15px;
    flex-wrap:wrap;
    margin-bottom:30px;
}

.stat-box{
    background:var(--card);
    border:1px solid var(--border);
    padding:14px 18px;
    border-radius:10px;
    min-width:180px;
}

.stat-title{
    color:var(--muted);
    font-size:12px;
    margin-bottom:5px;
}

.stat-value{
    font-size:24px;
    font-weight:800;
    color:#34d399;
}

.filters{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    margin-bottom:25px;
}

.filter-btn{
    background:#111827;
    border:1px solid #1f2937;
    color:white;
    padding:10px 14px;
    border-radius:8px;
    cursor:pointer;
    font-size:13px;
    transition:.2s;
}

.filter-btn.active{
    background:var(--green);
    border-color:var(--green);
}

.loader{
    text-align:center;
    font-size:20px;
    color:var(--green);
    margin:40px 0;
    display:none;
    font-weight:900;
}

.sport-block{
    margin-bottom:40px;
    background:rgba(17,24,39,.7);
    border:1px solid var(--border);
    border-radius:15px;
    padding:20px;
}

.sport-title{
    font-size:26px;
    margin:0 0 20px;
    font-weight:900;
    border-bottom:3px solid var(--green);
    padding-bottom:10px;
}

.day-title{
    margin:25px 0 15px;
    font-size:16px;
    color:#93c5fd;
    font-weight:700;
    text-transform: capitalize;
}

.matches-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(370px,1fr));
    gap:18px;
}

.match-card{
    background:#0f172a;
    border:1px solid #1e293b;
    border-radius:12px;
    padding:16px;
    position:relative;
    overflow:hidden;
}

.top-pick{
    position:absolute;
    top:12px;
    right:12px;
    background:var(--gold);
    color:black;
    padding:4px 8px;
    border-radius:6px;
    font-size:10px;
    font-weight:900;
}

.match-top{
    display:flex;
    justify-content:space-between;
    margin-bottom:12px;
    font-size:12px;
    align-items: center;
    gap:10px;
}

.league{
    color:#60a5fa;
    font-weight:800;
    text-transform:uppercase;
    max-width: 65%;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}

.time{
    background:#1e293b;
    padding:4px 8px;
    border-radius:6px;
    font-weight:700;
}

.teams{
    margin-bottom:15px;
}

.team{
    padding:4px 0;
    font-weight:700;
    font-size:14px;
}

.market-title{
    margin-top:14px;
    margin-bottom:8px;
    color:#fbbf24;
    font-size:13px;
    font-weight:bold;
    text-transform:uppercase;
}

.market-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:8px;
}

.market-grid.two{
    grid-template-columns:repeat(2,1fr);
}

.odd{
    background:#111827;
    border-radius:8px;
    padding:8px;
    text-align:center;
    border:1px solid #1f2937;
}

.odd-label{
    font-size:10px;
    color:var(--muted);
    margin-bottom:4px;
    font-weight:700;
}

.odd-value{
    color:#34d399;
    font-weight:900;
    font-size:14px;
}

.prediction-box{
    margin-top:16px;
    border-top:1px solid rgba(255,255,255,.06);
    padding-top:12px;
}

.prediction-title{
    font-size:11px;
    color:#9ca3af;
    margin-bottom:8px;
    font-weight:700;
}

.prediction-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:8px;
}

.pick{
    padding:10px;
    border-radius:8px;
    text-align:center;
    font-weight:800;
    font-size:11px;
    display: flex;
    align-items: center;
    justify-content: center;
}

.pick.safe{
    background:rgba(16,185,129,.15);
    border:1px solid rgba(16,185,129,.4);
    color:#34d399;
}

.pick.medium{
    background:rgba(250,204,21,.12);
    border:1px solid rgba(250,204,21,.4);
    color:#facc15;
}

.pick.risky{
    background:rgba(239,68,68,.12);
    border:1px solid rgba(239,68,68,.4);
    color:#ef4444;
}

.no-data{
    color:var(--muted);
    font-size:12px;
}

.cache-info {
    font-size: 12px;
    color: var(--muted);
    margin-top: 5px;
}

@media(max-width:700px){
    input{ width:100%; }
    .prediction-grid{ grid-template-columns:1fr; }
}
</style>
</head>

<body>

<div class="container">

<header>
    <div>
        <h1>⚽ GreenPicks Pro - Agenda Inteligente</h1>
        <div id="cacheStatus" class="cache-info"></div>
    </div>

    <div class="api-group">
        <input type="text" id="apiKey" placeholder="API Key The Odds API">
        <button onclick="cargarAgenda()">Actualizar</button>
    </div>
</header>

<div class="stats-bar">
    <div class="stat-box">
        <div class="stat-title">Eventos Totales</div>
        <div class="stat-value" id="totalEvents">0</div>
    </div>
    <div class="stat-box">
        <div class="stat-title">Ligas Configuradas</div>
        <div class="stat-value" id="totalLeagues">0</div>
    </div>
    <div class="stat-box">
        <div class="stat-title">Top Picks</div>
        <div class="stat-value" id="topPicksCount">0</div>
    </div>
</div>

<div class="filters">
    <button class="filter-btn active" onclick="filtrarDeporte('all', event)">Todos</button>
    <button class="filter-btn" onclick="filtrarDeporte('Fútbol ⚽', event)">Fútbol</button>
    <button class="filter-btn" onclick="filtrarDeporte('Básquet 🏀', event)">NBA</button>
    <button class="filter-btn" onclick="filtrarDeporte('Tenis 🎾', event)">Tenis</button>
</div>

<div class="loader" id="loader">
    Sincronizando mercados premium... ⏳
</div>

<div id="content"></div>

</div>

<script>

const deportesConfig = {
    // 5 GRANDES
    'soccer_epl': { key: 'soccer_epl', nombre:'Premier League', deporte:'Fútbol ⚽' },
    'soccer_spain_la_liga': { key: 'soccer_spain_la_liga', nombre:'La Liga', deporte:'Fútbol ⚽' },
    'soccer_italy_serie_a': { key: 'soccer_italy_serie_a', nombre:'Serie A', deporte:'Fútbol ⚽' },
    'soccer_germany_bundesliga': { key: 'soccer_germany_bundesliga', nombre:'Bundesliga', deporte:'Fútbol ⚽' },
    'soccer_france_ligue_one': { key: 'soccer_france_ligue_one', nombre:'Ligue 1', deporte:'Fútbol ⚽' },

    // EUROPA COMPLEMENTARIAS
    'soccer_netherlands_eredivisie': { key: 'soccer_netherlands_eredivisie', nombre:'Eredivisie', deporte:'Fútbol ⚽' },
    'soccer_portugal_primeira_liga': { key: 'soccer_portugal_primeira_liga', nombre:'Primeira Liga', deporte:'Fútbol ⚽' },
    'soccer_belgium_first_division': { key: 'soccer_belgium_first_division', nombre:'Bélgica Pro League', deporte:'Fútbol ⚽' },
    'soccer_efl_championship': { key: 'soccer_efl_championship', nombre:'Championship', deporte:'Fútbol ⚽' },
    'soccer_turkey_super_league': { key: 'soccer_turkey_super_league', nombre:'Super Lig', deporte:'Fútbol ⚽' },

    // ARGENTINA
    'soccer_argentina_primera_division': { key: 'soccer_argentina_primera_division', nombre:'Liga Argentina', deporte:'Fútbol ⚽' },

    // ARABIA
    'soccer_saudi_pro_league': { key: 'soccer_saudi_pro_league', nombre:'Saudi Pro League', deporte:'Fútbol ⚽' },

    // COPAS
    'soccer_uefa_champions_league': { key: 'soccer_uefa_champions_league', nombre:'Champions League', deporte:'Fútbol ⚽' },
    'soccer_uefa_europa_league': { key: 'soccer_uefa_europa_league', nombre:'Europa League', deporte:'Fútbol ⚽' },
    'soccer_uefa_europa_conference_league': { key: 'soccer_uefa_europa_conference_league', nombre:'Conference League', deporte:'Fútbol ⚽' },

    // AMÉRICA
    'soccer_conmebol_copa_libertadores': { key: 'soccer_conmebol_copa_libertadores', nombre:'Copa Libertadores', deporte:'Fútbol ⚽' },
    'soccer_conmebol_copa_sudamericana': { key: 'soccer_conmebol_copa_sudamericana', nombre:'Copa Sudamericana', deporte:'Fútbol ⚽' },

    // MUNDIAL
    'soccer_fifa_world_cup': { key: 'soccer_fifa_world_cup', nombre:'Mundial FIFA', deporte:'Fútbol ⚽' },

    // NBA
    'basketball_nba': { key: 'basketball_nba', nombre:'NBA', deporte:'Básquet 🏀' },

    // TENIS
    'tennis_atp_matches': { key: 'tennis_atp_matches', nombre:'ATP', deporte:'Tenis 🎾' }
};

let ultimoFiltro = 'all';

document.addEventListener("DOMContentLoaded", () => {
    const savedKey = localStorage.getItem('greenpicks_apikey');
    if(savedKey) document.getElementById('apiKey').value = savedKey;
    document.getElementById('totalLeagues').innerText = Object.keys(deportesConfig).length;
});

function generarPickAlgoritmico(market){
    if(!market || !market.outcomes || market.outcomes.length === 0) {
        return { tipo: 'PICK 3/5', clase: 'safe' };
    }
    const cuotas = market.outcomes.map(o => o.price);
    const minCuota = Math.min(...cuotas);

    if(minCuota <= 1.55){
        return { tipo: 'PICK 3/5', clase: 'safe' };
    }
    if(minCuota <= 2.30){
        return { tipo: 'PICK 4/5', clase: 'medium' };
    }
    return { tipo: 'PICK 5/5', clase: 'risky' };
}

async function cargarAgenda(){
    const apiKey = document.getElementById('apiKey').value.trim();

    if(!apiKey){
        alert('Ingresá la API Key');
        return;
    }

    localStorage.setItem('greenpicks_apikey', apiKey);

    const content = document.getElementById('content');
    const loader = document.getElementById('loader');
    const totalEvents = document.getElementById('totalEvents');
    const topPicksCount = document.getElementById('topPicksCount');
    const cacheStatus = document.getElementById('cacheStatus');

    content.innerHTML = '';
    loader.style.display = 'block';

    const cacheKey = 'sports_agenda_data';
    const cacheTimeKey = 'sports_agenda_timestamp';
    const CACHE_DURATION = 10 * 60 * 1000; 

    const ahoraTimestamp = new Date().getTime();
    const cachedData = localStorage.getItem(cacheKey);
    const cachedTimestamp = localStorage.getItem(cacheTimeKey);

    let resultados = [];

    if (cachedData && cachedTimestamp && (ahoraTimestamp - cachedTimestamp < CACHE_DURATION)) {
        resultados = JSON.parse(cachedData);
        cacheStatus.innerText = "⚡ Datos cargados desde el caché local (Ahorrando API créditos)";
    } else {
        cacheStatus.innerText = "🌐 Consultando nuevos mercados a la API...";
        const sportKeys = Object.keys(deportesConfig);

        const promises = sportKeys.map(async sportKey => {
            try{
                let markets = '';
                if(sportKey.startsWith('soccer')){
                    markets = 'h2h,totals,spreads,correct_score';
                }else if(sportKey.startsWith('tennis')){
                    markets = 'h2h,totals,spreads';
                }else if(sportKey.startsWith('basketball')){
                    markets = 'h2h,spreads,totals';
                }

                const url = `https://api.the-odds-api.com/v4/sports/${sportKey}/odds/?regions=eu&markets=${markets}&oddsFormat=decimal&apiKey=${apiKey}`;
                const response = await fetch(url);
                if(!response.ok) throw new Error();
                const data = await response.json();
                return {sportKey, data};
            }catch(e){
                return {sportKey, data:[]};
            }
        });

        resultados = await Promise.all(promises);
        localStorage.setItem(cacheKey, JSON.stringify(resultados));
        localStorage.setItem(cacheTimeKey, ahoraTimestamp.toString());
    }

    loader.style.display = 'none';

    const estructura = {};
    let contador = 0;
    let contadorTopPicks = 0;

    const ahora = new Date();
    const limite = new Date();
    limite.setDate(ahora.getDate()+7);

    resultados.forEach(resultado=>{
        const config = deportesConfig[resultado.sportKey];
        if(!config) return;

        resultado.data.forEach(evento=>{
            const fecha = new Date(evento.commence_time);

            if(fecha < ahora || fecha > limite) return;

            contador++;

            if(!estructura[config.deporte]){
                estructura[config.deporte] = {};
            }

            const dia = fecha.toLocaleDateString('es-AR',{
                weekday:'long', day:'numeric', month:'long'
            });

            if(!estructura[config.deporte][dia]){
                estructura[config.deporte][dia] = [];
            }

            evento.liga = config.nombre;
            estructura[config.deporte][dia].push(evento);
        });
    });

    totalEvents.innerText = contador;

    for(const [deporte, dias] of Object.entries(estructura)){
        const sportBlock = document.createElement('div');
        sportBlock.className = 'sport-block';
        sportBlock.dataset.sport = deporte;

        sportBlock.innerHTML += `<h2 class="sport-title">${deporte}</h2>`;

        const diasOrdenados = Object.keys(dias).sort((a,b) => {
            return new Date(dias[a][0].commence_time) - new Date(dias[b][0].commence_time);
        });

        diasOrdenados.forEach(dia => {
            const dayWrapper = document.createElement('div');
            dayWrapper.innerHTML = `<div class="day-title">📅 ${dia}</div>`;

            const grid = document.createElement('div');
            grid.className = 'matches-grid';

            dias[dia].sort((a,b)=> new Date(a.commence_time) - new Date(b.commence_time));

            dias[dia].forEach(evento=>{
                const hora = new Date(evento.commence_time).toLocaleTimeString('es-AR',{
                    hour:'2-digit', minute:'2-digit'
                });

                const card = document.createElement('div');
                card.className = 'match-card';

                let marketsHTML = '';
                const bookmaker = evento.bookmakers?.[0];
                let h2hMarket = null;

                if(bookmaker){
                    h2hMarket = bookmaker.markets.find(m => m.key === 'h2h');

                    bookmaker.markets.forEach(market=>{
                        let title = '';
                        if(market.key === 'h2h') title = 'Ganador';
                        if(market.key === 'totals') title = 'Totales';
                        if(market.key === 'spreads') title = 'Hándicap / Líneas';
                        if(market.key === 'correct_score') title = 'Marcador Exacto';

                        let cols = 3;
                        if(market.outcomes.length === 2){ cols = 2; }

                        marketsHTML += `
                            <div class="market-title">${title}</div>
                            <div class="market-grid ${cols===2?'two':''}">
                        `;

                        market.outcomes.slice(0,12).forEach(outcome=>{
                            let label = outcome.name;
                            if(outcome.point !== undefined){
                                label += ` ${outcome.point > 0 ? '+' : ''}${outcome.point}`;
                            }

                            marketsHTML += `
                                <div class="odd">
                                    <div class="odd-label">${label}</div>
                                    <div class="odd-value">${outcome.price}</div>
                                </div>
                            `;
                        });

                        marketsHTML += `</div>`;
                    });
                }else{
                    marketsHTML = `<div class="no-data">Sin mercados disponibles</div>`;
                }

                const pickData = generarPickAlgoritmico(h2hMarket);
                let isTopPick = false;

                if(pickData.tipo === 'PICK 5/5') {
                    contadorTopPicks++;
                    isTopPick = true;
                }

                let subTagDoble = "DOBLE OPORTUNIDAD";
                let subTagMercado = "+1.5 GOLES";

                if (deporte.includes('Básquet')) {
                    subTagDoble = "GANA CON HANDICAP";
                    subTagMercado = "+210.5 PUNTOS";
                } else if (deporte.includes('Tenis')) {
                    subTagDoble = "GANADOR DEL SET 1";
                    subTagMercado = "+21.5 GAMES";
                }

                card.innerHTML = `
                    ${isTopPick ? `<div class="top-pick">TOP PICK</div>` : ''}
                    
                    <div class="match-top">
                        <div class="league">${evento.liga}</div>
                        <div class="time">${hora}</div>
                    </div>

                    <div class="teams">
                        <div class="team">🔹 ${evento.home_team}</div>
                        <div class="team">🔸 ${evento.away_team}</div>
                    </div>

                    ${marketsHTML}

                    <div class="prediction-box">
                        <div class="prediction-title">SISTEMA GREENPICKS 3-4-5</div>
                        <div class="prediction-grid">
                            <div class="pick ${pickData.clase}">${pickData.tipo}</div>
                            <div class="pick safe">${subTagDoble}</div>
                            <div class="pick medium">${subTagMercado}</div>
                        </div>
                    </div>
                `;

                grid.appendChild(card);
            });

            dayWrapper.appendChild(grid);
            sportBlock.appendChild(dayWrapper);
        });

        content.appendChild(sportBlock);
    }

    topPicksCount.innerText = contadorTopPicks;
    filtrarDeporte(ultimoFiltro);
}

function filtrarDeporte(tipo, evento){
    ultimoFiltro = tipo;

    document.querySelectorAll('.filter-btn').forEach(btn=>{
        btn.classList.remove('active');
    });

    if(evento && evento.target) {
        evento.target.classList.add('active');
    }

    document.querySelectorAll('.sport-block').forEach(block=>{
        if(tipo === 'all'){
            block.style.display = 'block';
        } else if(block.dataset.sport === tipo){
            block.style.display = 'block';
        } else {
            block.style.display = 'none';
        }
    });
}
</script>

</body>
</html>
