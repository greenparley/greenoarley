<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GreenPicks Pro</title>
    <style>
        :root { --bg-principal: #0b0f19; --tarjeta-bg: #151f32; --tarjeta-borde: #223452; --verde-principal: #2ecc71; --oro: #f1c40f; --alerta: #e74c3c; --sonadora-color: #9b59b6; --texto-blanco: #ffffff; --texto-gris: #8a99ad; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg-principal); color: var(--texto-blanco); padding-bottom: 60px; }
        .contenedor-app { max-width: 500px; margin: 0 auto; padding: 15px; position: relative; }
        .oculto { display: none !important; }
        
        /* Lobby o Selector de Deportes */
        .lobby-container { text-align: center; padding: 30px 20px; }
        .lobby-titulo { font-size: 2.4rem; color: var(--verde-principal); margin-bottom: 8px; font-weight: 800; }
        .lobby-sub { color: var(--texto-gris); margin-bottom: 30px; font-size: 1rem; }
        .btn-deporte-card { background: linear-gradient(145deg, #151f32, #111827); border: 1px solid var(--tarjeta-borde); border-radius: 16px; padding: 22px 25px; margin-bottom: 20px; display: flex; align-items: center; justify-content: space-between; cursor: pointer; width: 100%; text-align: left; }
        .deporte-info h3 { color: var(--texto-blanco); font-size: 1.25rem; margin-bottom: 6px; }
        .deporte-info p { color: var(--texto-gris); font-size: 0.88rem; }
        .deporte-icono { font-size: 2.2rem; background: rgba(255,255,255,0.03); padding: 12px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.05); }
        
        /* Headers y Filtros Superiores */
        .app-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; padding-bottom: 10px; border-bottom: 1px solid var(--tarjeta-borde); }
        .btn-volver-lobby { background: transparent; border: 1px solid var(--tarjeta-borde); color: var(--texto-gris); padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 0.85rem; }
        .herramientas-grid { display: flex; gap: 10px; margin-bottom: 15px; }
        .buscador-input { flex: 1; background: var(--tarjeta-bg); border: 1px solid var(--tarjeta-borde); padding: 10px; border-radius: 8px; color: white; font-size: 0.9rem; }
        .btn-refresh-live { background: var(--tarjeta-bg); border: 1px solid var(--tarjeta-borde); color: white; width: 42px; border-radius: 8px; cursor: pointer; }
        .nav-filtros { display: flex; flex-wrap: wrap; background: var(--tarjeta-bg); padding: 4px; border-radius: 10px; margin-bottom: 20px; gap: 4px; }
        .btn-filto-main { flex: 1; min-width: 75px; background: transparent; border: none; color: var(--texto-gris); padding: 10px 2px; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 0.75rem; text-align: center; }
        .btn-filto-main.activo { background: var(--bg-principal); color: var(--verde-principal); }

        /* Tarjetas de Eventos / Partidos */
        .tarjeta-partido { background: var(--tarjeta-bg); border: 1px solid var(--tarjeta-borde); border-radius: 12px; padding: 15px; margin-bottom: 12px; cursor: pointer; }
        .tarjeta-partido.finalizado { opacity: 0.65; background-color: #0b0f19; border-color: #1a253a; }
        .encabezado-liga { font-size: 0.75rem; color: var(--texto-blanco); display: flex; align-items: center; gap: 8px; margin-bottom: 10px; border-bottom: 1px solid rgba(255,255,255,0.03); padding-bottom: 5px; font-weight: bold; text-transform: uppercase;}
        .etiqueta-hora { color: var(--oro); background: rgba(0,0,0,0.4); padding: 4px 8px; border-radius: 4px; font-size: 0.75rem; display: flex; align-items: center; gap: 4px; letter-spacing: 0.5px;}
        .cuerpo-partido { display: flex; justify-content: space-between; align-items: center; }
        .equipos { flex: 1; display: flex; flex-direction: column; gap: 8px; }
        .equipo-linea { display: flex; align-items: center; gap: 10px; font-size: 0.95rem; font-weight: 500; }
        .escudo-dinamico { width: 26px; height: 26px; background: linear-gradient(135deg, #1e293b, #0f172a); border: 1px solid var(--tarjeta-borde); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 0.65rem; font-weight: 800; color: #cbd5e1; text-transform: uppercase; }
        .marcador-live span, .marcador-finalizado { background: rgba(255,255,255,0.1); padding: 4px 8px; border-radius: 6px; font-size: 0.8rem; font-weight: bold; }
        .resultado-score { margin-left: auto; font-weight: bold; color: var(--oro); background: rgba(0,0,0,0.3); padding: 2px 6px; border-radius: 4px; }

        /* Pantalla Detalles del Evento */
        .cabecera-detalle-grid { display: flex; justify-content: space-between; align-items: center; margin-top: 15px; background: var(--tarjeta-bg); padding: 20px 10px; border-radius: 14px; border: 1px solid var(--tarjeta-borde); }
        .caja-consejo { background: rgba(46, 204, 113, 0.08); border-left: 4px solid var(--verde-principal); padding: 12px 15px; border-radius: 0 8px 8px 0; margin-bottom: 20px; font-size: 0.85rem; line-height: 1.5; }
        .barra-container { margin-bottom: 15px; }
        .barra-container span { display: block; font-size: 0.85rem; margin-bottom: 5px; color: var(--texto-blanco); }
        .barra-fondo { background: rgba(255,255,255,0.06); height: 10px; border-radius: 5px; overflow: hidden; width: 100%; }
        .barra-progreso { height: 100%; width: 0%; border-radius: 5px; transition: width 0.6s; }
        .cuota-real-badge { background: rgba(255,255,255,0.1); padding: 2px 6px; border-radius: 4px; color: var(--oro); font-size: 0.8rem; margin-left: 8px;}
        .bloque-mercado { background: #111827; border: 1px solid var(--tarjeta-borde); padding: 15px; border-radius: 10px; margin-bottom: 15px; }
        .titulo-mercado { color: var(--oro); font-size: 0.9rem; font-weight: bold; margin-bottom: 12px; border-bottom: 1px dashed rgba(255,255,255,0.1); padding-bottom: 6px; }

        /* Selectores de Más/Menos interactivos */
        .btn-toggle-group { display: flex; background: rgba(0,0,0,0.4); padding: 2px; border-radius: 6px; border: 1px solid var(--tarjeta-borde); }
        .btn-toggle-item { background: transparent; border: none; color: var(--texto-gris); padding: 4px 10px; font-size: 0.72rem; font-weight: bold; border-radius: 4px; cursor: pointer; transition: all 0.2s; }
        .btn-toggle-item.activo { background: var(--verde-principal); color: #0b0f19; }

        /* Secciones de Tickets */
        .selector-riesgo-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; margin-bottom: 15px; }
        .btn-riesgo { padding: 10px 2px; border-radius: 8px; border: 1px solid var(--tarjeta-borde); background: var(--tarjeta-bg); color: white; font-size: 0.72rem; font-weight: bold; cursor: pointer; text-align: center; }
        .btn-riesgo.activo-asegurada { background: rgba(46, 204, 113, 0.2); border-color: var(--verde-principal); color: var(--verde-principal); }
        .btn-riesgo.activo-moderada { background: rgba(241, 196, 15, 0.2); border-color: var(--oro); color: var(--oro); }
        .btn-riesgo.activo-arriesgada { background: rgba(231, 76, 60, 0.2); border-color: var(--alerta); color: var(--alerta); }
        .tarjeta-combinada { background: var(--tarjeta-bg); border: 1px solid var(--tarjeta-borde); border-radius: 12px; padding: 15px; margin-bottom: 15px; }
        .ticket-item { background: rgba(0,0,0,0.2); padding: 10px; border-radius: 6px; margin-bottom: 8px; font-size: 0.85rem; }

        /* Menú de Navegación Inferior */
        .bottom-nav { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 500px; background: #0e1726; border-top: 1px solid var(--tarjeta-borde); display: flex; height: 55px; z-index: 999; }
        .nav-item-btn { flex: 1; background: transparent; border: none; color: var(--texto-gris); display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 0.75rem; cursor: pointer; }
        .nav-item-btn.activo { color: var(--verde-principal); }
        .badge-contador { background: var(--verde-principal); color: #111; font-size: 0.7rem; font-weight: bold; padding: 1px 5px; border-radius: 10px; position: absolute; top: 4px; right: 22%; }
        
        /* Panel Lateral de Picks Guardados */
        .panel-picks-lateral { position: fixed; top: 0; right: 0; width: 100%; max-width: 320px; height: 100%; background: #0c1322; border-left: 1px solid var(--tarjeta-borde); z-index: 10000; padding: 20px; transition: transform 0.3s; }
        .oculto-panel { transform: translateX(100%); }
        .panel-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid var(--tarjeta-borde); padding-bottom: 10px; }
        .item-pick-guardado { background: var(--tarjeta-bg); border: 1px solid var(--tarjeta-borde); border-radius: 8px; padding: 12px; font-size: 0.85rem; margin-bottom:10px; }
    </style>
</head>
<body>

    <div class="contenedor-app">
        <div id="lobby-selector" class="lobby-container">
            <h1 class="lobby-titulo">GreenPicks Pro</h1>
            <p class="lobby-sub">Plataforma de Tendencias Deportivas</p>

            <button class="btn-deporte-card" onclick="irADeporte('futbol')">
                <div class="deporte-info"><h3>Fútbol Profesional ⚽</h3><p>Ligas Globales, Copas y Selecciones</p></div><div class="deporte-icono">🏟️</div>
            </button>
            <button class="btn-deporte-card" onclick="irADeporte('basquet')">
                <div class="deporte-info"><h3>Básquetbol Global 🏀</h3><p>Cartelera Directa de ESPN</p></div><div class="deporte-icono">🏀</div>
            </button>
            <button class="btn-deporte-card" onclick="irADeporte('tenis')">
                <div class="deporte-info"><h3>Tenis Internacional 🎾</h3><p>Torneos ATP, WTA y Grandes Slams</p></div><div class="deporte-icono">🎾</div>
            </button>
        </div>

        <div id="app-content" class="oculto">
            <div class="app-header">
                <button class="btn-volver-lobby" onclick="volverAlLobby()">⬅️ Volver</button>
                <h2 id="titulo-deporte-activo" style="color: var(--verde-principal);">FÚTBOL</h2>
            </div>
            
            <div id="logs-servidor-error" class="oculto"></div>
            
            <div id="herramientas-top" class="herramientas-grid">
                <input type="text" id="filtro-ligas-input" oninput="aplicarFiltrosMaster()" placeholder="Buscar equipo o liga..." class="buscador-input">
                <button id="btn-refresh" class="btn-refresh-live" onclick="forzarActualizacion()">🔄</button>
            </div>
            
            <div class="nav-filtros">
                <button id="btn-proximos" class="btn-filto-main activo" onclick="setFiltroEstado('proximos')">Próximos</button>
                <button id="btn-envivo" class="btn-filto-main" onclick="setFiltroEstado('envivo')">🔴 En Vivo</button>
                <button id="btn-finalizados" class="btn-filto-main" onclick="setFiltroEstado('finalizados')">🏁 Finalizados</button>
                <button id="btn-combinada" class="btn-filto-main" onclick="setFiltroEstado('combinada')">Combinadas</button>
                <button id="btn-sonadora" class="btn-filto-main" onclick="setFiltroEstado('sonadora')">✨ Soñadoras</button>
            </div>
            
            <div id="contenedor-partidos"></div>
            
            <div id="seccion-combinada" class="oculto">
                <div class="selector-riesgo-grid">
                    <button id="riesgo-cb-asegurada" class="btn-riesgo activo-asegurada" onclick="cambiarRiesgoCombinada('asegurada')">Asegurada (80-100%)</button>
                    <button id="riesgo-cb-moderada" class="btn-riesgo" onclick="cambiarRiesgoCombinada('moderada')">Moderada (60-80%)</button>
                    <button id="riesgo-cb-arriesgada" class="btn-riesgo" onclick="cambiarRiesgoCombinada('arriesgada')">Arriesgada (40-60%)</button>
                </div>
                <div id="combinada-ticket-render"></div>
            </div>

            <div id="seccion-sonadora" class="oculto">
                <div class="selector-riesgo-grid">
                    <button id="riesgo-sn-asegurada" class="btn-riesgo activo-asegurada" onclick="cambiarRiesgoSonadora('asegurada')">Asegurada (80-100%)</button>
                    <button id="riesgo-sn-moderada" class="btn-riesgo" onclick="cambiarRiesgoSonadora('moderada')">Moderada (60-80%)</button>
                    <button id="riesgo-sn-arriesgada" class="btn-riesgo" onclick="cambiarRiesgoSonadora('arriesgada')">Arriesgada (40-60%)</button>
                </div>
                <div id="sonadora-ticket-render"></div>
            </div>
        </div>

        <div id="vista-detalle" class="oculto">
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <button class="btn-volver-lobby" onclick="cerrarDetalle()">⬅️ Volver atrás</button>
            </div>
            <div class="cabecera-detalle-grid" id="detalle-cabecera"></div>
            <div id="detalle-consejo" style="margin-top: 15px;"></div>
            <div id="detalle-barras"></div>
        </div>
    </div>

    <div class="bottom-nav">
        <button class="nav-item-btn activo" onclick="cerrarDetalle(); setFiltroEstado('proximos');"><span>🏟️</span><span>Eventos</span></button>
        <button class="nav-item-btn" style="position:relative;" onclick="togglePanelPicks()">
            <span id="contador-picks-badge" class="badge-contador">0</span><span>📋</span><span>Mis Picks</span>
        </button>
    </div>
    
    <div id="panel-picks" class="panel-picks-lateral oculto-panel">
        <div class="panel-header"><h3>Mis Picks</h3><button class="btn-volver-lobby" onclick="togglePanelPicks()">❌</button></div>
        <div id="contenedor-lista-picks"></div>
    </div>

    <script>
        // LISTA DE TUS API KEYS PARA ROTACIÓN AUTOMÁTICA CONFIGURADA
        const API_KEYS = [
            "b1068f561f80975166b5c1ab67a2888a",
            "c7b062bf872742e25c086b5ad997ba0a",
            "f900242e004a6964ac7d711eafca119c",
            "12645d55775fe9919ad938d99af60474"
        ];
        
        let indiceApiKeyActual = 0;
        function obtenerApiKeyActiva() { return API_KEYS[indiceApiKeyActual]; }
        
        function rotarApiKey() {
            indiceApiKeyActual++;
            if (indiceApiKeyActual >= API_KEYS.length) {
                indiceApiKeyActual = 0; 
                return false; 
            }
            return true;
        }

        async function fetchConRotacion(urlTemplate) {
            let url = urlTemplate.replace('API_KEY_PLACEHOLDER', obtenerApiKeyActiva());
            let res = await fetch(url);
            
            if (res.status === 401 || res.status === 429) {
                console.log("API Key agotada o rechazada. Cambiando a la siguiente...");
                if (rotarApiKey()) {
                    url = urlTemplate.replace('API_KEY_PLACEHOLDER', obtenerApiKeyActiva());
                    res = await fetch(url);
                }
            }
            return res;
        }

        let baseDeDatosHoy = [];
        let estadoFiltroActual = 'proximos';
        let riesgoCombinadaSeleccionado = 'asegurada';
        let riesgoSonadoraSeleccionado = 'asegurada';
        let ticketsMultiplesGenerados = {}; 
        let deporteActivo = 'futbol'; 

        // CONFIGURACIÓN DE LIGAS AMPLIADA
        const MAPEO_LIGAS = {
            "soccer_epl": "Premier League",
            "soccer_spain_la_liga": "LaLiga",
            "soccer_italy_serie_a": "Serie A",
            "soccer_germany_bundesliga": "Bundesliga",
            "soccer_france_ligue_one": "Ligue 1",
            "soccer_portugal_primeira_liga": "Primeira Liga (POR)",
            "soccer_netherlands_eredivisie": "Eredivisie (NED)",
            "soccer_belgium_first_div": "Pro League (BEL)",
            "soccer_turkey_super_league": "Süper Lig (TUR)",
            "soccer_greece_super_league": "Super League (GRE)",
            "soccer_saudi_arabia_pro_league": "Saudi Pro League",
            "soccer_argentina_primera": "Liga Profesional Arg",
            "soccer_brazil_campeonato": "Brasileirão",
            "soccer_usa_mls": "MLS",
            "soccer_norway_eliteserien": "Eliteserien (Noruega)",
            "soccer_spl": "Premiership (Escocia)",
            "soccer_conmebol_copa_libertadores": "Copa Libertadores",
            "soccer_conmebol_copa_sudamericana": "Copa Sudamericana",
            "soccer_uefa_champs_league": "Champions League",
            "soccer_uefa_europa_league": "Europa League",
            "soccer_fifa_world_cup": "Copa Mundial FIFA",
            "soccer_friendly_match_men": "Amistosos Internacionales"
        };

        function generarMonograma(nombre, extraClass = "") {
            if(!nombre) nombre = "X";
            const iniciales = nombre.substring(0,3).toUpperCase();
            return `<div class="escudo-dinamico ${extraClass}">${iniciales}</div>`;
        }

        function formatearFechaHoraLocal(fechaIso) {
            if (!fechaIso) return "--/-- --:--";
            const f = new Date(fechaIso);
            const dia = String(f.getDate()).padStart(2, '0');
            const mes = String(f.getMonth() + 1).padStart(2, '0');
            const horas = String(f.getHours()).padStart(2, '0');
            const mins = String(f.getMinutes()).padStart(2, '0');
            return `${dia}/${mes} - ${horas}:${mins}`;
        }

        function procesarEstadoTiempo(fechaIso) {
            const ahora = Date.now();
            const inicio = new Date(fechaIso).getTime();
            const diff = ahora - inicio;
            if (diff > 0 && diff < 9000000) return { isLiveNative: true, isFinished: false };
            else if (diff >= 9000000 && diff < 86400000) return { isLiveNative: false, isFinished: true }; 
            return { isLiveNative: false, isFinished: false };
        }

        function mostrarError(mensaje) {
            const logBox = document.getElementById('logs-servidor-error');
            logBox.innerHTML = `<div style="background: rgba(231, 76, 60, 0.15); border: 1px solid var(--alerta); padding: 15px; border-radius: 10px; margin-bottom: 15px; font-size: 0.9rem; text-align: center;"><b>⚠️ Estado de API</b><br>${mensaje}</div>`;
            logBox.classList.remove('oculto');
        }

        async function cargarDatosDeportivos() {
            document.getElementById('logs-servidor-error').classList.add('oculto');
            const cacheKey = `sports_cache_mix_v4_${deporteActivo}`;
            localStorage.removeItem(cacheKey);

            let datosProcesados = [];
            if (deporteActivo === 'futbol') datosProcesados = await fetchFutbolOddsApiAgrupado();
            else if (deporteActivo === 'basquet') datosProcesados = await fetchBasketESPNPublico();
            else if (deporteActivo === 'tenis') datosProcesados = await fetchTenisOddsApi();

            if (datosProcesados.length > 0) {
                datosProcesados.sort((a, b) => new Date(a.utcDate) - new Date(b.utcDate));
                localStorage.setItem(cacheKey, JSON.stringify({ timestamp: Date.now(), data: datosProcesados }));
            }
            return datosProcesados;
        }

        async function fetchFutbolOddsApiAgrupado() {
            let poolDePartidosUnificados = [];
            const ligasParaBuscar = Object.keys(MAPEO_LIGAS);
            
            try {
                let promesas = ligasParaBuscar.map(async (liga) => {
                    let res = await fetchConRotacion(`https://api.the-odds-api.com/v4/sports/${liga}/odds/?apiKey=API_KEY_PLACEHOLDER&regions=eu&markets=h2h`);
                    if (!res.ok) return [];
                    return await res.json();
                });
                
                let resultados = await Promise.all(promesas);
                
                resultados.forEach(ligaData => {
                    if(!Array.isArray(ligaData)) return;
                    
                    ligaData.forEach(partido => {
                        let nombreLiga = MAPEO_LIGAS[partido.sport_key] || partido.sport_title || "Fútbol";
                        let cuotas = { local: "N/A", empate: "N/A", visita: "N/A" };
                        
                        if (partido.bookmakers && partido.bookmakers.length > 0 && partido.bookmakers[0].markets[0].outcomes) {
                            partido.bookmakers[0].markets[0].outcomes.forEach(out => { 
                                if (out.name === partido.home_team) cuotas.local = out.price; 
                                else if (out.name === partido.away_team) cuotas.visita = out.price; 
                                else cuotas.empate = out.price;
                            });
                        }
                        let estado = procesarEstadoTiempo(partido.commence_time);
                        poolDePartidosUnificados.push({
                            id: 'fb_' + partido.id, 
                            utcDate: partido.commence_time, 
                            competition: { name: nombreLiga },
                            homeTeam: { name: partido.home_team, score: estado.isFinished ? "F" : "" }, 
                            awayTeam: { name: partido.away_team, score: estado.isFinished ? "F" : "" },
                            cuotasReales: cuotas, 
                            isLiveNative: estado.isLiveNative, 
                            isFinished: estado.isFinished
                        });
                    });
                });
            } catch (error) { 
                mostrarError("Error crítico conectando con los servidores de Fútbol.");
            }
            return poolDePartidosUnificados;
        }

        async function fetchBasketESPNPublico() {
            let pool = []; const endpoints = [{ id: "nba", tag: "NBA" }, { id: "mens-euroleague", tag: "Euroliga" }];
            let d1 = new Date(); d1.setDate(d1.getDate() - 1); 
            let d2 = new Date(); d2.setDate(d2.getDate() + 7); 
            let fechas = `dates=${d1.toISOString().split('T')[0].replace(/-/g, '')}-${d2.toISOString().split('T')[0].replace(/-/g, '')}`;
            
            for (let liga of endpoints) {
                try {
                    const res = await fetch(`https://site.api.espn.com/apis/site/v2/sports/basketball/${liga.id}/scoreboard?${fechas}&limit=100`);
                    if (!res.ok) continue; const data = await res.json(); if (!data || !data.events) continue;
                    const procesados = data.events.map(evento => {
                        const localRaw = evento.competitions[0].competitors.find(c => c.homeAway === 'home');
                        const visitaRaw = evento.competitions[0].competitors.find(c => c.homeAway === 'away');
                        let estadoLive = (evento.status.type.state === "in");
                        let estadoFinalizado = (evento.status.type.state === "post");
                        let sLocal = (estadoLive || estadoFinalizado) ? localRaw.score : "";
                        let sVisita = (estadoLive || estadoFinalizado) ? visitaRaw.score : "";

                        return {
                            id: 'bk_' + evento.id, utcDate: evento.date, competition: { name: liga.tag }, 
                            homeTeam: { name: localRaw.team.displayName, score: sLocal },
                            awayTeam: { name: visitaRaw.team.displayName, score: sVisita }, 
                            cuotasReales: { local: 1.85, empate: "N/A", visita: 1.95 }, 
                            isLiveNative: estadoLive, isFinished: estadoFinalizado
                        };
                    });
                    pool = pool.concat(procesados);
                } catch (err) {}
            }
            return pool;
        }

        async function fetchTenisOddsApi() {
            let pool = [];
            try {
                let resSports = await fetchConRotacion(`https://api.the-odds-api.com/v4/sports/?apiKey=API_KEY_PLACEHOLDER`);
                if (!resSports.ok) return [];
                let sports = await resSports.json();
                let torneosDeTenisActivos = sports.filter(s => s.group === 'Tennis').map(s => s.key).slice(0, 4);
                if(torneosDeTenisActivos.length === 0) return [];

                let promesas = torneosDeTenisActivos.map(async (liga) => {
                    let res = await fetchConRotacion(`https://api.the-odds-api.com/v4/sports/${liga}/odds/?apiKey=API_KEY_PLACEHOLDER&regions=eu&markets=h2h`);
                    if (!res.ok) return [];
                    return await res.json();
                });
                
                let resultados = await Promise.all(promesas);
                
                resultados.forEach(torneoData => {
                    if(!Array.isArray(torneoData)) return;
                    torneoData.forEach(partido => {
                        let cuotas = { local: "N/A", empate: "N/A", visita: "N/A" };
                        if (partido.bookmakers && partido.bookmakers.length > 0 && partido.bookmakers[0].markets[0].outcomes) {
                            partido.bookmakers[0].markets[0].outcomes.forEach(out => { 
                                if (out.name === partido.home_team) cuotas.local = out.price; 
                                else if (out.name === partido.away_team) cuotas.visita = out.price; 
                            });
                        }
                        let estado = procesarEstadoTiempo(partido.commence_time);
                        pool.push({ 
                            id: 'tn_' + partido.id, utcDate: partido.commence_time, competition: { name: partido.sport_title || "Tenis ATP/WTA" }, 
                            homeTeam: { name: partido.home_team, score: estado.isFinished ? "F" : "" }, 
                            awayTeam: { name: partido.away_team, score: estado.isFinished ? "F" : "" }, 
                            cuotasReales: cuotas, isLiveNative: estado.isLiveNative, isFinished: estado.isFinished 
                        });
                    });
                });
            } catch (error) { 
                mostrarError("Error crítico conectando con los servidores de Tenis.");
            }
            return pool;
        }

            let f = baseDeDatosHoy; 
            
            if (estadoFiltroActual === 'envivo') f = f.filter(p => p.isLiveNative && !p.isFinished);
            else if (estadoFiltroActual === 'finalizados') f = f.filter(p => p.isFinished);
            else if (estadoFiltroActual === 'proximos') f = f.filter(p => !p.isFinished && !p.isLiveNative);
            
            const i = document.getElementById('filtro-ligas-input'); 
            if (i && i.value.trim() !== '') { 
                const txt = i.value.toLowerCase().trim(); 
                f = f.filter(p => p.competition.name.toLowerCase().includes(txt) || p.homeTeam.name.toLowerCase().includes(txt) || p.awayTeam.name.toLowerCase().includes(txt)); 
            }
            
            const c = document.getElementById('contenedor-partidos'); c.innerHTML = '';
            if (f.length === 0) { 
                if(!document.getElementById('logs-servidor-error').innerHTML) {
                    c.innerHTML = `<p style="padding:30px; text-align:center; color:var(--texto-gris);">No hay eventos programados en esta sección.</p>`; 
                }
                return; 
            }
            
            f.forEach(p => { 
                let renderEstado = `🏟️ Ver Análisis`; let claseExtra = p.isFinished ? 'finalizado' : '';
                
                if (p.isFinished) { renderEstado = `<span class="marcador-finalizado">🏁 TERMINADO</span>`; } 
                else if (p.isLiveNative) { renderEstado = `<span style="color:var(--alerta); font-weight:bold;">🔴 EN VIVO</span>`; }

                let sLocal = p.homeTeam.score ? `<span class="resultado-score">${p.homeTeam.score}</span>` : '';
                let sVisita = p.awayTeam.score ? `<span class="resultado-score">${p.awayTeam.score}</span>` : '';
                let renderHora = p.utcDate ? `<span class="etiqueta-hora">🕒 ${formatearFechaHoraLocal(p.utcDate)}</span>` : '';

                c.innerHTML += `<div class="tarjeta-partido ${claseExtra}" onclick="abrirDetalle('${p.id}')">
                    <div class="encabezado-liga">${renderHora} <span>${p.competition.name}</span></div>
                    <div class="cuerpo-partido"><div class="equipos">
                        <div class="equipo-linea">${generarMonograma(p.homeTeam.name)} ${p.homeTeam.name} ${sLocal}</div>
                        <div class="equipo-linea">${generarMonograma(p.awayTeam.name)} ${p.awayTeam.name} ${sVisita}</div>
                    </div><div class="marcador-live">${renderEstado}</div></div></div>`;
            });
        }

        function analizarProbabilidadYValor(p) {
            let cL = p.cuotasReales.local !== "N/A" ? parseFloat(p.cuotasReales.local) : 1.95;
            let cV = p.cuotasReales.visita !== "N/A" ? parseFloat(p.cuotasReales.visita) : 1.95;
            let isHomeFav = cL <= cV;
            return { favName: isHomeFav ? p.homeTeam.name : p.awayTeam.name, favOdds: isHomeFav ? cL : cV };
        }

        function obtenerCarteleraAgrupada() {
            const carteleraFiltro = baseDeDatosHoy.filter(p => !p.isFinished && !p.isLiveNative);
            const partidosPorDia = {};
            carteleraFiltro.forEach(p => {
                if (!p.utcDate) return;
                const d = new Date(p.utcDate);
                const fechaCorta = d.toLocaleDateString('es-ES', {day: '2-digit', month: '2-digit'});
                if (!partidosPorDia[fechaCorta]) partidosPorDia[fechaCorta] = [];
                partidosPorDia[fechaCorta].push(p);
            });
            return partidosPorDia;
        }

        function generarCombinadaDelDia() {
            const renderContenedor = document.getElementById('combinada-ticket-render'); 
            renderContenedor.innerHTML = ''; const partidosPorDia = obtenerCarteleraAgrupada();
            let combinadasTotales = 0; let htmlCompletoRender = '';

            for (const dia in partidosPorDia) {
                let carteleraDia = partidosPorDia[dia]; if (carteleraDia.length < 3) continue;
                let maxCombinadas = Math.min(Math.floor(carteleraDia.length / 3), 5);
                
                let tituloColor = "var(--verde-principal)"; let tituloBg = "rgba(46, 204, 113, 0.1)";
                if (riesgoCombinadaSeleccionado === 'moderada') { tituloColor = "var(--oro)"; tituloBg = "rgba(241, 196, 15, 0.1)"; }
                if (riesgoCombinadaSeleccionado === 'arriesgada') { tituloColor = "var(--alerta)"; tituloBg = "rgba(231, 76, 60, 0.1)"; }

                htmlCompletoRender += `<div style="background: ${tituloBg}; border: 1px solid ${tituloColor}; color: ${tituloColor}; padding: 8px; border-radius: 6px; text-align: center; margin: 20px 0 12px 0; font-weight: bold; font-size: 0.85rem;">🗓️ COMBINADAS DE LA FECHA: ${dia}</div>`;

                for (let i = 0; i < maxCombinadas; i++) {
                    let idTicket = `cb_${dia.replace('/','')}_r_${riesgoCombinadaSeleccionado}_${i}`;
                    let poolPicks = []; let colorBorde = ""; let badgeTexto = "";
                    let partidosCombo = [carteleraDia[i*3], carteleraDia[i*3+1], carteleraDia[i*3+2]];

                    partidosCombo.forEach(p => {
                        let analisis = analizarProbabilidadYValor(p); let pickMercado = ""; let pickCuota = 1.0;

                        if (riesgoCombinadaSeleccionado === 'asegurada') {
                            colorBorde = "var(--verde-principal)"; badgeTexto = "🔒 TRIPLE ASEGURADA (80%-100%)";
                            pickMercado = (deporteActivo === 'futbol') ? `Doble Oportunidad: ${analisis.favName} o Empate` : `Ganador Set: ${analisis.favName}`;
                            pickCuota = Math.max(1.12, Math.min(1.28, analisis.favOdds / 1.3)); 
                        } else if (riesgoCombinadaSeleccionado === 'moderada') {
                            colorBorde = "var(--oro)"; badgeTexto = "📊 TRIPLE MODERADA (60%-80%)";
                            pickMercado = `Ganador Directo: ${analisis.favName}`; pickCuota = Math.max(1.30, Math.min(1.70, analisis.favOdds)); 
                        } else if (riesgoCombinadaSeleccionado === 'arriesgada') {
                            colorBorde = "var(--alerta)"; badgeTexto = "🔥 TRIPLE ARRIESGADA (40%-60%)";
                            pickMercado = (deporteActivo === 'futbol') ? `Gana ${analisis.favName} y Más de 1.5 Goles` : `Resultado Exacto Sets: 2-0`;
                            pickCuota = Math.max(1.70, Math.min(2.30, analisis.favOdds * 1.25)); 
                        }
                        poolPicks.push({ p: p, mercado: pickMercado, cuota: pickCuota });
                    });

                    ticketsMultiplesGenerados[idTicket] = poolPicks; let totalCuota = 1.0;
                    let h = `<div class="tarjeta-combinada" style="border-top: 4px solid ${colorBorde};"><div style="margin-bottom:12px;"><span style="color:${colorBorde}; font-weight:bold; font-size:0.75rem; display:block;">${badgeTexto}</span></div>`;
                    
                    poolPicks.forEach(c => {
                        totalCuota *= c.cuota;
                        h += `<div class="ticket-item"><div style="font-size:0.75rem; color:var(--texto-gris);">🏟️ ${c.p.competition.name}</div>
                            📍 <b>${c.p.homeTeam.name} vs ${c.p.awayTeam.name}</b><br>
                            <span style="color:var(--oro)">🎯 Pick:</span> ${c.mercado} <strong style="color:var(--verde-principal); float:right;">x${c.cuota.toFixed(2)}</strong></div>`;
                    });
                    
                    let textColorBtn = (colorBorde === "var(--alerta)") ? "#fff" : "#111";
                    h += `<div style="text-align:right; margin:15px 0 10px 0; font-size:1.1rem; font-weight:800; color:var(--oro)">Cuota Total: <span style="background:rgba(241,196,15,0.1); padding:4px 8px; border-radius:6px;">x${totalCuota.toFixed(2)}</span></div>
                    <button onclick="guardarCombinada('${idTicket}')" style="width:100%; background:${colorBorde}; color:${textColorBtn}; border:none; font-weight:bold; padding:12px; border-radius:8px; cursor:pointer;">🔒 Guardar en Mis Picks</button></div>`;
                    
                    htmlCompletoRender += h; combinadasTotales++;
                }
            }
            renderContenedor.innerHTML = combinadasTotales === 0 ? `<p style="padding:40px 20px; text-align:center; color:var(--texto-gris);">⚠️ Se necesitan al menos 3 partidos en cartelera para armar tripletas automáticas.</p>` : htmlCompletoRender;
        }

        // MOTOR EV+ INTELIGENTE MULTI-MERCADO DE LA SOÑADORA
        function generarSonadoraDelDia() {
            const renderContenedor = document.getElementById('sonadora-ticket-render'); renderContenedor.innerHTML = '';
            const partidosPorDia = obtenerCarteleraAgrupada(); let ticketsSonadoresTotales = 0; let htmlCompletoRender = '';

            for (const dia in partidosPorDia) {
                let carteleraDia = partidosPorDia[dia]; if (carteleraDia.length < 2) continue; 
                let idTicket = `sn_${dia.replace(/\//g,'')}_r_${riesgoSonadoraSeleccionado}`; let poolPicks = [];
                
                let badgeTexto = "🔮 MEGATICKET SOÑADOR: ASEGURADO";
                if (riesgoSonadoraSeleccionado === 'moderada') badgeTexto = "🔮 MEGATICKET SOÑADOR: MODERADO";
                if (riesgoSonadoraSeleccionado === 'arriesgada') badgeTexto = "🔮 MEGATICKET SOÑADOR: ARRIESGADO";

                htmlCompletoRender += `<div style="background: rgba(155, 89, 182, 0.12); border: 1px solid var(--sonadora-color); color: var(--sonadora-color); padding: 8px; border-radius: 6px; text-align: center; margin: 20px 0 12px 0; font-weight: bold; font-size: 0.85rem;">✨ CARTELERA COMPLETA DE LA FECHA: ${dia}</div>`;

                carteleraDia.forEach((p) => {
                    let probL = p.cuotasReales.local !== "N/A" ? Math.round((1 / parseFloat(p.cuotasReales.local)) * 100) : 50;
                    let probV = p.cuotasReales.visita !== "N/A" ? Math.round((1 / parseFloat(p.cuotasReales.visita)) * 100) : 50;
                    let probE = (deporteActivo === 'futbol' && p.cuotasReales.empate !== "N/A") ? Math.round((1 / parseFloat(p.cuotasReales.empate)) * 100) : 0;
                    
                    let mercadosCandidatos = []; 

                    if (deporteActivo === 'futbol') {
                        let gol15 = Math.min(94, Math.max(70, 85 + (probE % 10)));
                        let gol25 = Math.min(82, Math.max(40, 55 + (probL % 15) - (probE % 8)));
                        let cor85 = Math.min(85, Math.max(55, 60 + (probL % 12)));
                        let tar45 = Math.min(75, Math.max(40, 50 + (probE % 15)));
                        let golPMLocal = Math.min(85, Math.max(15, 35 + (probL * 0.4)));
                        let golPMVisita = Math.min(85, Math.max(15, 35 + (probV * 0.4)));
                        let probDobleLocal = Math.min(95, probL + probE);
                        let probDobleVisita = Math.min(95, probV + probE);

                        if(p.cuotasReales.local !== "N/A") mercadosCandidatos.push({ m: `Gana ${p.homeTeam.name}`, p: probL, c: parseFloat(p.cuotasReales.local) });
                        if(p.cuotasReales.visita !== "N/A") mercadosCandidatos.push({ m: `Gana ${p.awayTeam.name}`, p: probV, c: parseFloat(p.cuotasReales.visita) });
                        if(p.cuotasReales.empate !== "N/A") mercadosCandidatos.push({ m: `Empate`, p: probE, c: parseFloat(p.cuotasReales.empate) });
                        
                        mercadosCandidatos.push({ m: `Doble Oportunidad: ${p.homeTeam.name} o Empate`, p: probDobleLocal, c: parseFloat((100 / Math.max(1, probDobleLocal) * 0.95).toFixed(2)) });
                        mercadosCandidatos.push({ m: `Doble Oportunidad: ${p.awayTeam.name} o Empate`, p: probDobleVisita, c: parseFloat((100 / Math.max(1, probDobleVisita) * 0.95).toFixed(2)) });
                        mercadosCandidatos.push({ m: `Más de 1.5 Goles totales`, p: gol15, c: parseFloat((100 / Math.max(1, gol15) * 0.92).toFixed(2)) });
                        mercadosCandidatos.push({ m: `Más de 2.5 Goles totales`, p: gol25, c: parseFloat((100 / Math.max(1, gol25) * 0.92).toFixed(2)) });
                        mercadosCandidatos.push({ m: `Más de 8.5 Córners`, p: cor85, c: parseFloat((100 / Math.max(1, cor85) * 0.92).toFixed(2)) });
                        mercadosCandidatos.push({ m: `Más de 4.5 Tarjetas`, p: tar45, c: parseFloat((100 / Math.max(1, tar45) * 0.92).toFixed(2)) });
                        mercadosCandidatos.push({ m: `${p.homeTeam.name} marca en el Primer Tiempo`, p: golPMLocal, c: parseFloat((100 / Math.max(1, golPMLocal) * 0.92).toFixed(2)) });
                        mercadosCandidatos.push({ m: `${p.awayTeam.name} marca en el Primer Tiempo`, p: golPMVisita, c: parseFloat((100 / Math.max(1, golPMVisita) * 0.92).toFixed(2)) });
                    
                    } else if (deporteActivo === 'tenis') {
                        let setL = Math.min(88, Math.max(15, probL + 4)); let setV = 100 - setL;
                        if(p.cuotasReales.local !== "N/A") mercadosCandidatos.push({ m: `Gana ${p.homeTeam.name}`, p: probL, c: parseFloat(p.cuotasReales.local) });
                        if(p.cuotasReales.visita !== "N/A") mercadosCandidatos.push({ m: `Gana ${p.awayTeam.name}`, p: probV, c: parseFloat(p.cuotasReales.visita) });
                        mercadosCandidatos.push({ m: `${p.homeTeam.name} gana el 1er Set`, p: setL, c: parseFloat((100 / Math.max(1, setL) * 0.92).toFixed(2)) });
                        mercadosCandidatos.push({ m: `${p.awayTeam.name} gana el 1er Set`, p: setV, c: parseFloat((100 / Math.max(1, setV) * 0.92).toFixed(2)) });
                        mercadosCandidatos.push({ m: `Más de 21.5 Juegos totales`, p: 60, c: 1.75 }); 
                    
                    } else if (deporteActivo === 'basquet') {
                        if(p.cuotasReales.local !== "N/A") mercadosCandidatos.push({ m: `Gana ${p.homeTeam.name}`, p: probL, c: parseFloat(p.cuotasReales.local) });
                        if(p.cuotasReales.visita !== "N/A") mercadosCandidatos.push({ m: `Gana ${p.awayTeam.name}`, p: probV, c: parseFloat(p.cuotasReales.visita) });
                        mercadosCandidatos.push({ m: `Hándicap Positivo: ${probL > probV ? p.awayTeam.name : p.homeTeam.name}`, p: 70, c: 1.45 });
                    }

                    let mercadosValidos = [];
                    if (riesgoSonadoraSeleccionado === 'asegurada') {
                        mercadosValidos = mercadosCandidatos.filter(x => x.p >= 70 && x.c > 1.05);
                    } else if (riesgoSonadoraSeleccionado === 'moderada') {
                        mercadosValidos = mercadosCandidatos.filter(x => x.p >= 50 && x.p < 75 && x.c >= 1.30);
                    } else if (riesgoSonadoraSeleccionado === 'arriesgada') {
                        mercadosValidos = mercadosCandidatos.filter(x => x.p < 55 && x.c >= 1.80);
                    }

                    if (mercadosValidos.length === 0) mercadosValidos = [...mercadosCandidatos]; 

                    // Algoritmo matemático de valor esperado (EV) para optimizar el pick
                    mercadosValidos.sort((a, b) => ((b.p / 100) * b.c) - ((a.p / 100) * a.c));
                    let elMejorPick = mercadosValidos[0];

                    poolPicks.push({ p: p, mercado: elMejorPick.m, cuota: elMejorPick.c, prob: elMejorPick.p });
                });

                ticketsMultiplesGenerados[idTicket] = poolPicks; let totalCuota = 1.0;
                let h = `<div class="tarjeta-combinada" style="border-top: 4px solid var(--sonadora-color);"><div style="margin-bottom:12px;"><span style="color:var(--sonadora-color); font-weight:bold; font-size:0.75rem; display:block;">${badgeTexto}</span></div>`;

                poolPicks.forEach(c => {
                    totalCuota *= c.cuota;
                    h += `<div class="ticket-item"><div style="font-size:0.75rem; color:var(--texto-gris);">🏟️ ${c.p.competition.name}</div>
                        📍 <b>${c.p.homeTeam.name} vs ${c.p.awayTeam.name}</b><br>
                        <span style="color:var(--oro)">🎯 Mejor Pick (EV+):</span> ${c.mercado} 
                        <div style="margin-top: 5px; display:flex; justify-content:space-between; align-items:center;">
                            <span style="font-size: 0.75rem; color: var(--texto-gris);">Probabilidad calculada: ${c.prob}%</span>
                            <strong style="color:var(--verde-principal);">x${c.cuota.toFixed(2)}</strong>
                        </div></div>`;
                });

                h += `<div style="text-align:right; margin:15px 0 10px 0; font-size:1.1rem; font-weight:800; color:var(--oro)">Cuota Megaticket: <span style="background:rgba(241,196,15,0.1); padding:4px 8px; border-radius:6px;">x${totalCuota.toFixed(2)}</span></div>
                <button onclick="guardarCombinada('${idTicket}')" style="width:100%; background:var(--sonadora-color); color:#fff; border:none; font-weight:bold; padding:12px; border-radius:8px; cursor:pointer;">🔮 Guardar Todo en Mis Picks</button></div>`;

                htmlCompletoRender += h; ticketsSonadoresTotales++;
            }
            renderContenedor.innerHTML = ticketsSonadoresTotales === 0 ? `<p style="padding:40px 20px; text-align:center; color:var(--texto-gris);">⚠️ Esperando partidos cargados para agrupar boletos gigantes.</p>` : htmlCompletoRender;
        }

        function obtenerPicksLocales() { return JSON.parse(localStorage.getItem('gp_picks')) || []; }
        function guardarCombinada(idT) { 
            let h = obtenerPicksLocales(); let tk = ticketsMultiplesGenerados[idT]; if (!tk) return; 
            tk.forEach(i => { h.push({ id: Date.now() + Math.random(), home: i.p.homeTeam.name, away: i.p.awayTeam.name, mercado: i.mercado, cuota: i.cuota.toFixed(2), estado: 'PROYECTADO' }); }); 
            localStorage.setItem('gp_picks', JSON.stringify(h)); actualizarEstructuraPicksLocales(); 
            alert("🎯 ¡Ticket completo guardado en Mis Picks!"); 
        }

        function actualizarEstructuraPicksLocales() { 
            let h = obtenerPicksLocales(); document.getElementById('contador-picks-badge').innerText = h.length; 
            let c = document.getElementById('contenedor-lista-picks'); c.innerHTML = ""; 
            if(h.length === 0) { c.innerHTML = `<p style="color:var(--texto-gris); text-align:center; padding:20px; font-size:0.85rem;">No guardaste picks.</p>`; return; }
            h.reverse().forEach(p => { c.innerHTML += `<div class="item-pick-guardado"><span style="color:var(--verde-principal); float:right; font-size:0.75rem; font-weight:bold;">${p.estado}</span><div style="color:var(--texto-gris); font-size:0.75rem;">${p.home} vs ${p.away}</div><strong style="color:white; font-size:0.85rem;">${p.mercado} (x${p.cuota})</strong></div>`; }); 
        }

        function togglePanelPicks() { document.getElementById('panel-picks').classList.toggle('oculto-panel'); }
        
        function irADeporte(dep) { 
            deporteActivo = dep; 
            let tit = dep === 'futbol' ? 'FÚTBOL' : (dep === 'basquet' ? 'BÁSQUETBOL' : 'TENIS'); 
            document.getElementById('titulo-deporte-activo').innerText = tit; 
            document.getElementById('lobby-selector').classList.add('oculto'); 
            document.getElementById('app-content').classList.remove('oculto'); 
            setFiltroEstado('proximos'); 
            iniciarApp(); 
        }
        
        function volverAlLobby() { document.getElementById('lobby-selector').classList.remove('oculto'); document.getElementById('app-content').classList.add('oculto'); document.getElementById('vista-detalle').classList.add('oculto'); document.getElementById('logs-servidor-error').classList.add('oculto'); }
        function forzarActualizacion() { iniciarApp(); }

        window.onload = () => { actualizarEstructuraPicksLocales(); };
    </script>
</body>
</html>
