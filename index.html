<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>GreenPicks Pro · Odds API</title>
<style>
:root{--bg:#08101d;--panel:#111c2e;--panel2:#16243a;--line:#263a59;--green:#2ecc71;--gold:#f1c40f;--red:#ff647c;--text:#f7fafc;--muted:#91a2b8;--blue:#5ea8ff}
*{box-sizing:border-box;margin:0;padding:0;font-family:Inter,Segoe UI,Arial,sans-serif}body{background:radial-gradient(circle at top,#12243b 0,#08101d 42%);color:var(--text);min-height:100vh;padding-bottom:35px}.app{max-width:760px;margin:auto;padding:16px}.hidden{display:none!important}
.header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}.brand{font-size:1.45rem;font-weight:900;color:var(--green)}.sub{color:var(--muted);font-size:.78rem}.btn{border:1px solid var(--line);background:var(--panel);color:var(--text);padding:10px 12px;border-radius:10px;cursor:pointer;font-weight:700}.btn:hover{border-color:var(--green)}.btn.primary{background:var(--green);color:#06120b;border-color:var(--green)}
.lobby{padding:25px 0}.hero{text-align:center;padding:24px 10px 30px}.hero h1{font-size:2.35rem;color:var(--green);margin-bottom:7px}.hero p{color:var(--muted)}.sports{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.sport{background:linear-gradient(145deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:18px;padding:22px 14px;text-align:center;cursor:pointer}.sport:hover{transform:translateY(-2px);border-color:var(--green)}.sport .icon{font-size:2.5rem;margin-bottom:8px}.sport b{display:block}.sport small{color:var(--muted)}
.toolbar{display:grid;grid-template-columns:1fr auto;gap:10px;margin-bottom:12px}.select,.input{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:11px;color:white}.meta-strip{display:flex;flex-wrap:wrap;gap:7px;margin:10px 0 15px}.pill{background:#0c1625;border:1px solid var(--line);color:var(--muted);padding:6px 9px;border-radius:999px;font-size:.75rem}.pill.ok{color:var(--green)}.pill.warn{color:var(--gold)}
.notice{background:rgba(94,168,255,.08);border:1px solid rgba(94,168,255,.28);padding:12px;border-radius:12px;color:#cfe5ff;margin-bottom:12px;font-size:.85rem;line-height:1.45}.notice.error{background:rgba(255,100,124,.09);border-color:rgba(255,100,124,.35);color:#ffd8df}.loader{padding:30px;text-align:center;color:var(--muted)}
.event{background:linear-gradient(160deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:15px;padding:15px;margin-bottom:12px;cursor:pointer}.event:hover{border-color:#3b587f}.event-top{display:flex;justify-content:space-between;gap:10px;color:var(--muted);font-size:.76rem;margin-bottom:12px}.teams{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px}.team{text-align:center;font-weight:800}.mono{width:42px;height:42px;margin:0 auto 7px;border-radius:50%;display:grid;place-items:center;background:#0a1423;border:1px solid var(--line);color:#c7d6e7;font-size:.72rem}.vs{color:var(--gold);font-weight:900}.event-foot{display:flex;justify-content:center;gap:7px;flex-wrap:wrap;margin-top:12px}
.detail-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}.detail-card{background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:16px;margin-bottom:14px}.market{background:#0c1625;border:1px solid var(--line);border-radius:13px;padding:13px;margin-bottom:12px}.market h3{color:var(--gold);font-size:.95rem;margin-bottom:10px}.line-group{margin-bottom:13px}.line-title{display:flex;justify-content:space-between;gap:8px;color:var(--muted);font-size:.78rem;margin-bottom:7px}.outcomes{display:grid;grid-template-columns:repeat(auto-fit,minmax(135px,1fr));gap:8px}.outcome{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px}.outcome.best{border-color:var(--green);box-shadow:0 0 0 1px rgba(46,204,113,.12)}.outcome-name{font-weight:800;font-size:.84rem}.odd{font-size:1.1rem;color:var(--green);font-weight:900;margin-top:5px}.prob{color:#cfe5ff;font-size:.78rem;margin-top:2px}.book{color:var(--muted);font-size:.7rem;margin-top:4px}.consensus{margin-top:8px;padding-top:8px;border-top:1px dashed var(--line);font-size:.72rem;color:var(--muted)}.bookmakers{margin-top:9px}.book-row{display:grid;grid-template-columns:1fr repeat(3,minmax(70px,auto));gap:7px;align-items:center;padding:7px 0;border-top:1px solid rgba(255,255,255,.05);font-size:.72rem}.book-row span:first-child{color:var(--muted)}.empty{padding:25px;text-align:center;background:var(--panel);border:1px solid var(--line);border-radius:14px;color:var(--muted)}
@media(max-width:620px){.sports{grid-template-columns:1fr}.app{padding:12px}.teams{gap:6px}.book-row{grid-template-columns:1fr 1fr}.book-row span:nth-child(n+3){text-align:right}.toolbar{grid-template-columns:1fr auto}.hero h1{font-size:2rem}}
</style>
</head>
<body>
<div class="app">
<section id="lobby" class="lobby">
  <div class="hero"><h1>GreenPicks Pro</h1><p>Cuotas y probabilidades obtenidas directamente de The Odds API</p></div>
  <div class="sports">
    <button class="sport" data-sport="futbol"><div class="icon">⚽</div><b>Fútbol</b><small>Ligas activas y mercados reales</small></button>
    <button class="sport" data-sport="basquet"><div class="icon">🏀</div><b>Básquet</b><small>Moneyline, hándicap y totales</small></button>
    <button class="sport" data-sport="tenis"><div class="icon">🎾</div><b>Tenis</b><small>Ganador, spreads y juegos</small></button>
  </div>
</section>
<section id="eventsView" class="hidden">
  <div class="header"><div><div class="brand" id="sportTitle">Eventos</div><div class="sub">Datos actuales de bookmakers</div></div><button class="btn" id="backLobby">← Deportes</button></div>
  <div class="toolbar"><select id="leagueSelect" class="select"></select><button id="refreshBtn" class="btn" title="Forzar actualización">↻</button></div>
  <input id="searchInput" class="input" placeholder="Buscar equipo, jugador o liga…">
  <div class="meta-strip"><span class="pill" id="leagueCount">0 ligas</span><span class="pill" id="eventCount">0 eventos</span><span class="pill ok" id="cacheState">API</span><span class="pill" id="quotaState">Créditos: —</span></div>
  <div id="statusBox"></div><div id="events"></div>
</section>
<section id="detailView" class="hidden">
  <div class="detail-head"><button class="btn" id="backEvents">← Partidos</button><button class="btn" id="refreshEvent">↻ Actualizar</button></div>
  <div id="detail"></div>
</section>
</div>
<script>
'use strict';
const API_KEYS=[
'b1068f561f80975166b5c1ab67a2888a',
'c7b062bf872742e25c086b5ad997ba0a',
'f900242e004a6964ac7d711eafca119c',
'12645d55775fe9919ad938d99af60474'
];
const API_BASE='https://api.the-odds-api.com/v4';
const CACHE_PREFIX='greenpicks_api_v3:';
const CACHE_TTL=5*60*1000;
let keyIndex=Number(localStorage.getItem(CACHE_PREFIX+'keyIndex')||0)%API_KEYS.length;
let activeSport='futbol', sports=[], leagues=[], events=[], currentEvent=null, lastHeaders={};
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
const fmtDate=iso=>new Intl.DateTimeFormat('es-AR',{dateStyle:'short',timeStyle:'short'}).format(new Date(iso));
const monogram=n=>esc(String(n||'?').split(/\s+/).map(x=>x[0]).join('').slice(0,3).toUpperCase());
function cacheGet(key){try{const x=JSON.parse(localStorage.getItem(CACHE_PREFIX+key));if(!x||Date.now()-x.time>CACHE_TTL){localStorage.removeItem(CACHE_PREFIX+key);return null}return x.data}catch{return null}}
function cacheSet(key,data){try{localStorage.setItem(CACHE_PREFIX+key,JSON.stringify({time:Date.now(),data}))}catch{}}
function clearCache(){Object.keys(localStorage).filter(k=>k.startsWith(CACHE_PREFIX)&&!k.endsWith('keyIndex')).forEach(k=>localStorage.removeItem(k))}
function rotateKey(){keyIndex=(keyIndex+1)%API_KEYS.length;localStorage.setItem(CACHE_PREFIX+'keyIndex',String(keyIndex))}
async function apiFetch(path,{force=false}={}){
 const cacheKey=path.replace(/apiKey=[^&]+/,'apiKey=*');
 if(!force){const cached=cacheGet(cacheKey);if(cached){$('cacheState').textContent='Caché';return cached}}
 $('cacheState').textContent='API';
 let lastError;
 for(let attempt=0;attempt<API_KEYS.length;attempt++){
   const sep=path.includes('?')?'&':'?'; const url=API_BASE+path+sep+'apiKey='+API_KEYS[keyIndex];
   try{
    const ctrl=new AbortController();const timer=setTimeout(()=>ctrl.abort(),12000);
    const res=await fetch(url,{signal:ctrl.signal});clearTimeout(timer);
    lastHeaders={remaining:res.headers.get('x-requests-remaining'),used:res.headers.get('x-requests-used'),last:res.headers.get('x-requests-last')};updateQuota();
    if(res.status===401||res.status===429){rotateKey();lastError=new Error('Clave sin autorización o sin créditos');continue}
    const payload=await res.json().catch(()=>null);
    if(!res.ok){if([400,404,422].includes(res.status))throw new Error(payload?.message||payload?.error_code||('Error '+res.status));rotateKey();lastError=new Error('Error API '+res.status);continue}
    cacheSet(cacheKey,payload);return payload;
   }catch(e){lastError=e;if(e.name!=='AbortError'&&/INVALID_MARKET|MISSING_MARKET/i.test(e.message))throw e;rotateKey()}
 }
 throw lastError||new Error('No hay claves disponibles');
}
function updateQuota(){const r=lastHeaders.remaining;$('quotaState').textContent='Créditos: '+(r??'—')}
function sportMatch(key){if(activeSport==='futbol')return key.startsWith('soccer_');if(activeSport==='basquet')return key.startsWith('basketball_');return key.startsWith('tennis_')}
function sportName(){return activeSport==='futbol'?'Fútbol ⚽':activeSport==='basquet'?'Básquet 🏀':'Tenis 🎾'}
function marketLabel(key){return({h2h:activeSport==='futbol'?'Resultado 1X2':'Ganador del partido',spreads:activeSport==='tenis'?'Hándicap de juegos':'Hándicap',totals:activeSport==='tenis'?'Total de juegos':activeSport==='futbol'?'Total de goles':'Total de puntos'})[key]||key}
function outcomeLabel(name,event){if(name==='Draw')return'Empate';if(name==='Over')return'Más';if(name==='Under')return'Menos';return name===event.home_team?'Local · '+name:name===event.away_team?'Visitante · '+name:name}
function normalize(outcomes){const valid=outcomes.filter(x=>Number(x.price)>1);const raw=valid.map(x=>1/Number(x.price));const sum=raw.reduce((a,b)=>a+b,0);return valid.map((x,i)=>({...x,prob:sum?raw[i]/sum*100:0}))}
function aggregateMarket(event,key){
 const rows=[];(event.bookmakers||[]).forEach(b=>(b.markets||[]).filter(m=>m.key===key).forEach(m=>(m.outcomes||[]).forEach(o=>rows.push({...o,bookmaker:b.title,last_update:b.last_update}))));
 const groups=new Map();rows.forEach(o=>{const point=o.point??'';const k=o.name+'|'+point;if(!groups.has(k))groups.set(k,[]);groups.get(k).push(o)});
 const best=[];groups.forEach((arr,k)=>{const winner=[...arr].sort((a,b)=>Number(b.price)-Number(a.price))[0];best.push({...winner,sources:arr.length,all:arr})});
 const byLine=new Map();best.forEach(o=>{const line=o.point??'principal';if(!byLine.has(line))byLine.set(line,[]);byLine.get(line).push(o)});
 const result=[];byLine.forEach((outs,line)=>result.push({line,outcomes:normalize(outs)}));
 return result.sort((a,b)=>String(a.line).localeCompare(String(b.line),undefined,{numeric:true}));
}
async function loadSports(force=false){sports=await apiFetch('/sports/?all=false',{force});leagues=sports.filter(s=>s.active&&sportMatch(s.key)).sort((a,b)=>a.title.localeCompare(b.title));$('leagueSelect').innerHTML=leagues.map(x=>`<option value="${esc(x.key)}">${esc(x.title)}</option>`).join('');$('leagueCount').textContent=leagues.length+' ligas';if(!leagues.length)throw new Error('No hay ligas activas para este deporte')}
async function loadLeague(force=false){
 const key=$('leagueSelect').value;if(!key)return;showStatus('Cargando partidos y cuotas…');$('events').innerHTML='<div class="loader">Consultando bookmakers…</div>';
 try{events=await apiFetch('/sports/'+encodeURIComponent(key)+'/odds/?regions=eu,uk&markets=h2h,spreads,totals&oddsFormat=decimal&dateFormat=iso',{force});renderEvents();showStatus('')}
 catch(e){events=[];renderEvents();showStatus(e.message,'error')}
}
function renderEvents(){const q=$('searchInput').value.trim().toLowerCase();const list=events.filter(e=>!q||[e.home_team,e.away_team,e.sport_title].join(' ').toLowerCase().includes(q));$('eventCount').textContent=list.length+' eventos';if(!list.length){$('events').innerHTML='<div class="empty">No hay partidos con cuotas disponibles para esta liga.</div>';return}
 $('events').innerHTML=list.map(e=>{const mk=[...new Set((e.bookmakers||[]).flatMap(b=>(b.markets||[]).map(m=>m.key)))];return `<article class="event" data-id="${esc(e.id)}"><div class="event-top"><span>${esc(e.sport_title)}</span><span>${esc(fmtDate(e.commence_time))}</span></div><div class="teams"><div class="team"><div class="mono">${monogram(e.home_team)}</div>${esc(e.home_team)}</div><div class="vs">VS</div><div class="team"><div class="mono">${monogram(e.away_team)}</div>${esc(e.away_team)}</div></div><div class="event-foot"><span class="pill">${(e.bookmakers||[]).length} casas</span>${mk.map(k=>`<span class="pill ok">${esc(marketLabel(k))}</span>`).join('')}</div></article>`}).join('');
 document.querySelectorAll('.event').forEach(el=>el.onclick=()=>openEvent(el.dataset.id));
}
function renderMarket(event,key){const groups=aggregateMarket(event,key);if(!groups.length)return'';return `<section class="market"><h3>${esc(marketLabel(key))}</h3>${groups.map(g=>{const line=g.line==='principal'?'Mercado principal':'Línea '+g.line;return `<div class="line-group"><div class="line-title"><span>${esc(line)}</span><span>${g.outcomes.reduce((n,o)=>n+o.sources,0)} cotizaciones</span></div><div class="outcomes">${g.outcomes.map((o,i)=>`<div class="outcome ${i===0?'best':''}"><div class="outcome-name">${esc(outcomeLabel(o.name,event))}${o.point!==undefined?' '+(Number(o.point)>0?'+':'')+o.point:''}</div><div class="odd">${Number(o.price).toFixed(2)}</div><div class="prob">${o.prob.toFixed(1)}% probable</div><div class="book">Mejor cuota · ${esc(o.bookmaker)}</div><div class="consensus">${o.sources} casa${o.sources===1?'':'s'} comparada${o.sources===1?'':'s'}</div></div>`).join('')}</div><div class="bookmakers">${renderBookRows(g.outcomes,event)}</div></div>`}).join('')}</section>`}
function renderBookRows(outcomes,event){const books=new Map();outcomes.forEach(o=>o.all.forEach(x=>{if(!books.has(x.bookmaker))books.set(x.bookmaker,[]);books.get(x.bookmaker).push(x)}));return [...books].slice(0,8).map(([b,arr])=>`<div class="book-row"><span>${esc(b)}</span>${arr.map(x=>`<b>${esc(outcomeLabel(x.name,event))}: ${Number(x.price).toFixed(2)}</b>`).join('')}</div>`).join('')}
function openEvent(id){currentEvent=events.find(e=>String(e.id)===String(id));if(!currentEvent)return;$('eventsView').classList.add('hidden');$('detailView').classList.remove('hidden');renderDetail()}
function renderDetail(){const e=currentEvent;const last=(e.bookmakers||[]).map(b=>b.last_update).filter(Boolean).sort().at(-1);$('detail').innerHTML=`<div class="detail-card"><div class="event-top"><span>${esc(e.sport_title)}</span><span>${esc(fmtDate(e.commence_time))}</span></div><div class="teams"><div class="team"><div class="mono">${monogram(e.home_team)}</div>${esc(e.home_team)}</div><div class="vs">VS</div><div class="team"><div class="mono">${monogram(e.away_team)}</div>${esc(e.away_team)}</div></div><div class="meta-strip"><span class="pill">${(e.bookmakers||[]).length} bookmakers</span><span class="pill">Actualizado ${last?esc(fmtDate(last)):'—'}</span><span class="pill ok">Probabilidades sin margen proporcional</span></div></div>${['h2h','spreads','totals'].map(k=>renderMarket(e,k)).join('')||'<div class="empty">La API no devolvió mercados para este evento.</div>'}`}
function showStatus(msg,type=''){const box=$('statusBox');box.innerHTML=msg?`<div class="notice ${type}">${esc(msg)}</div>`:''}
async function enterSport(s){activeSport=s;$('lobby').classList.add('hidden');$('eventsView').classList.remove('hidden');$('sportTitle').textContent=sportName();showStatus('Consultando ligas activas…');try{await loadSports();await loadLeague()}catch(e){showStatus(e.message,'error');$('events').innerHTML=''}}
document.querySelectorAll('.sport').forEach(b=>b.onclick=()=>enterSport(b.dataset.sport));
$('backLobby').onclick=()=>{$('eventsView').classList.add('hidden');$('lobby').classList.remove('hidden')};
$('backEvents').onclick=()=>{$('detailView').classList.add('hidden');$('eventsView').classList.remove('hidden')};
$('leagueSelect').onchange=()=>loadLeague();$('searchInput').oninput=renderEvents;
$('refreshBtn').onclick=async()=>{clearCache();try{await loadSports(true);await loadLeague(true)}catch(e){showStatus(e.message,'error')}};
$('refreshEvent').onclick=async()=>{if(!currentEvent)return;clearCache();await loadLeague(true);currentEvent=events.find(e=>e.id===currentEvent.id)||currentEvent;renderDetail()};
</script>
</body>
</html>
