<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GreenPicks Pro - Multideporte</title>
    <style>
        :root {
            --bg-principal: #0b0f19;
            --tarjeta-bg: #151f32;
            --tarjeta-borde: #223452;
            --verde-principal: #2ecc71;
            --oro: #f1c40f;
            --alerta: #e74c3c;
            --texto-blanco: #ffffff;
            --texto-gris: #8a99ad;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg-principal); color: var(--texto-blanco); padding-bottom: 60px; }

        .contenedor-app { max-width: 500px; margin: 0 auto; padding: 15px; position: relative; }
        .oculto { display: none !important; }

        /* Lobby */
        .lobby-container { text-align: center; padding: 40px 20px; }
        .lobby-titulo { font-size: 2rem; color: var(--verde-principal); margin-bottom: 10px; font-weight: 800; }
        .lobby-sub { color: var(--texto-gris); margin-bottom: 40px; }
        .btn-deporte-card { background: var(--tarjeta-bg); border: 2px solid var(--tarjeta-borde); border-radius: 12px; padding: 25px; margin-bottom: 20px; display: flex; align-items: center; justify-content: space-between; cursor: pointer; transition: all 0.2s; width: 100%; text-align: left; }
        .btn-deporte-card:hover { border-color: var(--verde-principal); transform: translateY(-2px); }
        .deporte-info h3 { color: var(--texto-blanco); font-size: 1.3rem; margin-bottom: 5px; }
        .deporte-info p { color: var(--texto-gris); font-size: 0.85rem; }
        .deporte-icono { font-size: 2.5rem; }

        /* Estilos Internos */
        .app-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; padding-bottom: 10px; border-bottom: 1px solid var(--tarjeta-borde); }
        .btn-volver-lobby { background: transparent; border: 1px solid var(--tarjeta-borde); color: var(--texto-gris); padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 0.85rem; }
        .herramientas-grid { display: flex; gap: 10px; margin-bottom: 15px; }
        .buscador-input { flex: 1; background: var(--tarjeta-bg); border: 1px solid var(--tarjeta-borde); padding: 10px; border-radius: 8px; color: white; font-size: 0.9rem; }
        .nav-filtros { display: flex; background: var(--tarjeta-bg); padding: 4px; border-radius: 10px; margin-bottom: 20px; border: 1px solid var(--tarjeta-borde); }
        .btn-filto-main { flex: 1; background: transparent; border: none; color: var(--texto-gris); padding: 10px; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 0.85rem; }
        .btn-filto-main.activo { background: var(--bg-principal); color: var(--verde-principal); }

        /* Tarjetas */
        .tarjeta-partido { background: var(--tarjeta-bg); border: 1px solid var(--tarjeta-borde); border-radius: 12px; padding: 15px; margin-bottom: 12px; cursor: pointer; }
        .encabezado-liga { font-size: 0.75rem; color: var(--texto-gris); display: flex; align-items: center; gap: 6px; margin-bottom: 10px; border-bottom: 1px solid rgba(255,255,255,0.03); padding-bottom: 5px; }
        .encabezado-liga img { width: 14px; height: 14px; object-fit: contain; }
        .cuerpo-partido { display: flex; justify-content: space-between; align-items: center; }
        .equipos { flex: 1; display: flex; flex-direction: column; gap: 8px; }
        .equipo-linea { display: flex; align-items: center; gap: 10px; font-size: 0.95rem; font-weight: 500; }
        .equipo-linea img { width: 22px; height: 22px; object-fit: contain; }
        .marcador-live { text-align: right; min-width: 65px; font-weight: bold; font-size: 1.1rem; display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
        .live-badge { background: var(--alerta); color: white; font-size: 0.65rem; padding: 2px 6px; border-radius: 4px; font-weight: bold; }

        /* Detalle y Barras */
        .cabecera-detalle-grid { display: flex; justify-content: space-between; align-items: center; margin-top: 15px; background: var(--tarjeta-bg); padding: 20px 10px; border-radius: 14px; border: 1px solid var(--tarjeta-borde); }
        .barra-container { margin-bottom: 15px; }
        .barra-container span { display: block; font-size: 0.85rem; margin-bottom: 5px; }
        .barra-fondo { background: rgba(255,255,255,0.06); height: 10px; border-radius: 5px; overflow: hidden; width: 100%; }
        .barra-progreso { height: 100%; width: 0%; border-radius: 5px; transition: width 0.6s ease-out; }

        /* Combinadas */
        .tarjeta-combinada { background: var(--tarjeta-bg); border: 1px solid var(--tarjeta-borde); border-radius: 12px; padding: 15px; margin-bottom: 15px; border-top: 4px solid var(--verde-principal); }
        .ticket-item { background: rgba(0,0,0,0.2); padding: 10px; border-radius: 6px; margin-bottom: 8px; font-size: 0.85rem; }

        /* Nav inferior */
        .bottom-nav { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 500px; background: #0e1726; border-top: 1px solid var(--tarjeta-borde); display: flex; height: 55px; z-index: 999; }
        .nav-item-btn { flex: 1; background: transparent; border: none; color: var(--texto-gris); display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 0.75rem; cursor: pointer; gap: 4px; }
        .nav-item-btn.activo { color: var(--verde-principal); }
        .badge-contador { background: var(--verde-principal); color: #111; font-size: 0.7rem; font-weight: bold; padding: 1px 5px; border-radius: 10px; position: absolute; top: 4px; right: 22%; }

        /* Panel Lateral */
        .panel-picks-lateral { position: fixed; top: 0; right: 0; width: 100%; max-width: 320px; height: 100%; background: #0c1322; border-left: 1px solid var(--tarjeta-borde); z-index: 10000; padding: 20px; transition: transform 0.3s ease; }
        .oculto-panel { transform: translateX(100%); }
        .contenedor-lista-picks { height: calc(100% - 60px); overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        .item-pick-guardado { background: var(--tarjeta-bg); border: 1px solid var(--tarjeta-borde); border-radius: 8px; padding: 12px; font-size: 0.85rem; position: relative; }
        .item-pick-guardado .badge-estado { position: absolute; top: 8px; right: 8px; font-size: 0.65rem; font-weight: bold; color: var(--oro); }
        
        .tab-detalle-btn { flex: 1; padding: 10px 5px; background: transparent; color: var(--texto-gris); border: none; border-bottom: 2px solid transparent; cursor: pointer; font-size: 0.85rem; font-weight: bold; }
        .tab-detalle-btn.activo { color: var(--verde-principal); border-bottom: 2px solid var(--verde-principal); }
        .tab-detalle-content { display: none; padding-top: 15px; }
        .tab-detalle-content.activo { display: block; }
    </style>
</head>
<body>

    <div class="contenedor-app">

        <div id="lobby-selector" class="lobby-container">
            <h1 class="lobby-titulo">GreenPicks Pro</h1>
            <p class="lobby-sub">Seleccioná una disciplina analítica</p>

            <button class="btn-deporte-card" onclick="irADeporte('futbol')">
                <div class="deporte-info">
                    <h3>Fútbol Profesional</h3>
                    <p>Ligas Top, Predicciones e Historial H2H</p>
                </div>
                <div class="deporte-icono">⚽</div>
            </button>

            <button class="btn-deporte-card" onclick="irADeporte('basquet')">
                <div class="deporte-info">
                    <h3>Básquetbol (Próximas 24hs)</h3>
                    <p>NBA, Euroleague y Ligas Internacionales continuas</p>
                </div>
                <div class="deporte-icono">🏀</div>
            </button>

            <button class="btn-deporte-card" onclick="irADeporte('f1')">
                <div class="deporte-info">
                    <h3>Fórmula 1</h3>
                    <p>Grandes Premios, Clasificaciones y Desempeño</p>
                </div>
                <div class="deporte-icono">🏎️</div>
            </button>
        </div>

        <div id="app-content" class="oculto">
            <div class="app-header">
                <button class="btn-volver-lobby" onclick="volverAlLobby()">⬅️ Volver al Lobby</button>
                <h2 id="titulo-deporte-activo" style="font-size: 1.1rem; font-weight: 800; color: var(--verde-principal);">FÚTBOL</h2>
            </div>

            <div id="herramientas-top" class="herramientas-grid">
                <input type="text" id="filtro-ligas-input" oninput="aplicarFiltrosMaster()" placeholder="Buscar evento o competidor..." class="buscador-input">
                <button id="btn-refresh" class="btn-refresh-live" onclick="forzarActualizacionLive()">🔄</button>
            </div>

            <div class="nav-filtros">
                <button id="btn-proximos" class="btn-filto-main activo" onclick="setFiltroEstado('proximos')">Próximos</button>
                <button id="btn-envivo" class="btn-filto-main" onclick="setFiltroEstado('envivo')">En Vivo</button>
                <button id="btn-combinada" class="btn-filto-main" onclick="setFiltroEstado('combinada')">Combinada IA</button>
            </div>

            <div id="contenedor-partidos"></div>
            <div id="seccion-combinada" class="oculto"></div>
        </div>

        <div id="vista-detalle" class="oculto">
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <button class="btn-volver-lobby" onclick="cerrarDetalle()">⬅️ Volver atrás</button>
                <div id="detalle-status"></div>
            </div>
            <div class="cabecera-detalle-grid" id="detalle-cabecera"></div>
            <div id="detalle-barras"></div>
        </div>

    </div>

    <div class="bottom-nav">
        <button class="nav-item-btn activo" id="nav-btn-home" onclick="cerrarDetalle(); setFiltroEstado('proximos');">
            <span class="nav-icono">🏟️</span>
            <span>Eventos</span>
        </button>
        <button class="nav-item-btn" style="position:relative;" onclick="togglePanelPicks()">
            <span id="contador-picks-badge" class="badge-contador">0</span>
            <span class="nav-icono">📋</span>
            <span>Mis Picks</span>
        </button>
    </div>

    <div id="panel-picks" class="panel-picks-lateral oculto-panel">
        <div class="panel-header" style="display:flex; justify-content:space-between; margin-bottom:20px;">
            <h3>Mis Picks</h3>
            <button class="btn-volver-lobby" onclick="togglePanelPicks()">❌</button>
        </div>
        <div id="contenedor-lista-picks" class="contenedor-lista-picks"></div>
    </div>

    <script>
        const API_KEYS = ["0464d33c8013d01fb7387b5148f18a9a", "31dc5f2762254847a825e1025257a759"];
        let baseDeDatosHoy = [];
        let estadoFiltroActual = 'proximos';
        let ticketsMultiplesGenerados = {};
        let deporteActivo = 'futbol';

        const estadosEnVivoFutbol = ['1H', '2H', 'HT', 'ET', 'BT', 'LIVE', 'IN_PLAY'];
        const estadosEnVivoBasket = ['Q1', 'Q2', 'Q3', 'Q4', 'OT', 'BT', 'HT', 'LIVE', 'IN_PLAY'];
        const LIGAS_TOP_FUTBOL = [1, 2, 3, 4, 9, 13, 11, 12, 39, 140, 135, 78, 61];
        const LIGAS_TOP_BASKET = [12, 116, 117, 120, 134, 2, 4, 5, 6, 8]; 
        const ESCUDO_RESPALDO = "https://cdn-icons-png.flaticon.com/512/53/53283.png";

        async function fetchConRotacion(url) {
            for (let i = 0; i < API_KEYS.length; i++) {
                try {
                    const res = await fetch(url, { headers: { 'x-apisports-key': API_KEYS[i] } });
                    const data = await res.json();
                    if (!data.errors || data.errors.length === 0 || !data.errors.rateLimit) return data;
                } catch (e) {}
            }
            return null; 
        }

        async function fetchPartidos() {
            const zona = Intl.DateTimeFormat().resolvedOptions().timeZone;
            const ahora = new Date();
            const formatoDia = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
            
            // Tiempos exactos para ventana de 24 horas continuas
            const timestampAhora = ahora.getTime();
            const timestampLimite = timestampAhora + (24 * 60 * 60 * 1000);

            if (deporteActivo === 'f1') {
                const urlF1 = `https://v1.formula-1.api-sports.io/races?next=5&timezone=${zona}`;
                const data = await fetchConRotacion(urlF1);
                if (!data || !data.response) return [];
                return data.response.map(r => ({
                    id: r.id, utcDate: r.date, status: r.status === 'Completed' ? 'FINISHED' : (r.status === 'Live' ? 'IN_PLAY' : 'SCHEDULED'),
                    competition: { id: r.competition.id, name: r.competition.location.country, emblem: "🏎️" },
                    homeTeam: { id: r.circuit.id, name: r.competition.name, crest: "" },
                    awayTeam: { id: r.id, name: r.circuit.name, crest: "" },
                    score: { fullTime: { home: 0, away: 0 } },
                    tipo: 'f1', infoExtra: r.type
                }));
            }

            const manana = new Date(timestampAhora + (24 * 60 * 60 * 1000));
            let urlHoy = `https://v3.football.api-sports.io/fixtures?date=${formatoDia(ahora)}&timezone=${zona}`;
            let urlManana = `https://v3.football.api-sports.io/fixtures?date=${formatoDia(manana)}&timezone=${zona}`;

            if (deporteActivo === 'basquet') {
                urlHoy = `https://v1.basketball.api-sports.io/games?date=${formatoDia(ahora)}&timezone=${zona}`;
                urlManana = `https://v1.basketball.api-sports.io/games?date=${formatoDia(manana)}&timezone=${zona}`;
            }

            const [dHoy, dManana] = await Promise.all([fetchConRotacion(urlHoy), fetchConRotacion(urlManana)]);
            let combinados = [].concat(dHoy?.response || [], dManana?.response || []);

            return combinados.filter(p => {
                const t = new Date(deporteActivo === 'futbol' ? p.fixture.date : p.date).getTime();
                return t >= (timestampAhora - 3*60*60*1000) && t <= timestampLimite;
            }).map(p => {
                if (deporteActivo === 'futbol') {
                    return {
                        id: p.fixture.id, utcDate: p.fixture.date, status: estadosEnVivoFutbol.includes(p.fixture.status.short) ? 'IN_PLAY' : (['FT','AET','PEN'].includes(p.fixture.status.short) ? 'FINISHED' : 'SCHEDULED'),
                        competition: { id: p.league.id, name: p.league.name, emblem: p.league.logo },
                        homeTeam: { id: p.teams.home.id, name: p.teams.home.name, crest: p.teams.home.logo },
                        awayTeam: { id: p.teams.away.id, name: p.teams.away.name, crest: p.teams.away.logo },
                        score: { fullTime: { home: p.goals.home ?? 0, away: p.goals.away ?? 0 } }, tipo: 'futbol'
                    };
                } else {
                    return {
                        id: p.id, utcDate: p.date, status: estadosEnVivoBasket.includes(p.status.short) ? 'IN_PLAY' : (p.status.short === 'FT' ? 'FINISHED' : 'SCHEDULED'),
                        competition: { id: p.league.id, name: p.league.name, emblem: p.league.logo },
                        homeTeam: { id: p.teams.home.id, name: p.teams.home.name, crest: p.teams.home.logo },
                        awayTeam: { id: p.teams.away.id, name: p.teams.away.name, crest: p.teams.away.logo },
                        score: { fullTime: { home: p.scores?.home?.total ?? 0, away: p.scores?.away?.total ?? 0 } }, tipo: 'basquet'
                    };
                }
            });
        }

        async function iniciarApp() {
            const cont = document.getElementById('contenedor-partidos');
            cont.innerHTML = `<p style="color:var(--verde-principal);text-align:center;padding:20px;">⏳ Filtrando grilla de eventos para las próximas 24 horas...</p>`;
            
            const eventos = await fetchPartidos();
            if (deporteActivo === 'futbol') baseDeDatosHoy = eventos.filter(e => LIGAS_TOP_FUTBOL.includes(e.competition.id));
            else if (deporteActivo === 'basquet') baseDeDatosHoy = eventos.filter(e => LIGAS_TOP_BASKET.includes(e.competition.id));
            else baseDeDatosHoy = eventos; // F1 trae directo sus siguientes GPs

            if (baseDeDatosHoy.length > 0) {
                generarCombinadaDelDia();
                aplicarFiltrosMaster();
            } else {
                cont.innerHTML = `<p style="padding:20px;text-align:center;color:var(--texto-gris)">⚠️ No se encontraron eventos disponibles en esta franja.</p>`;
            }
        }

        function analizarMercadosPartido(p) {
            if (p.tipo === 'f1') {
                return [
                    { m: "🏆 Ganador: Piloto Favorito (Escudería Top)", pr: 55, cuota: "1.80" },
                    { m: "🏎️ Vuelta Rápida en Carrera", pr: 40, cuota: "2.50" },
                    { m: "🏁 Ambos autos de la escudería en zona de puntos", pr: 70, cuota: "1.42" }
                ];
            }
            const loc = p.homeTeam.name;
            let pL = Math.min(Math.max(45 + (p.homeTeam.id % 15), 20), 80);
            return p.tipo === 'futbol' ? [
                { m: `🏆 Gana ${loc}`, pr: pL, cuota: (100/pL).toFixed(2) },
                { m: "🔥 +2.5 Goles totales", pr: 58, cuota: "1.72" }
            ] : [
                { m: `🏆 Gana ${loc}`, pr: pL, cuota: (100/pL).toFixed(2) },
                { m: "🔥 Más de 214.5 Puntos Línea Continua", pr: 62, cuota: "1.61" }
            ];
        }

        async function abrirDetalle(id) {
            const p = baseDeDatosHoy.find(item => item.id === id); if (!p) return;
            document.getElementById('herramientas-top').classList.add('oculto');
            document.getElementById('contenedor-partidos').classList.add('oculto');
            document.getElementById('seccion-combinada').classList.add('oculto');
            document.getElementById('vista-detalle').classList.remove('oculto');

            const isLive = p.status === 'IN_PLAY';
            document.getElementById('detalle-status').innerHTML = isLive ? `<div class="live-badge">EN VIVO</div>` : `<span>Próximamente</span>`;
            
            if (p.tipo === 'f1') {
                document.getElementById('detalle-cabecera').innerHTML = `<div style="text-align:center; width:100%;"><h3>🏁 ${p.homeTeam.name}</h3><p style="color:var(--verde-principal); margin-top:5px;">${p.awayTeam.name} (${p.infoExtra || 'Carrera'})</p></div>`;
            } else {
                document.getElementById('detalle-cabecera').innerHTML = `<div style="text-align:center;width:40%;"><img src="${p.homeTeam.crest || ESCUDO_RESPALDO}" style="max-height:35px;"><p>${p.homeTeam.name}</p></div><h2 style="color:var(--verde-principal);">${isLive ? p.score.fullTime.home+' - '+p.score.fullTime.away : 'VS'}</h2><div style="text-align:center;width:40%;"><img src="${p.awayTeam.crest || ESCUDO_RESPALDO}" style="max-height:35px;"><p>${p.awayTeam.name}</p></div>`;
            }

            let htmlTabs = `<div style="display:flex; border-bottom:1px solid rgba(255,255,255,0.1); margin-top:15px; margin-bottom:15px;"><button class="tab-detalle-btn activo">🔮 Proyecciones Algorítmicas</button></div><div class="tab-detalle-content activo">`;
            
            analizarMercadosPartido(p).forEach(m => {
                htmlTabs += `<div class="barra-container" style="border-left:3px solid var(--verde-principal);background:rgba(255,255,255,0.01);padding:10px;border-radius:6px;"><span>${m.m} <b>(x${m.cuota})</b></span><div class="barra-fondo"><div class="barra-progreso" style="background:var(--verde-principal);width:${m.pr}%"></div></div><button onclick="guardarUnicoPickLocal(${p.id},'${m.m.replace(/'/g,"\\'")}', '${m.cuota}', '${p.homeTeam.name}', '${p.awayTeam.name}')" style="margin-top:8px;background:rgba(255,255,255,0.05);color:white;border:1px solid var(--tarjeta-borde);padding:5px;width:100%;border-radius:4px;font-size:0.75rem;cursor:pointer;">Guardar Pick</button></div>`;
            });
            document.getElementById('detalle-barras').innerHTML = htmlTabs + `</div>`;
        }

        function cerrarDetalle() {
            document.getElementById('vista-detalle').classList.add('oculto');
            document.getElementById('herramientas-top').classList.remove('oculto');
            setFiltroEstado(estadoFiltroActual);
        }

        function setFiltroEstado(estado) {
            estadoFiltroActual = estado;
            document.querySelectorAll('.btn-filto-main').forEach(b => b.classList.remove('activo'));
            if(document.getElementById('btn-'+estado)) document.getElementById('btn-'+estado).classList.add('activo');

            if (estado === 'combinada') {
                document.getElementById('herramientas-top').classList.add('oculto');
                document.getElementById('contenedor-partidos').classList.add('oculto');
                document.getElementById('seccion-combinada').classList.remove('oculto');
            } else {
                document.getElementById('herramientas-top').classList.remove('oculto');
                document.getElementById('contenedor-partidos').classList.remove('oculto');
                document.getElementById('seccion-combinada').classList.add('oculto');
                aplicarFiltrosMaster();
            }
        }

        function aplicarFiltrosMaster() {
            if (estadoFiltroActual === 'combinada') return;
            let filtrados = baseDeDatosHoy;
            if (estadoFiltroActual === 'envivo') filtrados = filtrados.filter(e => e.status === 'IN_PLAY');
            else filtrados = filtrados.filter(e => e.status !== 'FINISHED');

            const txt = document.getElementById('filtro-ligas-input').value.toLowerCase().trim();
            if (txt !== '') {
                filtrados = filtrados.filter(e => e.competition.name.toLowerCase().includes(txt) || e.homeTeam.name.toLowerCase().includes(txt) || e.awayTeam.name.toLowerCase().includes(txt));
            }
            renderizarPartidos(filtrados);
        }

        function renderizarPartidos(partidos) {
            const cont = document.getElementById('contenedor-partidos'); cont.innerHTML = '';
            if(!partidos.length) { cont.innerHTML = `<p style="padding:20px;text-align:center;color:var(--texto-gris);">No hay eventos de ${deporteActivo.toUpperCase()} programados en esta sección.</p>`; return; }

            partidos.forEach(p => {
                let hora = p.utcDate ? new Date(p.utcDate).toLocaleTimeString('es-AR', { hour: '2-digit', minute: '2-digit', hour12: false }) : "TBA";
                let marcador = p.status === 'IN_PLAY' ? `<div class="live-badge">LIVE</div><span style="color:var(--alerta)">${p.score.fullTime.home}-${p.score.fullTime.away}</span>` : `<span>${hora}</span>`;
                
                cont.innerHTML += `<div class="tarjeta-partido" onclick="abrirDetalle(${p.id})">
                    <div class="encabezado-liga">${p.competition.emblem ? p.competition.emblem : ''} ${p.competition.name}</div>
                    <div class="cuerpo-partido">
                        <div class="equipos">
                            <div class="equipo-linea">${p.homeTeam.name}</div>
                            <div class="equipo-linea">${p.awayTeam.name}</div>
                        </div>
                        <div class="marcador-live">${marcador}</div>
                    </div>
                </div>`;
            });
        }

        function generarCombinadaDelDia() {
            const secc = document.getElementById('seccion-combinada'); secc.innerHTML = '';
            let pool = []; baseDeDatosHoy.forEach(p => { analizarMercadosPartido(p).forEach(m => pool.push({p:p, m:m})) });
            let filtrados = pool.slice(0,3);
            if(!filtrados.length) { secc.innerHTML = `<p style="padding:20px;">No hay picks suficientes.</p>`; return; }

            let html = `<div class="tarjeta-combinada"><h4>📊 Combinada Inteligente Multi-Target</h4>`;
            filtrados.forEach(c => { html += `<div class="ticket-item">📍 ${c.p.homeTeam.name}<br>🎯 <b>${c.m.m}</b> <span style="float:right;color:var(--verde-principal);">x${c.m.cuota}</span></div>`; });
            secc.innerHTML = html + `</div>`;
        }

        function guardarUnicoPickLocal(id, m, c, h, a) {
            let p = JSON.parse(localStorage.getItem('gp_picks')) || [];
            if(p.find(x => x.idMatch === id && x.mercado === m)) return;
            p.push({ idMatch: id, home: h, away: a, mercado: m, cuota: c, estado: 'PENDIENTE' });
            localStorage.setItem('gp_picks', JSON.stringify(p)); actualizarEstructuraPicksLocales();
            alert("Pick añadido con éxito.");
        }

        function actualizarEstructuraPicksLocales() {
            let p = JSON.parse(localStorage.getItem('gp_picks')) || [];
            document.getElementById('contador-picks-badge').innerText = p.length;
            let c = document.getElementById('contenedor-lista-picks'); if(!c) return; c.innerHTML = '';
            p.forEach(x => { c.innerHTML += `<div class="item-pick-guardado"><span class="badge-estado">${x.estado}</span><div style="font-size:0.75rem;color:var(--texto-gris);">${x.home} vs ${x.away}</div><strong>${x.mercado} (x${x.cuota})</strong></div>`; });
        }

        function togglePanelPicks() { document.getElementById('panel-picks').classList.toggle('oculto-panel'); }
        function irADeporte(dep) {
            deporteActivo = dep;
            document.getElementById('titulo-deporte-activo').innerText = dep.toUpperCase();
            document.getElementById('lobby-selector').classList.add('oculto');
            document.getElementById('app-content').classList.remove('oculto');
            setFiltroEstado('proximos');
            iniciarApp();
        }
        function volverAlLobby() {
            document.getElementById('lobby-selector').classList.remove('oculto');
            document.getElementById('app-content').classList.add('oculto');
            document.getElementById('vista-detalle').classList.add('oculto');
        }
        function forzarActualizacionLive() { iniciarApp(); }
        window.onload = () => { actualizarEstructuraPicksLocales(); };
    </script>
</body>
</html>
