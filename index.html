<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Panel Deportivo Oficial PRO</title>

<style>
:root{
    --bg:#090d16;
    --card:#111827;
    --border:#1f2937;
    --text:#f3f4f6;
    --muted:#9ca3af;
    --green:#10b981;
}

*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:Segoe UI, sans-serif;
    padding:20px;
}

.container{
    max-width:1600px;
    margin:auto;
}

header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:15px;
    flex-wrap:wrap;
    margin-bottom:30px;
}

h1{
    margin:0;
    font-size:28px;
}

.api-group{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
}

input{
    background:var(--card);
    border:1px solid var(--border);
    color:white;
    padding:12px;
    border-radius:8px;
    width:320px;
}

button{
    background:var(--green);
    border:none;
    color:white;
    padding:12px 20px;
    border-radius:8px;
    font-weight:bold;
    cursor:pointer;
}

button:hover{
    background:#059669;
}

.loader{
    text-align:center;
    font-size:20px;
    color:var(--green);
    margin:40px 0;
    display:none;
}

.sport-block{
    margin-bottom:40px;
}

.sport-title{
    font-size:28px;
    margin-bottom:20px;
    border-left:6px solid var(--green);
    padding-left:12px;
}

.day-title{
    margin:25px 0 15px;
    font-size:18px;
    color:#93c5fd;
}

.matches-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(370px,1fr));
    gap:18px;
}

.match-card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:12px;
    padding:16px;
}

.match-top{
    display:flex;
    justify-content:space-between;
    margin-bottom:10px;
    font-size:13px;
}

.league{
    color:#60a5fa;
    font-weight:700;
}

.time{
    background:#1e293b;
    padding:4px 8px;
    border-radius:6px;
}

.teams{
    margin-bottom:15px;
}

.team{
    padding:4px 0;
    font-weight:700;
}

.market-title{
    margin-top:14px;
    margin-bottom:8px;
    color:#fbbf24;
    font-size:13px;
    font-weight:bold;
    text-transform:uppercase;
}

.market-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:8px;
}

.market-grid.two{
    grid-template-columns:repeat(2,1fr);
}

.odd{
    background:#0f172a;
    border-radius:8px;
    padding:8px;
    text-align:center;
}

.odd-label{
    font-size:11px;
    color:var(--muted);
    margin-bottom:4px;
}

.odd-value{
    color:#34d399;
    font-weight:bold;
    font-size:14px;
}

.no-data{
    color:var(--muted);
    font-size:12px;
}

.stats{
    margin-bottom:25px;
    background:var(--card);
    border:1px solid var(--border);
    padding:14px 18px;
    border-radius:10px;
    display:none;
}
</style>
</head>

<body>

<div class="container">

<header>
    <h1>⚽ Agenda Deportiva Premium</h1>

    <div class="api-group">
        <input type="text" id="apiKey" placeholder="API Key The Odds API">
        <button onclick="cargarAgenda()">Actualizar</button>
    </div>
</header>

<div class="stats" id="statsBox">
    Eventos encontrados: <strong id="totalEvents">0</strong>
</div>

<div class="loader" id="loader">
    Cargando mercados deportivos...
</div>

<div id="content"></div>

</div>

<script>

const deportesConfig = {

    // 5 GRANDES
    'soccer_epl': { key: 'soccer_epl', nombre:'Premier League', deporte:'Fútbol ⚽' },
    'soccer_spain_la_liga': { key: 'soccer_spain_la_liga', nombre:'La Liga', deporte:'Fútbol ⚽' },
    'soccer_italy_serie_a': { key: 'soccer_italy_serie_a', nombre:'Serie A', deporte:'Fútbol ⚽' },
    'soccer_germany_bundesliga': { key: 'soccer_germany_bundesliga', nombre:'Bundesliga', deporte:'Fútbol ⚽' },
    'soccer_france_ligue_one': { key: 'soccer_france_ligue_one', nombre:'Ligue 1', deporte:'Fútbol ⚽' },

    // EUROPA COMPLEMENTARIAS
    'soccer_netherlands_eredivisie': { key: 'soccer_netherlands_eredivisie', nombre:'Eredivisie', deporte:'Fútbol ⚽' },
    'soccer_portugal_primeira_liga': { key: 'soccer_portugal_primeira_liga', nombre:'Primeira Liga', deporte:'Fútbol ⚽' },
    'soccer_belgium_first_division': { key: 'soccer_belgium_first_division', nombre:'Bélgica Pro League', deporte:'Fútbol ⚽' },
    'soccer_efl_championship': { key: 'soccer_efl_championship', nombre:'Championship', deporte:'Fútbol ⚽' },
    'soccer_turkey_super_league': { key: 'soccer_turkey_super_league', nombre:'Super Lig', deporte:'Fútbol ⚽' },

    // ARGENTINA
    'soccer_argentina_primera_division': { key: 'soccer_argentina_primera_division', nombre:'Liga Argentina', deporte:'Fútbol ⚽' },

    // ARABIA
    'soccer_saudi_pro_league': { key: 'soccer_saudi_pro_league', nombre:'Saudi Pro League', deporte:'Fútbol ⚽' },

    // COPAS
    'soccer_uefa_champions_league': { key: 'soccer_uefa_champions_league', nombre:'Champions League', deporte:'Fútbol ⚽' },
    'soccer_uefa_europa_league': { key: 'soccer_uefa_europa_league', nombre:'Europa League', deporte:'Fútbol ⚽' },
    'soccer_uefa_europa_conference_league': { key: 'soccer_uefa_europa_conference_league', nombre:'Conference League', deporte:'Fútbol ⚽' },

    // AMÉRICA
    'soccer_conmebol_copa_libertadores': { key: 'soccer_conmebol_copa_libertadores', nombre:'Copa Libertadores', deporte:'Fútbol ⚽' },
    'soccer_conmebol_copa_sudamericana': { key: 'soccer_conmebol_copa_sudamericana', nombre:'Copa Sudamericana', deporte:'Fútbol ⚽' },

    // MUNDIAL
    'soccer_fifa_world_cup': { key: 'soccer_fifa_world_cup', nombre:'Mundial FIFA', deporte:'Fútbol ⚽' },

    // NBA
    'basketball_nba': { key: 'basketball_nba', nombre:'NBA', deporte:'Básquet 🏀' },

    // TENIS
    'tennis_atp_matches': { key: 'tennis_atp_matches', nombre:'ATP', deporte:'Tenis 🎾' }
};

async function cargarAgenda(){

    const apiKey = document.getElementById('apiKey').value.trim();

    if(!apiKey){
        alert('Ingresá la API Key');
        return;
    }

    const content = document.getElementById('content');
    const loader = document.getElementById('loader');
    const statsBox = document.getElementById('statsBox');
    const totalEvents = document.getElementById('totalEvents');

    content.innerHTML = '';
    loader.style.display = 'block';
    statsBox.style.display = 'none';

    const sportKeys = Object.keys(deportesConfig);

    const promises = sportKeys.map(async sportKey => {

        try{

            let markets = '';

            if(sportKey.startsWith('soccer')){

                markets = 'h2h,totals,spreads,correct_score';

            }else if(sportKey.startsWith('tennis')){

                markets = 'h2h,totals,spreads';

            }else if(sportKey.startsWith('basketball')){

                markets = 'h2h,spreads,totals';
            }

            const url =
            `https://api.the-odds-api.com/v4/sports/${sportKey}/odds/?regions=eu&markets=${markets}&oddsFormat=decimal&apiKey=${apiKey}`;

            const response = await fetch(url);

            if(!response.ok) throw new Error();

            const data = await response.json();

            return {sportKey,data};

        }catch(e){

            return {sportKey,data:[]};
        }
    });

    const resultados = await Promise.all(promises);

    loader.style.display = 'none';

    const estructura = {};

    let contador = 0;

    const ahora = new Date();
    const limite = new Date();
    limite.setDate(ahora.getDate()+7);

    resultados.forEach(resultado=>{

        const config = deportesConfig[resultado.sportKey];

        resultado.data.forEach(evento=>{

            const fecha = new Date(evento.commence_time);

            if(fecha < ahora || fecha > limite) return;

            contador++;

            if(!estructura[config.deporte]){
                estructura[config.deporte] = {};
            }

            const dia = fecha.toLocaleDateString('es-AR',{
                weekday:'long',
                day:'numeric',
                month:'long'
            });

            if(!estructura[config.deporte][dia]){
                estructura[config.deporte][dia] = [];
            }

            evento.liga = config.nombre;

            estructura[config.deporte][dia].push(evento);
        });
    });

    totalEvents.innerText = contador;
    statsBox.style.display = 'block';

    for(const [deporte,dias] of Object.entries(estructura)){

        const sportBlock = document.createElement('div');
        sportBlock.className = 'sport-block';

        sportBlock.innerHTML += `
            <div class="sport-title">${deporte}</div>
        `;

        for(const [dia,eventos] of Object.entries(dias)){

            sportBlock.innerHTML += `
                <div class="day-title">📅 ${dia}</div>
            `;

            const grid = document.createElement('div');
            grid.className = 'matches-grid';

            eventos.sort((a,b)=>
                new Date(a.commence_time)-new Date(b.commence_time)
            );

            eventos.forEach(evento=>{

                const hora = new Date(evento.commence_time)
                .toLocaleTimeString('es-AR',{
                    hour:'2-digit',
                    minute:'2-digit'
                });

                const card = document.createElement('div');
                card.className = 'match-card';

                let marketsHTML = '';

                const bookmaker = evento.bookmakers?.[0];

                if(bookmaker){

                    bookmaker.markets.forEach(market=>{

                        let title = '';

                        if(market.key === 'h2h') title = 'Ganador';
                        if(market.key === 'totals') title = 'Totales';
                        if(market.key === 'spreads') title = 'Hándicap / Líneas';
                        if(market.key === 'correct_score') title = 'Marcador Exacto';

                        let cols = 3;

                        if(market.outcomes.length === 2){
                            cols = 2;
                        }

                        marketsHTML += `
                            <div class="market-title">${title}</div>
                            <div class="market-grid ${cols===2?'two':''}">
                        `;

                        market.outcomes.slice(0,12).forEach(outcome=>{

                            let label = outcome.name;

                            if(outcome.point !== undefined){
                                label += ` ${outcome.point > 0 ? '+' : ''}${outcome.point}`;
                            }

                            marketsHTML += `
                                <div class="odd">
                                    <div class="odd-label">${label}</div>
                                    <div class="odd-value">${outcome.price}</div>
                                </div>
                            `;
                        });

                        marketsHTML += `</div>`;
                    });

                }else{

                    marketsHTML = `
                        <div class="no-data">
                            Sin mercados disponibles
                        </div>
                    `;
                }

                card.innerHTML = `
                    <div class="match-top">
                        <div class="league">${evento.liga}</div>
                        <div class="time">${hora}</div>
                    </div>

                    <div class="teams">
                        <div class="team">🔹 ${evento.home_team}</div>
                        <div class="team">🔸 ${evento.away_team}</div>
                    </div>

                    ${marketsHTML}
                `;

                grid.appendChild(card);
            });

            sportBlock.appendChild(grid);
        }

        content.appendChild(sportBlock);
    }
}

</script>

</body>
</html>
