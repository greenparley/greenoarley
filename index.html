<script>


// =====================================
// GREENPICKS PRO
// SISTEMA DE APIS
// ROTACIÓN + CACHÉ + CONTROL ERRORES
// =====================================


const API_KEYS = [

"b1068f561f80975166b5c1ab67a2888a",

"c7b062bf872742e25c086b5ad997ba0a",

"f900242e004a6964ac7d711eafca119c",

"12645d55775fe9919ad938d99af60474"

];



let indiceApiKeyActual = 0;



const CACHE_API = {};

const TIEMPO_CACHE = 300000;




function obtenerApiKeyActiva(){

return API_KEYS[indiceApiKeyActual];

}





function rotarApiKey(){


indiceApiKeyActual++;


if(indiceApiKeyActual >= API_KEYS.length){

indiceApiKeyActual = 0;

}


}





function limpiarCacheAPI(){


Object.keys(CACHE_API).forEach(key=>{

delete CACHE_API[key];

});


}




function guardarCacheAPI(url,data){


CACHE_API[url]={

data:data,

fecha:Date.now()

};


}





function obtenerCacheAPI(url){


const item = CACHE_API[url];


if(!item)
return null;



if(Date.now()-item.fecha > TIEMPO_CACHE){


delete CACHE_API[url];


return null;

}



return item.data;


}







async function fetchConRotacion(urlTemplate){



const cache = obtenerCacheAPI(urlTemplate);



if(cache){


console.log("📦 Usando caché");


return {


ok:true,


json:async()=>cache


};


}







for(let intento=0; intento<API_KEYS.length; intento++){



let url = urlTemplate.replace(

"API_KEY_PLACEHOLDER",

obtenerApiKeyActiva()

);




try{



const controller = new AbortController();



const timeout = setTimeout(()=>{

controller.abort();

},8000);




let res = await fetch(url,{

signal:controller.signal

});




clearTimeout(timeout);







if(res.status===401 || res.status===429){



console.log(

"API rechazada, rotando clave"

);



rotarApiKey();


continue;


}







if(!res.ok){


rotarApiKey();


continue;


}







let data = await res.json();





guardarCacheAPI(

urlTemplate,

data

);






return {


ok:true,


json:async()=>data


};





}catch(error){



console.log(

"Error API:",

error.message

);



rotarApiKey();



}





}






throw new Error(

"Todas las APIs no disponibles"

);



}
    
// =====================================

// =====================================
// NAVEGACIÓN PRINCIPAL
// =====================================


function irADeporte(deporte){


    deporteActivo = deporte;


    document
    .getElementById("lobby-selector")
    .classList.add("oculto");



    document
    .getElementById("app-content")
    .classList.remove("oculto");



    const titulo =
    document.getElementById(
        "titulo-deporte-activo"
    );



    if(deporte==="futbol"){

        titulo.innerHTML="FÚTBOL ⚽";

    }


    else if(deporte==="basquet"){

        titulo.innerHTML="BÁSQUET 🏀";

    }


    else if(deporte==="tenis"){

        titulo.innerHTML="TENIS 🎾";

    }



    cargarDatosDeportivos();


}




function volverAlLobby(){


    document
    .getElementById("app-content")
    .classList.add("oculto");



    document
    .getElementById("vista-detalle")
    .classList.add("oculto");



    document
    .getElementById("lobby-selector")
    .classList.remove("oculto");


}




// =====================================
// FILTROS
// =====================================


function setFiltroEstado(estado){


    estadoFiltroActual = estado;



    document
    .querySelectorAll(".btn-filto-main")
    .forEach(btn=>{

        btn.classList.remove("activo");

    });



    const boton =
    document.getElementById(
        "btn-"+estado
    );



    if(boton){

        boton.classList.add("activo");

    }



    renderizarVistaActual();


}





// =====================================
// ACTUALIZACIÓN MANUAL
// =====================================


async function forzarActualizacion(){


    console.log(
        "🔄 Actualización forzada"
    );



    limpiarCacheAPI();



    baseDeDatosHoy=[];



    await cargarDatosDeportivos();


}





// =====================================
// CARGA PRINCIPAL
// =====================================


async function cargarDatosDeportivos(){


    const errorBox =
    document.getElementById(
        "logs-servidor-error"
    );



    if(errorBox){

        errorBox.classList.add("oculto");

    }




    try{


        let datos=[];

function generarMonograma(nombre, extraClass=""){


    if(!nombre)
        nombre="X";


    const iniciales =
    nombre.substring(0,3).toUpperCase();



    return `

    <div class="escudo-dinamico ${extraClass}">

    ${iniciales}

    </div>

    `;

}





function formatearFechaHoraLocal(fechaIso){


    if(!fechaIso)
        return "--/-- --:--";



    const fecha =
    new Date(fechaIso);



    const dia =
    String(fecha.getDate())
    .padStart(2,"0");



    const mes =
    String(fecha.getMonth()+1)
    .padStart(2,"0");



    const hora =
    String(fecha.getHours())
    .padStart(2,"0");



    const minutos =
    String(fecha.getMinutes())
    .padStart(2,"0");



    return `${dia}/${mes} - ${hora}:${minutos}`;

}





function procesarEstadoTiempo(fechaIso){


    const ahora =
    Date.now();



    const inicio =
    new Date(fechaIso).getTime();



    const diferencia =
    ahora - inicio;




    if(
        diferencia > 0 &&
        diferencia < 9000000
    ){

        return {

            isLiveNative:true,

            isFinished:false

        };

    }




    if(
        diferencia >= 9000000 &&
        diferencia < 86400000
    ){

        return {

            isLiveNative:false,

            isFinished:true

        };

    }




    return {

        isLiveNative:false,

        isFinished:false

    };


}

function calcularConfianzaBase(partido){


    let confianza = 50;



    if(partido.mercados){

        confianza += 10;

    }



    if(partido.liga){

        confianza += 5;

    }



    if(partido.fecha){

        confianza += 5;

    }



    if(confianza>95){

        confianza=95;

    }



    return confianza;


}








function analizarPartidoIA(partido){

            probabilidad:
            confianza

        ]



    };




    return analisis;


}

function calcularEV(probabilidad,cuota){


    if(!cuota)
        return 0;



    let p =
    probabilidad / 100;



    return (

        (p * cuota) - 1

    ) * 100;


}







function esEVPositivo(probabilidad,cuota){


    return calcularEV(
        probabilidad,
        cuota
    ) > 0;


                }

// =====================================



function calcularProbabilidadCombinada(picks){


    if(!picks || picks.length===0)
        return 0;



    let resultado = 1;



    picks.forEach(pick=>{


        resultado *=
        pick.probabilidad / 100;



    });



    return Math.round(
        resultado * 100
    );

}








function estimarCuotaPick(probabilidad){


    if(!probabilidad || probabilidad<=0)
        return 1;



    return Number(
        (100 / probabilidad)
        .toFixed(2)
    );


}








function calcularCuotaCombinada(picks){



    let cuota = 1;



    picks.forEach(pick=>{


        cuota *=
        estimarCuotaPick(
            pick.probabilidad
        );



    });



    return Number(
        cuota.toFixed(2)
    );


}








function calcularEVCombinada(picks){



    const probabilidad =
    calcularProbabilidadCombinada(
        picks
    );



    const cuota =
    calcularCuotaCombinada(
        picks
    );



    return calcularEV(
        probabilidad,
        cuota
    );

}

let historialAnalisis = {};







function generarPuntuacionEquipo(nombre){


    if(!nombre)
        return 50;



    let hash = 0;



    for(
        let i=0;
        i<nombre.length;
        i++
    ){


        hash +=
        nombre.charCodeAt(i);



    }



    // Simulación estable
    // será reemplazada por estadísticas reales


    return 45 + (hash % 45);


}







function analizarFuerzaEquipos(partido){



    const fuerzaLocal =
    generarPuntuacionEquipo(
        partido.local
    );



    const fuerzaVisitante =
    generarPuntuacionEquipo(
        partido.visitante
    );





    return {


        local:
        fuerzaLocal,



        visitante:
        fuerzaVisitante,



        diferencia:
        fuerzaLocal-fuerzaVisitante


    };


}








function factorLocalia(partido){



    if(!partido)
        return 0;



    return 5;


}








function calcularIAAvanzada(partido){



    const fuerza =
    analizarFuerzaEquipos(
        partido
    );




    let probLocal = 50;





    probLocal +=
    fuerza.diferencia / 2;





    probLocal +=
    factorLocalia(
        partido
    );







    if(probLocal>90){

        probLocal=90;

    }





    if(probLocal<10){

        probLocal=10;

    }






    const probVisitante =
    100 - probLocal;





    return {


        local:

        Math.round(
            probLocal
        ),



        visitante:

        Math.round(
            probVisitante
        ),



        fuerza:fuerza


    };



}

    }
    
// =====================================
// IA MERCADOS AVANZADOS
// GOLES / BTTS / CORNERS / TARJETAS
// =====================================





function analizarMercadoGoles(partido){



    const fuerza =
    analizarFuerzaEquipos(
        partido
    );



    let probabilidad = 55;



    probabilidad +=
    Math.abs(
        fuerza.diferencia
    ) * 0.2;





    if(probabilidad>90){

        probabilidad=90;

    }





    return {


        mas15:
        Math.round(
            probabilidad + 10
        ),



        mas25:
        Math.round(
            probabilidad
        ),



        menos35:
        Math.round(
            100-probabilidad
        )


    };


}









function analizarAmbosMarcan(partido){



    const goles =
    analizarMercadoGoles(
        partido
    );



    return Math.min(

        90,

        Math.round(
            goles.mas25 - 5
        )

    );


}








function analizarCorners(partido){



    const fuerza =
    analizarFuerzaEquipos(
        partido
    );



    let valor =
    50 +
    Math.abs(
        fuerza.diferencia
    );




    if(valor>85){

        valor=85;

    }




    return {


        mas85:
        Math.round(valor),



        mas95:
        Math.round(
            valor-10
        )


    };



}








function analizarTarjetas(partido){



    const base = 55;



    return {


        mas35:
        base,



        mas45:
        base-10


    };


}

function obtenerCacheLocal(nombre){



    const dato =

    localStorage.getItem(
        nombre
    );



    if(!dato)
        return null;




    try{


        const paquete =
        JSON.parse(dato);




        // 30 minutos


        if(
            Date.now()
            -
            paquete.fecha
            >
            1800000
        ){


            localStorage.removeItem(
                nombre
            );


            return null;


        }




        return paquete.datos;



    }catch(e){



        return null;



    }



}
