<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Control - Apuestas Inteligentes</title>
    <style>
        :root {
            --fondo-oscuro: #121214;
            --tarjeta-fondo: #1a1a1e;
            --verde-principal: #00b4d8;
            --oro: #ffb703;
            --texto-blanco: #ffffff;
            --texto-gris: #8e8e93;
            --borde: rgba(255, 255, 255, 0.08);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--fondo-oscuro);
            color: var(--texto-blanco);
            margin: 0;
            padding: 20px;
        }

        .app-container {
            max-width: 1200px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        @media (max-width: 768px) {
            .app-container { grid-template-columns: 1fr; }
        }

        header {
            grid-column: 1 / -1;
            text-align: center;
            margin-bottom: 20px;
        }

        /* Selector de Deportes */
        .selector-deportes {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
        }

        .btn-deporte {
            background: var(--tarjeta-fondo);
            color: var(--texto-gris);
            border: 1px solid var(--borde);
            padding: 10px 20px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
        }

        .btn-deporte.activo {
            background: var(--verde-principal);
            color: #000;
            border-color: var(--verde-principal);
        }

        /* Secciones */
        section {
            background: var(--tarjeta-fondo);
            border: 1px solid var(--borde);
            border-radius: 8px;
            padding: 20px;
        }

        h2 {
            margin-top: 0;
            font-size: 1.2rem;
            border-bottom: 1px solid var(--borde);
            padding-bottom: 10px;
            color: var(--verde-principal);
        }

        /* Elementos interactivos */
        .tarjeta-partido {
            background: rgba(255, 255, 255, 0.02);
            margin-bottom: 8px;
            padding: 12px;
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid var(--borde);
            transition: background 0.2s;
        }

        .tarjeta-partido:hover {
            background: rgba(255, 255, 255, 0.05);
        }

        .badge-live {
            color: #ff4d4d;
            font-weight: bold;
            font-size: 0.85rem;
            background: rgba(255, 77, 77, 0.1);
            padding: 3px 8px;
            border-radius: 4px;
        }

        .bloque-mercado {
            background: rgba(0, 0, 0, 0.2);
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

    <header>
        <h1>🏆 Sistema de Análisis Deportivo</h1>
        <div class="selector-deportes">
            <button class="btn-deporte activo" onclick="cambiarDeporte('futbol')">⚽ Fútbol</button>
            <button class="btn-deporte" onclick="cambiarDeporte('tenis')">🎾 Tenis</button>
            <button class="btn-deporte" onclick="cambiarDeporte('basquet')">🏀 Básquet</button>
        </div>
    </header>

    <div class="app-container">

        <div style="display: flex; flex-direction: column; gap: 20px;">
            <section>
                <h2>📅 Partidos para Apostar (Próximos y En Vivo)</h2>
                <div id="contenedor-partidos-lista"></div>
            </section>

            <section>
                <h2>🔍 Detalle de Mercados Disponibles</h2>
                <div id="contenedor-mercados">
                    <div style="color: var(--texto-gris); text-align: center; padding: 20px;">
                        Seleccioná un partido activo para ver sus opciones avanzadas.
                    </div>
                </div>
            </section>
        </div>

        <div style="display: flex; flex-direction: column; gap: 20px;">
            <section>
                <h2>📊 Combinadas Recomendadas (Anti-Batacazos)</h2>
                <div id="contenedor-combinadas"></div>
            </section>

            <section style="border-left: 4px solid var(--texto-gris);">
                <h2>🏁 Resultados de las Últimas 24 Horas</h2>
                <div id="contenedor-finalizados"></div>
            </section>
        </div>

    </div>

    <script>
        // Estado global de la aplicación
        let deporteActivo = 'futbol';

        // BASE DE DATOS DE PRUEBA (Simula las diferentes respuestas posibles de una API)
        let partidosDisponibles = [
            // FÚTBOL
            { id: 101, deporte: 'futbol', local: 'Real Madrid', visita: 'Barcelona', status: 'Not Started', cuotasReales: { local: 1.50, visita: 4.20 } },
            { id: 102, deporte: 'futbol', local: 'Manchester City', visita: 'Liverpool', status: 'In_Progress', live: true, cuotasReales: { local: 1.60, visita: 3.40 } },
            { id: 103, deporte: 'futbol', local: 'Bayern Munich', visita: 'Dortmund', status: 'Match Finished', finished: true, golesLocal: 3, golesVisita: 1, timestamp: Date.now() - (4 * 60 * 60 * 1000) }, // Hace 4 horas
            { id: 104, deporte: 'futbol', local: 'Juventus', visita: 'Milan', status: 'Finished', finished: true, golesLocal: 0, golesVisita: 0, timestamp: Date.now() - (30 * 60 * 60 * 1000) }, // Hace 30 horas (No debe aparecer)

            // TENIS
            { id: 201, deporte: 'tenis', local: 'Carlos Alcaraz', visita: 'Jannik Sinner', status: 'LIVE', live: true, homeScore: { current: '1', point: '30', serving: true }, awayScore: { current: '0', point: '15', serving: false } },
            { id: 202, deporte: 'tenis', local: 'Novak Djokovic', visita: 'Daniil Medvedev', status: 'Not Started', cuotasReales: { local: 1.40, visita: 2.80 } },
            { id: 203, deporte: 'tenis', local: 'Rafael Nadal', visita: 'Casper Ruud', status: 'Finished', finished: true, homeScore: { display: '2' }, awayScore: { display: '0' }, timestamp: Date.now() - (2 * 60 * 60 * 1000) },

            // BÁSQUET
            { id: 301, deporte: 'basquet', local: 'LA Lakers', visita: 'GS Warriors', status: 'Not Started', cuotasReales: { local: 1.85, visita: 1.85 } },
            { id: 302, deporte: 'basquet', local: 'Boston Celtics', visita: 'Miami Heat', status: 'Finished', finished: true, puntosLocal: 112, puntosVisita: 104, timestamp: Date.now() - (6 * 60 * 60 * 1000) }
        ];

        // =========================================================================
        // 🛠️ CONTROLADORES Y DETECTORES UNIVERSALES
        // =========================================================================
        function verificarSiEsEnVivo(p) {
            if (verificarSiEstaFinalizado(p)) return false;
            if (p.live === true || p.isLive === true) return true;
            if (p.status) {
                let estadoTexto = JSON.stringify(p.status).toLowerCase();
                return (estadoTexto.includes('live') || estadoTexto.includes('inprogress') || estadoTexto.includes('in_progress') || estadoTexto.includes('started') || estadoTexto.includes('playing'));
            }
            return false;
        }

        function verificarSiEstaFinalizado(p) {
            if (p.finished === true || p.isFinished === true || p.status?.type === 'finished') return true;
            if (p.status) {
                let estadoTexto = JSON.stringify(p.status).toLowerCase();
                return (estadoTexto.includes('finished') || estadoTexto.includes('ft') || estadoTexto.includes('ended') || estadoTexto.includes('finalizado') || estadoTexto.includes('concluded'));
            }
            return false;
        }

        function pasoMenosDe24Horas(p) {
            let timestamp = p.timestamp || p.startTimestamp || p.fixture?.timestamp;
            if (timestamp) {
                if (timestamp < 10000000000) timestamp *= 1000;
                const diferenciaHoras = (Date.now() - timestamp) / (1000 * 60 * 60);
                return diferenciaHoras >= 0 && diferenciaHoras <= 24;
            }
            return true; 
        }

        function cambiarDeporte(deporte) {
            deporteActivo = deporte;
            document.querySelectorAll('.btn-deporte').forEach(btn => btn.classList.remove('activo'));
            event.target.classList.add('activo');
            actualizarTodaLaInterfaz();
        }

        // =========================================================================
        // 📱 VISTA 1: RENDERIZAR LISTA PRINCIPAL (ACTIVOS)
        // =========================================================================
        function renderizarListaPrincipal() {
            const contenedorLista = document.getElementById('contenedor-partidos-lista'); 
            if (!contenedorLista) return;
            contenedorLista.innerHTML = '';

            let partidosParaApostar = partidosDisponibles.filter(p => {
                if (p.deporte !== deporteActivo) return false;
                if (verificarSiEstaFinalizado(p)) return false; 
                if (deporteActivo === 'futbol' || deporteActivo === 'tenis') {
                    if (verificarSiEsEnVivo(p)) return true;
                    return p.cuotasReales && p.cuotasReales.local && p.cuotasReales.visita;
                }
                return true; 
            });

            if (partidosParaApostar.length === 0) {
                contenedorLista.innerHTML = `<div style="color: var(--texto-gris); text-align: center; padding: 20px;">No hay partidos activos o próximos para este deporte.</div>`;
                return;
            }

            partidosParaApostar.forEach(p => {
                let nombreLocal = p.homeTeam?.name || p.local || "Local";
                let nombreVisita = p.awayTeam?.name || p.visita || "Visita";
                let esLive = verificarSiEsEnVivo(p);

                let infoCuotasHTML = esLive 
                    ? `<span class="badge-live">⚡ EN VIVO</span>` 
                    : `<span style="color: var(--texto-gris); font-size: 0.85rem;">L: ${p.cuotasReales?.local || '1.85'} | V: ${p.cuotasReales?.visita || '1.85'}</span>`;

                contenedorLista.innerHTML += `
                    <div class="tarjeta-partido" onclick="abrirDetalle('${p.id}')">
                        <span style="font-weight: 500;">${nombreLocal} vs ${nombreVisita}</span>
                        <div>${infoCuotasHTML}</div>
                    </div>
                `;
            });
        }

        // =========================================================================
        // 📊 VISTA 2: COMBINADAS DEL DÍA (ANTI-BATACAZOS)
        // =========================================================================
        function generarCombinadaDelDia() {
            const contenedor = document.getElementById('contenedor-combinadas');
            if (!contenedor) return;
            contenedor.innerHTML = '';

            let partidosValidos = partidosDisponibles.filter(p => {
                if (p.deporte !== deporteActivo) return false;
                if (verificarSiEstaFinalizado(p)) return false; 
                if (deporteActivo === 'futbol' || deporteActivo === 'tenis') {
                    if (verificarSiEsEnVivo(p)) return true;
                    return p.cuotasReales && p.cuotasReales.local && p.cuotasReales.visita;
                }
                return true; 
            });

            if (partidosValidos.length < 2) {
                contenedor.innerHTML = `<div style="color: var(--texto-gris); text-align: center; padding: 20px;">Se necesitan al menos 2 partidos activos para simular combinadas.</div>`;
                return;
            }

            const nivelesRiesgo = ['asegurada', 'moderada'];

            nivelesRiesgo.forEach((riesgo, index) => {
                let seleccionados = partidosValidos.slice(0, 2); // Tomamos 2 por el mock de datos reducido
                let htmlTickets = '';
                let cuotaTotalCombinada = 1.00;
                let colorBorde = riesgo === 'asegurada' ? "#00b4d8" : "var(--oro)";

                seleccionados.forEach(p => {
                    let nombreLocal = p.homeTeam?.name || p.local || "Local";
                    let nombreVisita = p.awayTeam?.name || p.visita || "Visita";
                    let cLocal = p.cuotasReales?.local ? parseFloat(p.cuotasReales.local) : 1.85;
                    let cVisita = p.cuotasReales?.visita ? parseFloat(p.cuotasReales.visita) : 1.85;
                    
                    let nameFav = cLocal <= cVisita ? nombreLocal : nombreVisita;
                    let pickMercado = deporteActivo === 'futbol' ? `Doble Op. Gana/Empata ${nameFav}` : `Gana un Set: ${nameFav}`;
                    let pickCuota = 1.25;

                    cuotaTotalCombinada *= pickCuota;

                    htmlTickets += `
                        <div style="font-size: 0.85rem; margin-bottom: 6px; display: flex; justify-content: space-between;">
                            <span>📌 ${nombreLocal} vs ${nombreVisita} (${pickMercado})</span>
                            <span style="color: var(--oro)">x${pickCuota.toFixed(2)}</span>
                        </div>
                    `;
                });

                contenedor.innerHTML += `
                    <div style="background: rgba(255,255,255,0.02); border: 1px solid var(--borde); border-top: 3px solid ${colorBorde}; padding: 12px; margin-bottom: 10px; border-radius: 4px;">
                        <div style="display: flex; justify-content: space-between; font-weight: bold; font-size: 0.8rem; margin-bottom: 8px; color:${colorBorde};">
                            <span>Sugerencia ${riesgo.toUpperCase()}</span>
                            <span>Total: x${cuotaTotalCombinada.toFixed(2)}</span>
                        </div>
                        ${htmlTickets}
                    </div>
                `;
            });
        }

        // =========================================================================
        // 🔍 VISTA 3: INTERFAZ DE DETALLE DE MERCADOS Y VIVO INTERACTIVO
        // =========================================================================
        function abrirDetalle(partidoId) {
            let p = partidosDisponibles.find(item => item.id == partidoId);
            if (!p) return;

            const contenedorMercados = document.getElementById('contenedor-mercados');
            if (!contenedorMercados) return;

            let htmlMercados = '';
            let nombreL = p.local || "Local";
            let nombreV = p.visita || "Visita";

            if (deporteActivo === 'tenis' && verificarSiEsEnVivo(p)) {
                let marcadorL = p.homeScore?.current ?? "-";
                let marcadorV = p.awayScore?.current ?? "-";
                let puntosL = p.homeScore?.point ?? "";
                let puntosV = p.awayScore?.point ?? "";
                
                htmlMercados += `
                    <div class="bloque-mercado" style="border-left: 4px solid #00b4d8; background: rgba(0,180,216,0.05);">
                        <div style="font-size: 0.75rem; color: #00b4d8; font-weight: bold; margin-bottom: 6px;">⚡ MARCADOR EN VIVO EN DIRECTO</div>
                        <div style="display: flex; justify-content: space-between;"><span>${p.homeScore?.serving ? '🎾 ' : ''}${nombreL}</span><span style="color:var(--oro); font-weight:bold;">${marcadorL} (${puntosL})</span></div>
                        <div style="display: flex; justify-content: space-between; margin-top: 4px;"><span>${p.awayScore?.serving ? '🎾 ' : ''}${nombreV}</span><span style="color:var(--oro); font-weight:bold;">${marcadorV} (${puntosV})</span></div>
                    </div>
                    <div class="bloque-mercado"><h4>Ganador del Set en Juego</h4><button class="btn-deporte">Apostar en Vivo</button></div>
                `;
            } else {
                let cLocal = p.cuotasReales?.local ?? "1.85";
                let cVisita = p.cuotasReales?.visita ?? "1.85";
                htmlMercados += `
                    <div class="bloque-mercado">
                        <h4>Ganador del Partido (Money Line)</h4>
                        <div style="display: flex; justify-content: space-between; margin-bottom: 6px;"><span>${nombreL}</span> <span style="color:var(--oro)">x${cLocal}</span></div>
                        <div style="display: flex; justify-content: space-between;"><span>${nombreV}</span> <span style="color:var(--oro)">x${cVisita}</span></div>
                    </div>
                `;
            }

            contenedorMercados.innerHTML = htmlMercados;
        }

        // =========================================================================
        // 🏁 VISTA 4: APARTADO DE PARTIDOS FINALIZADOS (HISTORIAL RECIENTE 24HS)
        // =========================================================================
        function mostrarPartidosFinalizados() {
            const contenedor = document.getElementById('contenedor-finalizados');
            if (!contenedor) return;
            contenedor.innerHTML = '';

            let finalizados = partidosDisponibles.filter(p => {
                return p.deporte === deporteActivo && verificarSiEstaFinalizado(p) && pasoMenosDe24Horas(p);
            });

            if (finalizados.length === 0) {
                contenedor.innerHTML = `<div style="color: var(--texto-gris); text-align: center; padding: 15px; font-size: 0.85rem;">No hay resultados registrados en las últimas 24 horas.</div>`;
                return;
            }

            finalizados.forEach(p => {
                let nombreLocal = p.local || "Local";
                let nombreVisita = p.visita || "Visita";
                let resL = p.golesLocal ?? p.puntosLocal ?? p.homeScore?.display ?? "-";
                let resV = p.golesVisita ?? p.puntosVisita ?? p.awayScore?.display ?? "-";

                contenedor.innerHTML += `
                    <div style="background: rgba(255,255,255,0.01); border: 1px solid var(--borde); padding: 10px; margin-bottom: 6px; border-radius: 4px; display: flex; justify-content: space-between; align-items: center;">
                        <div style="font-size: 0.9rem; flex: 1;">
                            <div style="display: flex; justify-content: space-between; margin-bottom: 2px;"><span>${nombreLocal}</span><span style="font-weight:bold; color:var(--oro);">${resL}</span></div>
                            <div style="display: flex; justify-content: space-between;"><span>${nombreVisita}</span><span style="font-weight:bold; color:var(--oro);">${resV}</span></div>
                        </div>
                    </div>
                `;
            });
        }

        // =========================================================================
        // 🔄 ORQUESTADOR DE INICIALIZACIÓN
        // =========================================================================
        function actualizarTodaLaInterfaz() {
            renderizarListaPrincipal();
            generarCombinadaDelDia();
            mostrarPartidosFinalizados();
        }

        // Arrancar la app automáticamente cuando carga la ventana
        window.onload = function() {
            actualizarTodaLaInterfaz();
        };
    </script>
</body>
</html>
