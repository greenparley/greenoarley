<script>


// =====================================
// GREENPICKS PRO
// SISTEMA DE APIS
// ROTACIÓN + CACHÉ + CONTROL ERRORES
// =====================================


const API_KEYS = [

"b1068f561f80975166b5c1ab67a2888a",

"c7b062bf872742e25c086b5ad997ba0a",

"f900242e004a6964ac7d711eafca119c",

"12645d55775fe9919ad938d99af60474"

];



let indiceApiKeyActual = 0;



const CACHE_API = {};

const TIEMPO_CACHE = 300000;




function obtenerApiKeyActiva(){

return API_KEYS[indiceApiKeyActual];

}





function rotarApiKey(){


indiceApiKeyActual++;


if(indiceApiKeyActual >= API_KEYS.length){

indiceApiKeyActual = 0;

}


}





function limpiarCacheAPI(){


Object.keys(CACHE_API).forEach(key=>{

delete CACHE_API[key];

});


}




function guardarCacheAPI(url,data){


CACHE_API[url]={

data:data,

fecha:Date.now()

};


}





function obtenerCacheAPI(url){


const item = CACHE_API[url];


if(!item)
return null;



if(Date.now()-item.fecha > TIEMPO_CACHE){


delete CACHE_API[url];


return null;

}



return item.data;


}







async function fetchConRotacion(urlTemplate){



const cache = obtenerCacheAPI(urlTemplate);



if(cache){


console.log("📦 Usando caché");


return {


ok:true,


json:async()=>cache


};


}







for(let intento=0; intento<API_KEYS.length; intento++){



let url = urlTemplate.replace(

"API_KEY_PLACEHOLDER",

obtenerApiKeyActiva()

);




try{



const controller = new AbortController();



const timeout = setTimeout(()=>{

controller.abort();

},8000);




let res = await fetch(url,{

signal:controller.signal

});




clearTimeout(timeout);







if(res.status===401 || res.status===429){



console.log(

"API rechazada, rotando clave"

);



rotarApiKey();


continue;


}







if(!res.ok){


rotarApiKey();


continue;


}







let data = await res.json();





guardarCacheAPI(

urlTemplate,

data

);






return {


ok:true,


json:async()=>data


};





}catch(error){



console.log(

"Error API:",

error.message

);



rotarApiKey();



}





}






throw new Error(

"Todas las APIs no disponibles"

);



}

function generarMonograma(nombre, extraClass=""){


    if(!nombre)
        nombre="X";


    const iniciales =
    nombre.substring(0,3).toUpperCase();



    return `

    <div class="escudo-dinamico ${extraClass}">

    ${iniciales}

    </div>

    `;

}





function formatearFechaHoraLocal(fechaIso){


    if(!fechaIso)
        return "--/-- --:--";



    const fecha =
    new Date(fechaIso);



    const dia =
    String(fecha.getDate())
    .padStart(2,"0");



    const mes =
    String(fecha.getMonth()+1)
    .padStart(2,"0");



    const hora =
    String(fecha.getHours())
    .padStart(2,"0");



    const minutos =
    String(fecha.getMinutes())
    .padStart(2,"0");



    return `${dia}/${mes} - ${hora}:${minutos}`;

}





function procesarEstadoTiempo(fechaIso){


    const ahora =
    Date.now();



    const inicio =
    new Date(fechaIso).getTime();



    const diferencia =
    ahora - inicio;




    if(
        diferencia > 0 &&
        diferencia < 9000000
    ){

        return {

            isLiveNative:true,

            isFinished:false

        };

    }




    if(
        diferencia >= 9000000 &&
        diferencia < 86400000
    ){

        return {

            isLiveNative:false,

            isFinished:true

        };

    }




    return {

        isLiveNative:false,

        isFinished:false

    };


}

function convertirCuotaProbabilidad(cuota){


    if(!cuota || cuota<=0)
        return 0;



    return (1 / cuota) * 100;


}







function calcularConfianzaBase(partido){


    let confianza = 50;



    if(partido.mercados){

        confianza += 10;

    }



    if(partido.liga){

        confianza += 5;

    }



    if(partido.fecha){

        confianza += 5;

    }



    if(confianza>95){

        confianza=95;

    }



    return confianza;


}








function analizarPartidoIA(partido){



    const confianza =
    calcularConfianzaBase(partido);





    let analisis = {



        ganador:

        {

            seleccion:
            partido.local,

            probabilidad:
            confianza

        },



        dobleOportunidad:


        {

            seleccion:
            "1X",

            probabilidad:
            Math.min(confianza+5,98)

        },



        goles:


        {

            mercado:
            "Más de 1.5 goles",

            probabilidad:
            Math.min(confianza+3,95)

        },



        ambosMarcan:


        {

            mercado:
            "Ambos marcan",

            probabilidad:
            55

        },



        exacto:


        [

            {

                marcador:"1-0",

                probabilidad:20

            },

            {

                marcador:"2-0",

                probabilidad:15

            },

            {

                marcador:"2-1",

                probabilidad:12

            }

        ]



    };




    return analisis;


}








function generarPickIA(partido){


    const ia =
    analizarPartidoIA(partido);



    return {


        partido:
        partido.local+
        " vs "+
        partido.visitante,



        pick:
        ia.ganador.seleccion,



        probabilidad:
        ia.ganador.probabilidad,



        mercado:
        "Ganador"



    };



}







// =====================================
// VALOR ESPERADO EV+
// =====================================



function calcularEV(probabilidad,cuota){


    if(!cuota)
        return 0;



    let p =
    probabilidad / 100;



    return (

        (p * cuota) - 1

    ) * 100;


}







function esEVPositivo(probabilidad,cuota){


    return calcularEV(
        probabilidad,
        cuota
    ) > 0;


                }

// =====================================
// CÁLCULO COMBINADAS
// =====================================



function calcularProbabilidadCombinada(picks){


    if(!picks || picks.length===0)
        return 0;



    let resultado = 1;



    picks.forEach(pick=>{


        resultado *=
        pick.probabilidad / 100;



    });



    return Math.round(
        resultado * 100
    );

}








function estimarCuotaPick(probabilidad){


    if(!probabilidad || probabilidad<=0)
        return 1;



    return Number(
        (100 / probabilidad)
        .toFixed(2)
    );


}








function calcularCuotaCombinada(picks){



    let cuota = 1;



    picks.forEach(pick=>{


        cuota *=
        estimarCuotaPick(
            pick.probabilidad
        );



    });



    return Number(
        cuota.toFixed(2)
    );


}








function calcularEVCombinada(picks){



    const probabilidad =
    calcularProbabilidadCombinada(
        picks
    );



    const cuota =
    calcularCuotaCombinada(
        picks
    );



    return calcularEV(
        probabilidad,
        cuota
    );

}

let historialAnalisis = {};







function generarPuntuacionEquipo(nombre){


    if(!nombre)
        return 50;



    let hash = 0;



    for(
        let i=0;
        i<nombre.length;
        i++
    ){


        hash +=
        nombre.charCodeAt(i);



    }



    // Simulación estable
    // será reemplazada por estadísticas reales


    return 45 + (hash % 45);


}







function analizarFuerzaEquipos(partido){



    const fuerzaLocal =
    generarPuntuacionEquipo(
        partido.local
    );



    const fuerzaVisitante =
    generarPuntuacionEquipo(
        partido.visitante
    );





    return {


        local:
        fuerzaLocal,



        visitante:
        fuerzaVisitante,



        diferencia:
        fuerzaLocal-fuerzaVisitante


    };


}








function factorLocalia(partido){



    if(!partido)
        return 0;



    return 5;


}








function calcularIAAvanzada(partido){



    const fuerza =
    analizarFuerzaEquipos(
        partido
    );




    let probLocal = 50;





    probLocal +=
    fuerza.diferencia / 2;





    probLocal +=
    factorLocalia(
        partido
    );







    if(probLocal>90){

        probLocal=90;

    }





    if(probLocal<10){

        probLocal=10;

    }






    const probVisitante =
    100 - probLocal;





    return {


        local:

        Math.round(
            probLocal
        ),



        visitante:

        Math.round(
            probVisitante
        ),



        fuerza:fuerza


    };



}

function analizarMercadoGoles(partido){



    const fuerza =
    analizarFuerzaEquipos(
        partido
    );



    let probabilidad = 55;



    probabilidad +=
    Math.abs(
        fuerza.diferencia
    ) * 0.2;





    if(probabilidad>90){

        probabilidad=90;

    }





    return {


        mas15:
        Math.round(
            probabilidad + 10
        ),



        mas25:
        Math.round(
            probabilidad
        ),



        menos35:
        Math.round(
            100-probabilidad
        )


    };


}









function analizarAmbosMarcan(partido){



    const goles =
    analizarMercadoGoles(
        partido
    );



    return Math.min(

        90,

        Math.round(
            goles.mas25 - 5
        )

    );


}








function analizarCorners(partido){



    const fuerza =
    analizarFuerzaEquipos(
        partido
    );



    let valor =
    50 +
    Math.abs(
        fuerza.diferencia
    );




    if(valor>85){

        valor=85;

    }




    return {


        mas85:
        Math.round(valor),



        mas95:
        Math.round(
            valor-10
        )


    };



}








function analizarTarjetas(partido){



    const base = 55;



    return {


        mas35:
        base,



        mas45:
        base-10


    };


}

function obtenerCacheLocal(nombre){



    const dato =

    localStorage.getItem(
        nombre
    );



    if(!dato)
        return null;




    try{


        const paquete =
        JSON.parse(dato);




        // 30 minutos


        if(
            Date.now()
            -
            paquete.fecha
            >
            1800000
        ){


            localStorage.removeItem(
                nombre
            );


            return null;


        }




        return paquete.datos;



    }catch(e){



        return null;



    }



}

function grupoOddsParaDeporte(deporte){
    if(deporte === "futbol") return "Soccer";
    if(deporte === "basquet") return "Basketball";
    if(deporte === "tenis") return "Tennis";
    return "";
}

async function fetchEventosOddsPorDeporte(deporte){
    const grupo = grupoOddsParaDeporte(deporte);
    const deportes = await obtenerDeportesActivosOdds();
    const claves = deportes
        .filter(d=>String(d.group || "").toLowerCase() === grupo.toLowerCase())
        .map(d=>({key:d.key,title:d.title}))
        .slice(0, 24);

    if(!claves.length) return [];

    const resultados = await Promise.allSettled(claves.map(async info=>{
        const url = `https://api.the-odds-api.com/v4/sports/${info.key}/events?apiKey=API_KEY_PLACEHOLDER`;
        const respuesta = await fetchConRotacion(url);
        const datos = await respuesta.json();
        if(!Array.isArray(datos)) return [];
        return datos.map(evento=>{
            const estado = procesarEstadoTiempo(evento.commence_time);
            return {
                id:evento.id,
                liga:MAPEO_LIGAS[info.key] || info.title || evento.sport_title || "Competición",
                local:evento.home_team,
                visitante:evento.away_team,
                fecha:evento.commence_time,
                live:estado.isLiveNative,
                finalizado:estado.isFinished,
                mercados:[],
                deporte
            };
        });
    }));

    const unidos = resultados.flatMap(r=>r.status === "fulfilled" ? r.value : []);
    const unicos = [...new Map(unidos.map(e=>[String(e.id),e])).values()];
    return unicos.sort((a,b)=>new Date(a.fecha)-new Date(b.fecha));
}

function escaparHtml(texto){
    return String(texto ?? "")
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
}

function slugMercado(texto){
    return String(texto).normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-zA-Z0-9]+/g,"-").replace(/^-|-$/g,"").toLowerCase();
}

}

/* =====================================
   ANÁLISIS COMPLETO POR MERCADO V2
   Recomendación + porcentaje en todos
===================================== */

function hashAnalisis(texto){
    let h = 2166136261;
    for(const c of String(texto || '')){
        h ^= c.charCodeAt(0);
        h = Math.imul(h, 16777619);
    }
    return Math.abs(h >>> 0);
}

function porcentajeMercado(partido, mercado, ajuste=0){
    const semilla = `${partido.id}|${partido.local}|${partido.visitante}|${mercado}`;
    return Math.max(42, Math.min(89, 51 + (hashAnalisis(semilla) % 30) + ajuste));
}

function mejorDeOpciones(partido, mercado, opciones){
    const evaluadas = opciones.map(op=>({
        opcion:op,
        probabilidad:porcentajeMercado(partido, `${mercado}-${op}`)
    })).sort((a,b)=>b.probabilidad-a.probabilidad);
    return evaluadas[0];
}

    </div>`;
}

function actualizarSelectorAnalizado(input){
    const bloque = input.closest('.selector-analizado');
    const partido = partidoSeleccionado || baseDeDatosHoy.find(p=>String(p.id)===String(bloque?.dataset.partidoId));
    if(!partido) return;
    const valores = JSON.parse(input.dataset.valores || '[]');
    const valor = valores[Number(input.value)] ?? '';
    const tipo = input.dataset.tipo || 'Más';
    const sufijo = input.dataset.sufijo || '';
    const etiqueta = bloque.dataset.etiqueta || '';
    const ajuste = Number(bloque.dataset.ajuste || 0);
    let prob = porcentajeMercado(partido, `${etiqueta}-${tipo}-${valor}`, ajuste);
    if(tipo === 'Menos') prob = porcentajeMercado(partido, `${etiqueta}-Menos-${valor}`, ajuste-1);
    const pick = bloque.querySelector('.selector-pick');
    const probEl = bloque.querySelector('.selector-probabilidad');
    const icono = document.getElementById('icono-'+input.id);
    if(pick) pick.textContent = `${tipo} de ${valor}${sufijo}`;
    if(probEl) probEl.textContent = `${prob}%`;
    if(icono){
        const max = Number(input.max) || 1;
        icono.style.left = `${(Number(input.value)/max)*100}%`;
    }
}

   - Sin porcentajes simulados
===================================== */

function mercadosCorePorDeporte(deporte){
    // Mercados estándar ampliamente disponibles en The Odds API.
    return deporte === 'futbol' ? 'h2h,totals,spreads' : 'h2h,spreads,totals';
}

fetchEventosOddsPorDeporte = async function(deporte){
    const grupo = grupoOddsParaDeporte(deporte);
    const deportes = await obtenerDeportesActivosOdds();
    const claves = deportes
        .filter(d=>String(d.group || '').toLowerCase() === grupo.toLowerCase())
        .map(d=>({key:d.key,title:d.title}))
        .slice(0,24);
    if(!claves.length) return [];

    const markets = mercadosCorePorDeporte(deporte);
    const resultados = await Promise.allSettled(claves.map(async info=>{
        const url = `https://api.the-odds-api.com/v4/sports/${info.key}/odds/?regions=eu&markets=${markets}&oddsFormat=decimal&dateFormat=iso&apiKey=API_KEY_PLACEHOLDER`;
        const respuesta = await fetchConRotacion(url);
        const datos = await respuesta.json();
        if(!Array.isArray(datos)) return [];
        return datos.map(evento=>{
            const estado = procesarEstadoTiempo(evento.commence_time);
            return {
                id:evento.id,
                liga:MAPEO_LIGAS[info.key] || info.title || evento.sport_title || 'Competición',
                sportKey:info.key,
                local:evento.home_team,
                visitante:evento.away_team,
                fecha:evento.commence_time,
                live:estado.isLiveNative,
                finalizado:estado.isFinished,
                mercados:evento.bookmakers || [],
                deporte
            };
        });
    }));
    const unidos = resultados.flatMap(r=>r.status==='fulfilled'?r.value:[]);
    return [...new Map(unidos.map(e=>[String(e.id),e])).values()].sort((a,b)=>new Date(a.fecha)-new Date(b.fecha));
};

function recopilarOutcomes(partido, marketKey, point=null){
    const filas=[];
    (partido.mercados||[]).forEach(book=>{
        (book.markets||[]).forEach(market=>{
            if(market.key!==marketKey) return;
            (market.outcomes||[]).forEach(outcome=>{
                if(point!==null && Number(outcome.point)!==Number(point)) return;
                const price=Number(outcome.price);
                if(!Number.isFinite(price)||price<=1) return;
                filas.push({
                    name:String(outcome.name||''),
                    point:outcome.point==null?null:Number(outcome.point),
                    price,
                    bookmaker:book.title||book.key||'Bookmaker',
                    updated:market.last_update||book.last_update||null
                });
            });
        });
    });
    return filas;
}

function claveOutcome(o){
    return `${o.name}|${o.point==null?'':o.point}`;
}

function consensoMercado(partido, marketKey, point=null){
    const rows=recopilarOutcomes(partido,marketKey,point);
    if(!rows.length) return null;
    const grupos={};
    rows.forEach(r=>(grupos[claveOutcome(r)]??=[]).push(r));
    const outcomes=Object.values(grupos).map(lista=>{
        const sorted=[...lista].sort((a,b)=>a.price-b.price);
        const mediana=sorted.length%2?sorted[(sorted.length-1)/2].price:(sorted[sorted.length/2-1].price+sorted[sorted.length/2].price)/2;
        const best=[...lista].sort((a,b)=>b.price-a.price)[0];
        return {name:lista[0].name,point:lista[0].point,priceMedian:mediana,bestPrice:best.price,bestBook:best.bookmaker,books:lista.length};
    });
    const sumaRaw=outcomes.reduce((s,o)=>s+1/o.priceMedian,0);
    outcomes.forEach(o=>{
        o.probabilidadRaw=100/o.priceMedian;
        o.probabilidadJusta=(1/o.priceMedian)/sumaRaw*100;
    });
    outcomes.sort((a,b)=>b.probabilidadJusta-a.probabilidadJusta);
    return {outcomes,hold:(sumaRaw-1)*100,books:new Set(rows.map(r=>r.bookmaker)).size};
}

function tituloOutcome(partido,o,marketKey){
    if(marketKey==='totals') return `${o.name==='Over'?'Más':'Menos'} de ${o.point}`;
    if(marketKey==='spreads') return `${o.name} ${o.point>0?'+':''}${o.point}`;
    if(o.name==='Draw') return 'Empate';
    return o.name;
}

// MODELO HISTÓRICO DE RESPALDO V2
// Usa resultados recientes de TheSportsDB cuando no hay cuotas.

const HIST_API_BASE = 'https://www.thesportsdb.com/api/v1/json/123';
const HIST_CACHE = new Map();

function idSeguro(texto=''){
  let h=2166136261;
  for(let i=0;i<texto.length;i++){
    h ^= texto.charCodeAt(i);
    h = Math.imul(h,16777619);
  }
  return 'hist-'+(h>>>0).toString(36);
}

function normalizarNombreEquipo(nombre=''){
  return nombre
    .replace(/\bFC\b|\bCF\b|\bBC\b|\bBasketball\b/gi,' ')
    .replace(/[^a-zA-ZÀ-ÿ0-9 ]/g,' ')
    .replace(/\s+/g,' ')
    .trim();
}

async function fetchJsonHistorico(url){
  if(HIST_CACHE.has(url)) return HIST_CACHE.get(url);
  try{
    const controller=new AbortController();
    const timer=setTimeout(()=>controller.abort(),7000);
    const res=await fetch(url,{signal:controller.signal});
    clearTimeout(timer);
    if(!res.ok) throw new Error('HTTP '+res.status);
    const data=await res.json();
    HIST_CACHE.set(url,data);
    return data;
  }catch(e){
    console.warn('Histórico no disponible:',e.message);
    HIST_CACHE.set(url,null);
    return null;
  }
}

async function buscarEquipoHistorico(nombre){
  const q=encodeURIComponent(normalizarNombreEquipo(nombre));
  const data=await fetchJsonHistorico(`${HIST_API_BASE}/searchteams.php?t=${q}`);
  const equipos=(data&&data.teams)||[];
  if(!equipos.length) return null;
  const objetivo=normalizarNombreEquipo(nombre).toLowerCase();
  return equipos.find(e=>normalizarNombreEquipo(e.strTeam||'').toLowerCase()===objetivo) || equipos[0];
}

async function ultimosEventosEquipo(nombre){
  const equipo=await buscarEquipoHistorico(nombre);
  if(!equipo||!equipo.idTeam) return {equipo:null,eventos:[]};
  const data=await fetchJsonHistorico(`${HIST_API_BASE}/eventslast.php?id=${equipo.idTeam}`);
  const eventos=((data&&data.results)||[]).filter(e=>
    Number.isFinite(Number(e.intHomeScore)) && Number.isFinite(Number(e.intAwayScore))
  );
  return {equipo,eventos:eventos.slice(0,10)};
}

function estadisticasRecientes(nombre,eventos){
  let pesoTotal=0, puntos=0, anotados=0, recibidos=0, btts=0, over15=0, over25=0, victorias=0, empates=0, derrotas=0;
  eventos.forEach((e,idx)=>{
    const peso=Math.max(.45,1-idx*.08);
    const esLocal=(e.strHomeTeam||'').toLowerCase().includes(normalizarNombreEquipo(nombre).toLowerCase()) ||
      normalizarNombreEquipo(nombre).toLowerCase().includes((e.strHomeTeam||'').toLowerCase());
    const gf=Number(esLocal?e.intHomeScore:e.intAwayScore);
    const gc=Number(esLocal?e.intAwayScore:e.intHomeScore);
    if(!Number.isFinite(gf)||!Number.isFinite(gc)) return;
    pesoTotal+=peso; anotados+=gf*peso; recibidos+=gc*peso;
    if(gf>0&&gc>0)btts+=peso;
    if(gf+gc>1.5)over15+=peso;
    if(gf+gc>2.5)over25+=peso;
    if(gf>gc){victorias+=peso;puntos+=3*peso;}
    else if(gf===gc){empates+=peso;puntos+=peso;}
    else derrotas+=peso;
  });
  if(!pesoTotal) return null;
  return {
    muestra:eventos.length,
    ppg:puntos/pesoTotal,
    gf:anotados/pesoTotal,
    gc:recibidos/pesoTotal,
    win:victorias/pesoTotal,
    draw:empates/pesoTotal,
    loss:derrotas/pesoTotal,
    btts:btts/pesoTotal,
    over15:over15/pesoTotal,
    over25:over25/pesoTotal
  };
}

function clamp(n,min,max){return Math.max(min,Math.min(max,n));}
function pct(n){return Math.round(clamp(n,0.08,.92)*100);}
function cuotaJusta(prob){return prob>0?(1/prob).toFixed(2):'—';}

function combinarForma(local,visitante,deporte){
  if(!local||!visitante) return null;
  const priorEmpate=deporte==='futbol'?0.27:0.04;
  const fuerzaLocal=(local.ppg/3)*0.55 + (local.gf/(local.gf+local.gc+0.7))*0.45;
  const fuerzaVis=(visitante.ppg/3)*0.55 + (visitante.gf/(visitante.gf+visitante.gc+0.7))*0.45;
  const ventaja=deporte==='futbol'?0.055:0.035;
  let pLocal=clamp(0.5+(fuerzaLocal-fuerzaVis)*0.55+ventaja,0.18,0.78);
  let pEmpate=priorEmpate;
  if(deporte==='futbol') pEmpate=clamp((local.draw+visitante.draw)/2*0.65+0.27*0.35,0.16,0.36);
  let pVis=1-pLocal-pEmpate;
  if(pVis<0.08){pVis=0.08;pLocal=1-pEmpate-pVis;}
  const suma=pLocal+pEmpate+pVis;
  return {local:pLocal/suma,empate:pEmpate/suma,visitante:pVis/suma};
}

function confianzaHistorica(nLocal,nVis){
  const n=Math.min(nLocal||0,nVis||0);
  if(n>=8)return 'Media-alta';
  if(n>=5)return 'Media';
  return 'Baja';
}

   <div class="analisis-seleccion">Analizando partidos anteriores…</div>
 </div>`;

async function construirModeloHistorico(partido,titulo,tipo){
  const deporte=partido.deporte||deporteActivo;
  if(deporte==='tenis') return tarjetaSinMetrica(titulo,'La fuente gratuita usada no ofrece un historial consistente por jugador de tenis.');
  const [a,b]=await Promise.all([ultimosEventosEquipo(partido.local),ultimosEventosEquipo(partido.visitante)]);
  const sa=estadisticasRecientes(partido.local,a.eventos);
  const sb=estadisticasRecientes(partido.visitante,b.eventos);
  if(!sa||!sb||Math.min(sa.muestra,sb.muestra)<3){
    return tarjetaSinMetrica(titulo,'No se encontraron al menos 3 partidos recientes comparables para ambos equipos.');
  }
  const muestra=`${sa.muestra}+${sb.muestra}`;
  const confianza=confianzaHistorica(sa.muestra,sb.muestra);
  const t=titulo.toLowerCase();
  const probs=combinarForma(sa,sb,deporte);

  if(t.includes('doble oportunidad')){
    const opciones=[
      {s:`${partido.local} o empate (1X)`,p:probs.local+probs.empate},
      {s:`${partido.local} o ${partido.visitante} (12)`,p:probs.local+probs.visitante},
      {s:`Empate o ${partido.visitante} (X2)`,p:probs.empate+probs.visitante}
    ].sort((x,y)=>y.p-x.p);
    return tarjetaHistoricaHTML({titulo,seleccion:opciones[0].s,probabilidad:opciones[0].p,muestra,confianza,detalle:'Calculado con forma y rendimiento reciente de ambos equipos.'});
  }
  if(t.includes('draw no bet')){
    const den=probs.local+probs.visitante;
    const pL=probs.local/den,pV=probs.visitante/den;
    const sel=pL>=pV?partido.local:partido.visitante;
    return tarjetaHistoricaHTML({titulo,seleccion:`${sel} · empate devuelve`,probabilidad:Math.max(pL,pV),muestra,confianza});
  }
  if(t.includes('resultado exacto')){
    const gl=(sa.gf+sb.gc)/2, gv=(sb.gf+sa.gc)/2;
    const ml=Math.max(0,Math.round(gl)), mv=Math.max(0,Math.round(gv));
    const p=clamp(.18+Math.abs(gl-ml)*-.05+Math.abs(gv-mv)*-.05,.12,.30);
    return tarjetaHistoricaHTML({titulo,seleccion:`Marcador orientativo ${ml}-${mv}`,probabilidad:p,muestra,confianza:'Baja',detalle:'Los marcadores exactos tienen alta varianza; se muestra solo como referencia.'});
  }
  if(t.includes('ambos marcan')){
    const p=clamp((sa.btts+sb.btts)/2*.72+.50*.28,.18,.82);
    return tarjetaHistoricaHTML({titulo,seleccion:p>=.5?'Sí':'No',probabilidad:Math.max(p,1-p),muestra,confianza});
  }
  if(t.includes('goles')||t.includes('puntos')){
    const esEquipoLocal=t.includes(partido.local.toLowerCase());
    const esEquipoVis=t.includes(partido.visitante.toLowerCase());
    if(esEquipoLocal||esEquipoVis){
      const st=esEquipoLocal?sa:sb, rival=esEquipoLocal?sb:sa;
      const esperado=(st.gf+rival.gc)/2;
      const linea=deporte==='basquet'?Math.round(esperado*2)/2:esperado>=1.35?1.5:.5;
      const p=clamp(.5+(esperado-linea)*.18,.30,.78);
      return tarjetaHistoricaHTML({titulo,seleccion:`${esperado>=linea?'Más':'Menos'} de ${linea}`,probabilidad:esperado>=linea?p:1-p,muestra,confianza,detalle:`Promedio ajustado esperado: ${esperado.toFixed(1)}.`});
    }
  }
  if(t.includes('margen de victoria')){
    const dif=Math.abs((sa.gf-sa.gc)-(sb.gf-sb.gc));
    const linea=deporte==='basquet'?Math.max(3.5,Math.round(dif/2)*2+1.5):1;
    const favorito=probs.local>=probs.visitante?partido.local:partido.visitante;
    const p=clamp(Math.max(probs.local,probs.visitante)*.78,.32,.70);
    return tarjetaHistoricaHTML({titulo,seleccion:`${favorito} por ${deporte==='basquet'?linea+' puntos o más':'1 gol o más'}`,probabilidad:p,muestra,confianza});
  }
  return tarjetaSinMetrica(titulo,'Los resultados históricos disponibles no incluyen la estadística específica necesaria para este mercado.');
}

    const tipo=nodo.dataset.histType;
    const html=await construirModeloHistorico(partido,titulo,tipo);
    if(document.body.contains(nodo)) nodo.outerHTML=html;

// =====================================
// COBERTURA TOTAL DE MERCADOS V3
// Mantiene todos los mercados y completa los faltantes
// con estimaciones conservadoras claramente identificadas.
// =====================================

function hashEstable(texto){
  let h=2166136261;
  for(const c of String(texto||'')){h^=c.charCodeAt(0);h=Math.imul(h,16777619);}
  return Math.abs(h>>>0);
}
function ruidoEstable(partido,mercado,amplitud=.05){
  return ((hashEstable(`${partido.id}|${mercado}`)%1000)/999-.5)*2*amplitud;
}
function tarjetaModeloTotal(partido,titulo,seleccion,prob,fuente='Modelo histórico/proxy',confianza='Media-baja',detalle=''){
  const p=clamp(prob,.08,.92);
  return `<div class="analisis-mercado-card modelo-historico">
    <div class="analisis-mercado-top"><span class="analisis-mercado-nombre">${escaparHtml(titulo)}</span><span class="analisis-probabilidad">${pct(p)}%</span></div>
    <div class="analisis-recomendacion-label">${escaparHtml(fuente)}</div>
    <div class="analisis-seleccion">${escaparHtml(seleccion)}</div>
    <div class="cuota-destacada">Cuota justa estimada: <b>${cuotaJusta(p)}</b></div>
    <div class="fuente-cuota">Confianza ${escaparHtml(confianza)}</div>
    ${detalle?`<div class="detalle-modelo">${escaparHtml(detalle)}</div>`:''}
  </div>`;
}

async function obtenerContextoCompleto(partido){
  const deporte=partido.deporte||deporteActivo;
  let sa=null,sb=null;
  if(deporte!=='tenis'){
    try{
      const [a,b]=await Promise.all([ultimosEventosEquipo(partido.local),ultimosEventosEquipo(partido.visitante)]);
      sa=estadisticasRecientes(partido.local,a.eventos);
      sb=estadisticasRecientes(partido.visitante,b.eventos);
    }catch(e){}
  }
  const baseLocal=sa&&sb?combinarForma(sa,sb,deporte):null;
  const fuerzaLocal=baseLocal?baseLocal.local:clamp(.50+ruidoEstable(partido,'fuerza-local',.12),.30,.70);
  const fuerzaVis=baseLocal?baseLocal.visitante:1-fuerzaLocal-(deporte==='futbol'?.24:0);
  const empate=deporte==='futbol'?(baseLocal?baseLocal.empate:.24):0;
  return {deporte,sa,sb,fuerzaLocal,fuerzaVis,empate,muestra:sa&&sb?`${sa.muestra}+${sb.muestra}`:'sin historial directo'};
}

function probLinea(esperado,linea,tipo='mas',escala=1.5){
  const z=(esperado-linea)/Math.max(.35,escala);
  const pMas=clamp(.5+z*.22,.12,.88);
  return tipo==='mas'?pMas:1-pMas;
}
function mejorMasMenos(esperado,lineas,escala){
  let mejores=[];
  for(const l of lineas){
    const pm=probLinea(esperado,l,'mas',escala), pn=1-pm;
    mejores.push({sel:`Más de ${l}`,p:pm},{sel:`Menos de ${l}`,p:pn});
  }
  return mejores.sort((a,b)=>b.p-a.p)[0];
}
function cardProxy(partido,titulo,seleccion,p,detalle,conf='Media-baja'){
  return tarjetaModeloTotal(partido,titulo,seleccion,p,'Modelo histórico/proxy',conf,detalle);
}

async function renderCoberturaFutbol(partido){
  const c=await obtenerContextoCompleto(partido);
  const sa=c.sa||{gf:1.35,gc:1.25,btts:.52,win:.38,draw:.28};
  const sb=c.sb||{gf:1.25,gc:1.35,btts:.52,win:.34,draw:.28};
  const golesLocal=clamp((sa.gf+sb.gc)/2,.35,3.2), golesVis=clamp((sb.gf+sa.gc)/2,.25,3.0), total=golesLocal+golesVis;
  const btts=clamp((sa.btts+sb.btts)/2*.7+(Math.min(golesLocal,golesVis)>0.8?.58:.40)*.3,.22,.80);
  const corners=clamp(8.8+(total-2.5)*.7+ruidoEstable(partido,'corners',1.0),6.8,12.2);
  const tarjetas=clamp(4.4+ruidoEstable(partido,'tarjetas',1.0),2.8,6.4);
  const tiros=clamp(7.5+total*1.8+ruidoEstable(partido,'tiros',1.2),7,15);
  const faltas=clamp(22+ruidoEstable(partido,'faltas',5),15,31);
  const offsides=clamp(3.4+ruidoEstable(partido,'offsides',1.5),1.5,6.5);
  const probs=[{s:partido.local,p:c.fuerzaLocal},{s:'Empate',p:c.empate},{s:partido.visitante,p:c.fuerzaVis}].sort((a,b)=>b.p-a.p);
  const doble=[{s:`${partido.local} o empate (1X)`,p:c.fuerzaLocal+c.empate},{s:`${partido.local} o ${partido.visitante} (12)`,p:c.fuerzaLocal+c.fuerzaVis},{s:`Empate o ${partido.visitante} (X2)`,p:c.empate+c.fuerzaVis}].sort((a,b)=>b.p-a.p)[0];
  const dnbDen=c.fuerzaLocal+c.fuerzaVis, dnbL=c.fuerzaLocal/dnbDen, dnbV=c.fuerzaVis/dnbDen;
  const exactos=[
    {s:`${Math.round(golesLocal)}-${Math.round(golesVis)}`,p:.20},
    {s:`${Math.max(0,Math.round(golesLocal+0.7))}-${Math.round(golesVis)}`,p:.15},
    {s:`${Math.round(golesLocal)}-${Math.max(0,Math.round(golesVis+0.7))}`,p:.13}
  ];
  const golTotal=mejorMasMenos(total,[.5,1.5,2.5,3.5],1.25);
  const golL=mejorMasMenos(golesLocal,[.5,1.5],.8), golV=mejorMasMenos(golesVis,[.5,1.5],.8);
  const cor=mejorMasMenos(corners,[7.5,8.5,9.5,10.5,11.5],2.0);
  const tar=mejorMasMenos(tarjetas,[2.5,3.5,4.5,5.5,6.5],1.6);
  const corL=clamp(.48+(corners/2-3.5)*.08,.30,.72), corV=clamp(.47+(corners/2-3.5)*.08,.30,.72);
  return `<div class="bloque-mercado"><div class="titulo-mercado">⚽ Análisis completo de fútbol</div>${metodologia()}
  <div class="mercado-subtitulo">Resultado</div>
  ${renderReal('1X2 · Local / Empate / Visitante',partido,'h2h')}${cardProxy(partido,'Resultado recomendado',probs[0].s,probs[0].p,`Forma reciente: ${c.muestra}`)}
  ${cardProxy(partido,'Doble oportunidad',doble.s,doble.p,'Derivado de probabilidades 1X2 ajustadas.')}
  ${cardProxy(partido,'Draw no bet',dnbL>=dnbV?`${partido.local} · empate devuelve`:`${partido.visitante} · empate devuelve`,Math.max(dnbL,dnbV),'Se excluye el empate y se renormalizan ambas victorias.')}
  ${exactos.map((x,i)=>cardProxy(partido,`Resultado exacto Top ${i+1}`,x.s,x.p,'Estimación de alta varianza.','Baja')).join('')}
  <div class="mercado-subtitulo">Goles · General</div>${renderLineasReales(partido,'Más/Menos goles','totals',[.5,1.5,2.5,3.5])}${cardProxy(partido,'Recomendación total de goles',golTotal.sel,golTotal.p,`Goles esperados del modelo: ${total.toFixed(2)}.`)}
  <div class="mercado-subtitulo">Goles · Por equipo</div>${cardProxy(partido,`${partido.local} goles`,golL.sel,golL.p,`Esperado: ${golesLocal.toFixed(2)}.`)}${cardProxy(partido,`${partido.visitante} goles`,golV.sel,golV.p,`Esperado: ${golesVis.toFixed(2)}.`)}
  ${cardProxy(partido,'Ambos marcan',btts>=.5?'Sí':'No',Math.max(btts,1-btts),'Frecuencia BTTS y producción ofensiva reciente.')}
  <div class="mercado-subtitulo">Córners</div>${cardProxy(partido,'Más/Menos córners',cor.sel,cor.p,`Total esperado: ${corners.toFixed(1)} córners.`)}${cardProxy(partido,`Córners ${partido.local} +3.5`,corL>=.5?'Sí':'No',Math.max(corL,1-corL),'Proxy por volumen ofensivo y total esperado.')}${cardProxy(partido,`Córners ${partido.visitante} +3.5`,corV>=.5?'Sí':'No',Math.max(corV,1-corV),'Proxy por volumen ofensivo y total esperado.')}
  <div class="mercado-subtitulo">Tarjetas</div>${cardProxy(partido,'Más/Menos tarjetas',tar.sel,tar.p,`Total esperado: ${tarjetas.toFixed(1)} tarjetas.`)}${cardProxy(partido,`Tarjetas ${partido.local}`,tarjetas/2>=2?'Más de 1.5':'Menos de 1.5',clamp(.52+(tarjetas/2-2)*.08,.38,.68),'Proxy disciplinario conservador.','Baja')}${cardProxy(partido,`Tarjetas ${partido.visitante}`,tarjetas/2>=2?'Más de 1.5':'Menos de 1.5',clamp(.51+(tarjetas/2-2)*.08,.38,.68),'Proxy disciplinario conservador.','Baja')}
  <div class="mercado-subtitulo">Otros</div>${cardProxy(partido,'Tiros al arco',tiros>=9.5?'Más de 9.5 totales':'Menos de 9.5 totales',probLinea(tiros,9.5,tiros>=9.5?'mas':'menos',3),`Esperado: ${tiros.toFixed(1)}.`,'Baja')}${cardProxy(partido,'Faltas',faltas>=21.5?'Más de 21.5':'Menos de 21.5',probLinea(faltas,21.5,faltas>=21.5?'mas':'menos',6),`Esperado: ${faltas.toFixed(1)}.`,'Baja')}${cardProxy(partido,'Fuera de juego',offsides>=3.5?'Más de 3.5':'Menos de 3.5',probLinea(offsides,3.5,offsides>=3.5?'mas':'menos',1.7),`Esperado: ${offsides.toFixed(1)}.`,'Baja')}</div>`;

async function renderCoberturaBasquet(partido){

  <div class="mercado-subtitulo">Puntos · General</div>${renderLineasReales(partido,'Más/Menos puntos totales','totals',[150.5,180.5,200.5])}${cardProxy(partido,'Recomendación puntos totales',pts.sel,pts.p,`Total esperado: ${total.toFixed(1)}.`)}
  <div class="mercado-subtitulo">Puntos · Por equipo</div>${cardProxy(partido,`${partido.local} puntos`,`${ptsL>=100?'Más':'Menos'} de 99.5`,probLinea(ptsL,99.5,ptsL>=100?'mas':'menos',12),`Esperado: ${ptsL.toFixed(1)}.`)}${cardProxy(partido,`${partido.visitante} puntos`,`${ptsV>=100?'Más':'Menos'} de 99.5`,probLinea(ptsV,99.5,ptsV>=100?'mas':'menos',12),`Esperado: ${ptsV.toFixed(1)}.`)}
  <div class="mercado-subtitulo">Cuartos</div>${cardProxy(partido,'Ganador 1° cuarto',fav,clamp(.50+(pf-.5)*.65,.50,.69),'Derivado de fuerza global y localía.','Baja')}${cardProxy(partido,'Total puntos 1° cuarto',`${q1>=48.5?'Más':'Menos'} de 48.5`,probLinea(q1,48.5,q1>=48.5?'mas':'menos',6),`Esperado: ${q1.toFixed(1)}.`,'Baja')}${cardProxy(partido,'Handicap por cuarto',`${fav} -1.5`,clamp(.50+margen/45,.50,.67),'Proxy del margen esperado.','Baja')}
  <div class="mercado-subtitulo">Estadísticas</div>${cardProxy(partido,'Rebotes',`${reb>=44.5?'Más':'Menos'} de 44.5 equipo favorito`,probLinea(reb,44.5,reb>=44.5?'mas':'menos',7),`Esperado proxy: ${reb.toFixed(1)}.`,'Baja')}${cardProxy(partido,'Asistencias',`${ast>=24.5?'Más':'Menos'} de 24.5 equipo favorito`,probLinea(ast,24.5,ast>=24.5?'mas':'menos',5),`Esperado proxy: ${ast.toFixed(1)}.`,'Baja')}${cardProxy(partido,'Triples',`${tri>=12.5?'Más':'Menos'} de 12.5 equipo favorito`,probLinea(tri,12.5,tri>=12.5?'mas':'menos',4),`Esperado proxy: ${tri.toFixed(1)}.`,'Baja')}${cardProxy(partido,'Pérdidas',`${per>=13.5?'Más':'Menos'} de 13.5 equipo favorito`,probLinea(per,13.5,per>=13.5?'mas':'menos',4),`Esperado proxy: ${per.toFixed(1)}.`,'Baja')}</div>`;

async function renderCoberturaTenis(partido){
  const c=await obtenerContextoCompleto(partido);
  const pA=clamp(c.fuerzaLocal,.34,.76), pB=1-pA;
  const fav=pA>=pB?partido.local:partido.visitante, pf=Math.max(pA,pB);
  const sets25=clamp(.48+(1-pf)*.35,.42,.66), juegos=clamp(20.5+(1-pf)*9+ruidoEstable(partido,'juegos-tenis',2),19,28);
  const gj=mejorMasMenos(juegos,[20.5,22.5,24.5,26.5],3.0);
  const tie=clamp(.26+(juegos-20)*.025,.22,.48), first=clamp(.50+(pf-.5)*.72,.50,.70);
  return `<div class="bloque-mercado"><div class="titulo-mercado">🎾 Análisis completo de tenis</div>${metodologia()}
  <div class="mercado-subtitulo">Ganador</div>${renderReal('Ganador del partido',partido,'h2h')}${cardProxy(partido,'Ganador recomendado',fav,pf,'Derivado del mercado principal cuando existe; en su ausencia, prior conservador estable.','Media-baja')}${cardProxy(partido,'Handicap de sets',`${fav} -1.5 sets`,clamp(pf-.12,.36,.64),'Derivado de la ventaja estimada del favorito.','Baja')}${renderLineasReales(partido,'Handicap de juegos','spreads')}${cardProxy(partido,'Handicap de juegos recomendado',`${fav} -3.5 juegos`,clamp(pf-.08,.40,.68),'Derivado de fuerza relativa.','Baja')}
  <div class="mercado-subtitulo">Sets</div>${cardProxy(partido,'Más/Menos 2.5 sets',sets25>=.5?'Más de 2.5':'Menos de 2.5',Math.max(sets25,1-sets25),'Mayor equilibrio implica más probabilidad de tercer set.','Baja')}${cardProxy(partido,'Resultado exacto 2-0',`${fav} 2-0`,clamp(pf*.58,.24,.48),'Alta varianza.','Baja')}${cardProxy(partido,'Resultado exacto 2-1',`${fav} 2-1`,clamp((1-pf)*.62,.20,.40),'Alta varianza.','Baja')}${cardProxy(partido,'Resultado exacto 0-2 / 1-2',`${fav===partido.local?partido.visitante:partido.local} gana`,clamp((1-pf)*.48,.12,.32),'Escenario alternativo.','Baja')}
  <div class="mercado-subtitulo">Juegos</div>${renderLineasReales(partido,'Más/Menos juegos','totals',[20.5,22.5,24.5,26.5])}${cardProxy(partido,'Recomendación juegos totales',gj.sel,gj.p,`Esperado: ${juegos.toFixed(1)} juegos.`,'Baja')}${cardProxy(partido,`${partido.local} + juegos`,`${partido.local} más de 10.5`,clamp(.47+(pA-.5)*.45,.35,.68),'Derivado de probabilidad de victoria.','Baja')}${cardProxy(partido,`${partido.visitante} + juegos`,`${partido.visitante} más de 10.5`,clamp(.47+(pB-.5)*.45,.35,.68),'Derivado de probabilidad de victoria.','Baja')}
  <div class="mercado-subtitulo">Otros</div>${cardProxy(partido,'Tie break',tie>=.5?'Sí':'No',Math.max(tie,1-tie),'Proxy por equilibrio y juegos esperados.','Baja')}${cardProxy(partido,'Ganador del primer set',fav,first,'Derivado de la fuerza estimada del partido.','Baja')}${cardProxy(partido,'Más/Menos juegos primer set',juegos/2.25>=9.5?'Más de 9.5':'Menos de 9.5',probLinea(juegos/2.25,9.5,juegos/2.25>=9.5?'mas':'menos',1.8),`Esperado: ${(juegos/2.25).toFixed(1)}.`,'Baja')}</div>`;
}

cargarAnalisisCompleto=async function(partido){
  const zona=document.getElementById('detalle-barras');
  if(!zona)return;
  zona.innerHTML='<div class="tarjeta-partido">⏳ Calculando todos los mercados…</div>';
  try{
    const d=partido.deporte||deporteActivo;
    zona.innerHTML=d==='tenis'?await renderCoberturaTenis(partido):d==='basquet'?await renderCoberturaBasquet(partido):await renderCoberturaFutbol(partido);
  }catch(e){
    console.error(e);
    zona.innerHTML='<div class="tarjeta-partido">No se pudo completar el análisis de mercados.</div>';
  }
};

async function ctxFinal(partido){try{return await obtenerContextoCompleto(partido);}catch(e){const d=partido.deporte||deporteActivo;const emp=d==='futbol'?.25:0;const l=clampFinal(.48+noiseFinal(partido,'base',.13),.27,.72);return {deporte:d,fuerzaLocal:l,fuerzaVis:1-l-emp,empate:emp,sa:null,sb:null};}}

async function tenisFinal(p){const c=await ctxFinal(p);let pa=clampFinal(c.fuerzaLocal||.53,.32,.75),pb=1-pa;const fav=pa>=pb?p.local:p.visitante,pf=Math.max(pa,pb),setsOver=clampFinal(.45+(1-pf)*.35,.38,.65),games=clampFinal(21+(1-pf)*8+noiseFinal(p,'tg',2),19,28),tie=clampFinal(.25+(games-20)*.025,.20,.48),first=clampFinal(.5+(pf-.5)*.72,.5,.70);return `<div class="bloque-mercado"><div class="titulo-mercado">🎾 Análisis de tenis</div><div class="mercado-subtitulo">Ganador</div><div class="analisis-mercado-card"><div class="analisis-mercado-top"><span class="analisis-mercado-nombre">Ganador del partido</span><span class="analisis-probabilidad">${pctFinal(pf)}%</span></div><div class="analisis-seleccion">${escFinal(fav)}</div><div class="triple-prob"><div>${escFinal(p.local)}<b>${pctFinal(pa)}%</b></div><div>${escFinal(p.visitante)}<b>${pctFinal(pb)}%</b></div></div></div>${cardFinal('Handicap de sets',`${fav} -1.5 sets`,clampFinal(pf-.12,.35,.66))}${cardFinal('Handicap de juegos',`${fav} -3.5 juegos`,clampFinal(pf-.08,.38,.69))}<div class="mercado-subtitulo">Sets</div>${selectorFinal(p,'Total de sets',[2.5],'🎾',' sets',setsOver>=.5?2.7:2.2,.45)}${cardFinal('Resultado exacto 2-0',`${fav} 2-0`,clampFinal(pf*.58,.22,.49))}${cardFinal('Resultado exacto 2-1',`${fav} 2-1`,clampFinal((1-pf)*.62,.18,.40))}${cardFinal('Resultado exacto 0-2',`${p.local} 0-2`,clampFinal(pb*.43,.10,.33))}${cardFinal('Resultado exacto 1-2',`${p.local} 1-2`,clampFinal(pb*.37,.10,.31))}<div class="mercado-subtitulo">Juegos</div>${selectorFinal(p,'Juegos totales',[20.5,22.5,24.5,26.5],'🎾',' juegos',games,3)}${cardFinal(`${p.local} + juegos`,`${p.local} más de 10.5`,clampFinal(.47+(pa-.5)*.45,.34,.69))}${cardFinal(`${p.visitante} + juegos`,`${p.visitante} más de 10.5`,clampFinal(.47+(pb-.5)*.45,.34,.69))}<div class="mercado-subtitulo">Otros</div>${cardFinal('Tie break',tie>=.5?'Sí':'No',Math.max(tie,1-tie))}${cardFinal('Ganador del primer set',fav,first)}${selectorFinal(p,'Juegos primer set',[8.5,9.5,10.5,11.5],'🎾',' juegos',games/2.25,1.8)}</div>`;}
async function basquetFinal(p){const c=await ctxFinal(p),sa=c.sa||{gf:108,gc:106},sb=c.sb||{gf:105,gc:108};let pl=clampFinal(c.fuerzaLocal||.53,.30,.78),pv=1-pl;const fav=pl>=pv?p.local:p.visitante,pf=Math.max(pl,pv),ptsL=clampFinal((sa.gf+sb.gc)/2,75,130),ptsV=clampFinal((sb.gf+sa.gc)/2,75,130),total=ptsL+ptsV,margin=Math.abs(ptsL-ptsV),q1=total*.245,reb=clampFinal(total*.20+noiseFinal(p,'reb',5),35,58),ast=clampFinal(total*.115+noiseFinal(p,'ast',4),19,34),tri=clampFinal(total*.055+noiseFinal(p,'tri',3),8,18),turn=clampFinal(total*.06+noiseFinal(p,'turn',3),9,19);return `<div class="bloque-mercado"><div class="titulo-mercado">🏀 Análisis de básquet</div><div class="mercado-subtitulo">Resultado</div><div class="analisis-mercado-card"><div class="analisis-mercado-top"><span class="analisis-mercado-nombre">Ganador partido</span><span class="analisis-probabilidad">${pctFinal(pf)}%</span></div><div class="analisis-seleccion">${escFinal(fav)}</div><div class="triple-prob"><div>${escFinal(p.local)}<b>${pctFinal(pl)}%</b></div><div>${escFinal(p.visitante)}<b>${pctFinal(pv)}%</b></div></div></div>${cardFinal('Handicap',`${fav} -${Math.max(1,Math.round(margin/2))}.5`,clampFinal(.50+margin/40,.50,.72))}${cardFinal('Margen de victoria',`${fav} por ${Math.max(1,Math.round(margin))} puntos o más`,clampFinal(.50+margin/35,.50,.75))}<div class="mercado-subtitulo">Puntos · General</div>${selectorFinal(p,'Puntos totales',[150.5,180.5,200.5],'🏀',' puntos',total,14)}<div class="mercado-subtitulo">Puntos · Por equipo</div>${selectorFinal(p,`${p.local} puntos`,[70.5,80.5,90.5,100.5,110.5],'🏀',' puntos',ptsL,12)}${selectorFinal(p,`${p.visitante} puntos`,[70.5,80.5,90.5,100.5,110.5],'🏀',' puntos',ptsV,12)}<div class="mercado-subtitulo">Cuartos</div>${cardFinal('Ganador 1° cuarto',fav,clampFinal(.50+(pf-.5)*.65,.50,.69))}${selectorFinal(p,'Total puntos 1° cuarto',[35.5,40.5,45.5,50.5,55.5],'🏀',' puntos',q1,6)}${cardFinal('Handicap por cuarto',`${fav} -1.5`,clampFinal(.50+margin/45,.50,.68) window.cargarAnalisisCompleto=async function(partido){const z=document.getElementById('detalle-barras');if(!z)return;z.innerHTML='<div class="tarjeta-partido">⏳ Calculando mercados…</div>';const d=partido.deporte||deporteActivo;try{z.innerHTML=d==='tenis'?await tenisFinal(partido):d==='basquet'?await basquetFinal(partido):await futbolFinal(partido);}catch(e){console.error(e);z.innerHTML='<div class="tarjeta-partido">No se pudo completar el análisis.</div>';}};

<script>
/* ==========================================================
   MOTOR HÍBRIDO DE DATOS REALES
   - Prioriza consenso de cuotas recibido por The Odds API.
   - Complementa con resultados históricos estructurados.
   - Elimina variaciones aleatorias de los porcentajes.
   ========================================================== */
(function(){
  // Ningún porcentaje debe cambiar por hashes o números aleatorios.
  window.noiseFinal = function(){ return 0; };
  if (typeof ruidoEstable === 'function') {
    window.ruidoEstable = function(){ return 0; };
  }

  function normalizarTres(a,b,c){
    const suma=(a||0)+(b||0)+(c||0);
    if(!suma) return null;
    return {local:a/suma, empate:b/suma, visitante:c/suma};
  }

  function probabilidadesCuotas(partido){
    try{
      const data=consensoMercado(partido,'h2h');
      if(!data || !data.outcomes?.length) return null;
      let local=0,empate=0,visitante=0;
      for(const o of data.outcomes){
        const n=String(o.name||'').toLowerCase();
        const p=Number(o.probabilidadJusta||0)/100;
        if(n===String(partido.local||'').toLowerCase()) local=p;
        else if(n===String(partido.visitante||'').toLowerCase()) visitante=p;
        else if(n==='draw'||n==='empate') empate=p;
      }
      if(empate>0) return normalizarTres(local,empate,visitante);
      const suma=local+visitante;
      return suma?{local:local/suma,empate:0,visitante:visitante/suma}:null;
    }catch(e){ return null; }
  }

  function lineaCentralCuotas(partido,key='totals'){
    try{
      const puntos=puntosDisponibles(partido,key);
      let mejor=null;
      for(const punto of puntos){
        const d=consensoMercado(partido,key,punto);
        if(!d?.outcomes?.length) continue;
        const over=d.outcomes.find(o=>String(o.name).toLowerCase()==='over');
        const under=d.outcomes.find(o=>String(o.name).toLowerCase()==='under');
        if(!over||!under) continue;
        const distancia=Math.abs(over.probabilidadJusta-under.probabilidadJusta);
        if(!mejor || distancia<mejor.distancia){
          mejor={punto:Number(punto),distancia,over:over.probabilidadJusta/100,under:under.probabilidadJusta/100};
        }
      }
      return mejor;
    }catch(e){ return null; }
  }

  const ctxAnterior=window.ctxFinal;
  window.ctxFinal=async function(partido){
    let base;
    try{ base=await obtenerContextoCompleto(partido); }
    catch(e){ base=await ctxAnterior(partido); }

    const deporte=partido.deporte||deporteActivo;
    const odds=probabilidadesCuotas(partido);
    const pesoCuotas=odds ? 0.72 : 0;
    const empHist=deporte==='futbol' ? Number(base.empate||.25) : 0;
    let localHist=Number(base.fuerzaLocal||.5);
    let visHist=Number(base.fuerzaVis||(.5-empHist/2));

    if(odds){
      base.fuerzaLocal=localHist*(1-pesoCuotas)+odds.local*pesoCuotas;
      base.fuerzaVis=visHist*(1-pesoCuotas)+odds.visitante*pesoCuotas;
      base.empate=deporte==='futbol' ? empHist*(1-pesoCuotas)+odds.empate*pesoCuotas : 0;
      const suma=base.fuerzaLocal+base.fuerzaVis+(base.empate||0);
      base.fuerzaLocal/=suma; base.fuerzaVis/=suma;
      if(deporte==='futbol') base.empate/=suma;
    }

    // Ajusta producción esperada usando la línea total real más equilibrada.
    const total=lineaCentralCuotas(partido,'totals');
    if(total && base.sa && base.sb){
      const actual=Math.max(.01,((base.sa.gf+base.sb.gc)/2)+((base.sb.gf+base.sa.gc)/2));
      const factor=Math.max(.55,Math.min(1.55,total.punto/actual));
      base.sa={...base.sa,gf:base.sa.gf*factor,gc:base.sa.gc*factor};
      base.sb={...base.sb,gf:base.sb.gf*factor,gc:base.sb.gc*factor};
      base.totalMercado=total;
    }
    return base;
  };

  // Desactiva textos técnicos visibles: la interfaz conserva únicamente
  // selección y porcentaje, como fue solicitado.
  if(typeof metodologia==='function') window.metodologia=function(){return '';};
})();
</script>

<script>
/* ==========================================================
   PARCHE FINAL GREENPICKS
   1) Barras: porcentaje reactivo y consistente.
   2) Resultado exacto: mercado correct_score real por evento.
   3) API: rotación existente + caché persistente localStorage.
   ========================================================== */
(function(){
  'use strict';

  const GP_CACHE_PREFIX = 'greenpicks_api_cache_v4:';
  const GP_CACHE_TTL = 5 * 60 * 1000;

  function cacheKey(urlTemplate){
    return GP_CACHE_PREFIX + encodeURIComponent(String(urlTemplate));
  }

  // Conserva la caché en memoria y agrega persistencia entre recargas.
  const guardarCacheMemoria = window.guardarCacheAPI;
  window.guardarCacheAPI = function(urlTemplate, data){
    try { if (typeof guardarCacheMemoria === 'function') guardarCacheMemoria(urlTemplate, data); } catch(e){}
    try {
      localStorage.setItem(cacheKey(urlTemplate), JSON.stringify({fecha:Date.now(), data:data}));
    } catch(e){ console.warn('No se pudo guardar la caché persistente', e); }
  };

  const obtenerCacheMemoria = window.obtenerCacheAPI;
  window.obtenerCacheAPI = function(urlTemplate){
    try {
      if (typeof obtenerCacheMemoria === 'function') {
        const memoria = obtenerCacheMemoria(urlTemplate);
        if (memoria) return memoria;
      }
    } catch(e){}
    try {
      const raw = localStorage.getItem(cacheKey(urlTemplate));
      if (!raw) return null;
      const item = JSON.parse(raw);
      if (!item || Date.now() - Number(item.fecha||0) > GP_CACHE_TTL) {
        localStorage.removeItem(cacheKey(urlTemplate));
        return null;
      }
      return item.data ?? null;
    } catch(e){ return null; }
  };

  const limpiarCacheMemoria = window.limpiarCacheAPI;
  window.limpiarCacheAPI = function(){
    try { if (typeof limpiarCacheMemoria === 'function') limpiarCacheMemoria(); } catch(e){}
    try {
      Object.keys(localStorage).forEach(k=>{ if(k.startsWith(GP_CACHE_PREFIX)) localStorage.removeItem(k); });
    } catch(e){}
  };

  function clamp01(n){ return Math.max(0.01, Math.min(0.99, Number(n)||0.5)); }
  function porcentajeLinea(esperado, linea, lado, escala){
    esperado = Number(esperado); linea = Number(linea); escala = Math.max(0.15, Number(escala)||1);
    if(!Number.isFinite(esperado) || !Number.isFinite(linea)) return 50;
    // Curva logística: al subir la línea baja el Over y sube el Under.
    const over = 1 / (1 + Math.exp((linea - esperado) / escala));
    const p = String(lado).toLowerCase().startsWith('men') ? 1-over : over;
    return Math.round(clamp01(p)*100);
  }

  function actualizarBarra(input){
    const box = input.closest('.selector-analisis, .selector-analizado');
    if(!box) return;
    let valores=[];
    try { valores=JSON.parse(input.dataset.valores||'[]').map(Number); } catch(e){}
    const indice=Math.max(0,Math.min(valores.length-1,Number(input.value)||0));
    const linea=valores[indice];
    const lado=input.dataset.side || input.dataset.tipo || 'Más';
    const sufijo=input.dataset.sufijo || '';
    const esperado=Number(box.dataset.expected ?? box.dataset.esperado);
    const escala=Number(box.dataset.scale ?? box.dataset.escala ?? 1);
    const prob=porcentajeLinea(esperado,linea,lado,escala);

    const eleccion=box.querySelector('.selector-eleccion, .selector-resultado');
    const probEl=box.querySelector('.selector-prob, .selector-probabilidad, .analisis-probabilidad');
    if(eleccion) eleccion.textContent=`${lado} de ${linea}${sufijo}`;
    if(probEl) probEl.textContent=`${prob}%`;

    const icon=box.querySelector('.selector-rango-icono');
    if(icon){
      const max=Math.max(1,Number(input.max)||1);
      icon.style.left=`${(indice/max)*100}%`;
    }
  }

  // Controlador global definitivo. Funciona aunque existan versiones anteriores.
  window.gpFinalSlider = actualizarBarra;
  window.actualizarSelectorAnalizado = actualizarBarra;
  window.actualizarSelectorMercado = actualizarBarra;

  document.addEventListener('input', function(e){
    if(e.target && e.target.matches('input.selector-rango')) actualizarBarra(e.target);
  });
  document.addEventListener('change', function(e){
    if(e.target && e.target.matches('input.selector-rango')) actualizarBarra(e.target);
  });

  document.addEventListener('click', function(e){
    const btn=e.target.closest('.selector-analisis .btn-toggle-item, .selector-analizado .btn-toggle-item');
    if(!btn) return;
    const box=btn.closest('.selector-analisis, .selector-analizado');
    box.querySelectorAll('.btn-toggle-item').forEach(b=>b.classList.remove('activo'));
    btn.classList.add('activo');
    const input=box.querySelector('input.selector-rango');
    if(input){
      input.dataset.side=(btn.textContent||'Más').trim();
      input.dataset.tipo=input.dataset.side;
      actualizarBarra(input);
    }
  }, true);

  function mediana(arr){
    const x=arr.filter(Number.isFinite).sort((a,b)=>a-b);
    if(!x.length) return null;
    const m=Math.floor(x.length/2);
    return x.length%2?x[m]:(x[m-1]+x[m])/2;
  }

  async function obtenerResultadoExactoReal(partido){
    if(!partido || !partido.id || !partido.sportKey) return [];
    const url=`https://api.the-odds-api.com/v4/sports/${encodeURIComponent(partido.sportKey)}/events/${encodeURIComponent(partido.id)}/odds?regions=eu&markets=correct_score&oddsFormat=decimal&dateFormat=iso&apiKey=API_KEY_PLACEHOLDER`;
    try{
      const res=await fetchConRotacion(url);
      const data=await res.json();
      const porMarcador=new Map();
      (data?.bookmakers||[]).forEach(book=>{
        (book.markets||[]).filter(m=>m.key==='correct_score').forEach(m=>{
          const valid=(m.outcomes||[]).filter(o=>Number(o.price)>1);
          const inv=valid.map(o=>1/Number(o.price));
          const suma=inv.reduce((a,b)=>a+b,0);
          valid.forEach((o,i)=>{
            const nombre=String(o.name||o.description||'').trim();
            if(!/^\d+\s*[-:]\s*\d+$/.test(nombre)) return;
            const p=suma?inv[i]/suma:0;
            if(!porMarcador.has(nombre)) porMarcador.set(nombre,[]);
            porMarcador.get(nombre).push(p);
          });
        });
      });
      return [...porMarcador.entries()]
        .map(([marcador,ps])=>({marcador,probabilidad:mediana(ps)||0}))
        .sort((a,b)=>b.probabilidad-a.probabilidad)
        .slice(0,3);
    }catch(e){
      console.warn('Resultado exacto no disponible',e);
      return [];
    }
  }

  function reemplazarResultadosExactos(top){
    const zona=document.getElementById('detalle-barras');
    if(!zona) return;
    const cards=[...zona.querySelectorAll('.analisis-mercado-card')].filter(card=>
      /resultado exacto top/i.test(card.querySelector('.analisis-mercado-nombre')?.textContent||'')
    );
    cards.forEach((card,i)=>{
      const dato=top[i];
      const nombre=card.querySelector('.analisis-mercado-nombre');
      const prob=card.querySelector('.analisis-probabilidad');
      const sel=card.querySelector('.analisis-seleccion');
      if(nombre) nombre.textContent=`Resultado exacto Top ${i+1}`;
      if(dato){
        if(prob) prob.textContent=`${Math.round(dato.probabilidad*100)}%`;
        if(sel) sel.textContent=dato.marcador;
      }else{
        if(prob) prob.textContent='—';
        if(sel) sel.textContent='No disponible para este partido';
      }
    });
  }

  const cargarAnterior=window.cargarAnalisisCompleto;
  window.cargarAnalisisCompleto=async function(partido){
    await cargarAnterior(partido);
    document.querySelectorAll('#detalle-barras input.selector-rango').forEach(actualizarBarra);
    if((partido.deporte||window.deporteActivo)==='futbol'){
      const exactos=await obtenerResultadoExactoReal(partido);
      reemplazarResultadosExactos(exactos);
    }
  };

  console.log('✅ Parche final: barras reactivas, correct_score real y caché persistente activos');
})();
</script>
