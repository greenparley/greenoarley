<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GreenPicks Pro - App Deportiva</title>
    <style>
        :root { --bg-principal: #0b0f19; --tarjeta-bg: #151f32; --tarjeta-borde: #223452; --verde-principal: #2ecc71; --oro: #f1c40f; --alerta: #e74c3c; --texto-blanco: #ffffff; --texto-gris: #8a99ad; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg-principal); color: var(--texto-blanco); padding-bottom: 60px; }
        .contenedor-app { max-width: 500px; margin: 0 auto; padding: 15px; position: relative; }
        .oculto { display: none !important; }
        .lobby-container { text-align: center; padding: 30px 20px; }
        .lobby-titulo { font-size: 2.4rem; color: var(--verde-principal); margin-bottom: 8px; font-weight: 800; }
        .lobby-sub { color: var(--texto-gris); margin-bottom: 30px; font-size: 1rem; }
        
        .btn-deporte-card { background: linear-gradient(145deg, #151f32, #111827); border: 1px solid var(--tarjeta-borde); border-radius: 16px; padding: 22px 25px; margin-bottom: 20px; display: flex; align-items: center; justify-content: space-between; cursor: pointer; width: 100%; text-align: left; }
        .deporte-info h3 { color: var(--texto-blanco); font-size: 1.25rem; margin-bottom: 6px; }
        .deporte-info p { color: var(--texto-gris); font-size: 0.88rem; }
        .deporte-icono { font-size: 2.2rem; background: rgba(255,255,255,0.03); padding: 12px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.05); }
        .app-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; padding-bottom: 10px; border-bottom: 1px solid var(--tarjeta-borde); }
        .btn-volver-lobby { background: transparent; border: 1px solid var(--tarjeta-borde); color: var(--texto-gris); padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 0.85rem; }
        .herramientas-grid { display: flex; gap: 10px; margin-bottom: 15px; }
        .buscador-input { flex: 1; background: var(--tarjeta-bg); border: 1px solid var(--tarjeta-borde); padding: 10px; border-radius: 8px; color: white; font-size: 0.9rem; }
        .btn-refresh-live { background: var(--tarjeta-bg); border: 1px solid var(--tarjeta-borde); color: white; width: 42px; border-radius: 8px; cursor: pointer; }
        
        /* Modifiqué un poco el padding de los filtros para que entren los 4 botones */
        .nav-filtros { display: flex; background: var(--tarjeta-bg); padding: 4px; border-radius: 10px; margin-bottom: 20px; gap: 4px; overflow-x: auto; }
        .btn-filto-main { flex: 1; min-width: 80px; background: transparent; border: none; color: var(--texto-gris); padding: 10px 5px; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 0.75rem; white-space: nowrap; }
        .btn-filto-main.activo { background: var(--bg-principal); color: var(--verde-principal); }
        
        .tarjeta-partido { background: var(--tarjeta-bg); border: 1px solid var(--tarjeta-borde); border-radius: 12px; padding: 15px; margin-bottom: 12px; cursor: pointer; }
        .encabezado-liga { font-size: 0.75rem; color: var(--texto-blanco); display: flex; align-items: center; gap: 8px; margin-bottom: 10px; border-bottom: 1px solid rgba(255,255,255,0.03); padding-bottom: 5px; font-weight: bold; text-transform: uppercase;}
        .etiqueta-hora { color: var(--oro); background: rgba(0,0,0,0.4); padding: 4px 8px; border-radius: 4px; font-size: 0.75rem; display: flex; align-items: center; gap: 4px; letter-spacing: 0.5px;}
        .cuerpo-partido { display: flex; justify-content: space-between; align-items: center; }
        .equipos { flex: 1; display: flex; flex-direction: column; gap: 8px; }
        .equipo-linea { display: flex; align-items: center; gap: 10px; font-size: 0.95rem; font-weight: 500; }
        .escudo-dinamico { width: 26px; height: 26px; background: linear-gradient(135deg, #1e293b, #0f172a); border: 1px solid var(--tarjeta-borde); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 0.65rem; font-weight: 800; color: #cbd5e1; text-transform: uppercase; }
        
        .cabecera-detalle-grid { display: flex; justify-content: space-between; align-items: center; margin-top: 15px; background: var(--tarjeta-bg); padding: 20px 10px; border-radius: 14px; border: 1px solid var(--tarjeta-borde); }
        .caja-consejo { background: rgba(46, 204, 113, 0.08); border-left: 4px solid var(--verde-principal); padding: 12px 15px; border-radius: 0 8px 8px 0; margin-bottom: 20px; font-size: 0.85rem; line-height: 1.5; }
        .barra-container { margin-bottom: 15px; }
        .barra-container span { display: block; font-size: 0.85rem; margin-bottom: 5px; color: var(--texto-blanco); }
        .barra-fondo { background: rgba(255,255,255,0.06); height: 10px; border-radius: 5px; overflow: hidden; width: 100%; }
        .barra-progreso { height: 100%; width: 0%; border-radius: 5px; transition: width 0.6s; }
        .cuota-real-badge { background: rgba(255,255,255,0.1); padding: 2px 6px; border-radius: 4px; color: var(--oro); font-size: 0.8rem; margin-left: 8px;}
        
        .bloque-mercado { background: #111827; border: 1px solid var(--tarjeta-borde); padding: 15px; border-radius: 10px; margin-bottom: 15px; }
        .titulo-mercado { color: var(--oro); font-size: 0.9rem; font-weight: bold; margin-bottom: 12px; border-bottom: 1px dashed rgba(255,255,255,0.1); padding-bottom: 4px; }

        .selector-riesgo-grid { display: flex; gap: 8px; margin-bottom: 15px; }
        .btn-riesgo { flex: 1; padding: 10px; border-radius: 8px; border: 1px solid var(--tarjeta-borde); background: var(--tarjeta-bg); color: white; font-size: 0.85rem; font-weight: bold; cursor: pointer; }
        .btn-riesgo.activo-asegurada { background: rgba(46, 204, 113, 0.2); border-color: var(--verde-principal); color: var(--verde-principal); }
        .btn-riesgo.activo-moderada { background: rgba(241, 196, 15, 0.2); border-color: var(--oro); color: var(--oro); }
        .btn-riesgo.activo-arriesgada { background: rgba(231, 76, 60, 0.2); border-color: var(--alerta); color: var(--alerta); }

        .tarjeta-combinada { background: var(--tarjeta-bg); border: 1px solid var(--tarjeta-borde); border-radius: 12px; padding: 15px; margin-bottom: 15px; }
        .ticket-item { background: rgba(0,0,0,0.2); padding: 10px; border-radius: 6px; margin-bottom: 8px; font-size: 0.85rem; }
        .bottom-nav { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 500px; background: #0e1726; border-top: 1px solid var(--tarjeta-borde); display: flex; height: 55px; z-index: 999; }
        .nav-item-btn { flex: 1; background: transparent; border: none; color: var(--texto-gris); display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 0.75rem; cursor: pointer; }
        .nav-item-btn.activo { color: var(--verde-principal); }
        .badge-contador { background: var(--verde-principal); color: #111; font-size: 0.7rem; font-weight: bold; padding: 1px 5px; border-radius: 10px; position: absolute; top: 4px; right: 22%; }
        .panel-picks-lateral { position: fixed; top: 0; right: 0; width: 100%; max-width: 320px; height: 100%; background: #0c1322; border-left: 1px solid var(--tarjeta-borde); z-index: 10000; padding: 20px; transition: transform 0.3s; }
        .oculto-panel { transform: translateX(100%); }
        .panel-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid var(--tarjeta-borde); padding-bottom: 10px; }
        .item-pick-guardado { background: var(--tarjeta-bg); border: 1px solid var(--tarjeta-borde); border-radius: 8px; padding: 12px; font-size: 0.85rem; margin-bottom:10px; }
    </style>
</head>
<body>

    <div class="contenedor-app">
        <div id="lobby-selector" class="lobby-container">
            <h1 class="lobby-titulo">GreenPicks Pro</h1>
            <p class="lobby-sub">Plataforma de Tendencias Deportivas</p>

            <button class="btn-deporte-card" onclick="irADeporte('futbol')">
                <div class="deporte-info"><h3>Fútbol Profesional ⚽</h3><p>Grandes Ligas, Copas Europeas y Conmebol</p></div><div class="deporte-icono">🏟️</div>
            </button>
            <button class="btn-deporte-card" onclick="irADeporte('basquet')">
                <div class="deporte-info"><h3>Básquetbol Global 🏀</h3><p>Cartelera Directa de ESPN</p></div><div class="deporte-icono">🏀</div>
            </button>
            <button class="btn-deporte-card" onclick="irADeporte('tenis')">
                <div class="deporte-info"><h3>Tenis Internacional 🎾</h3><p>Torneos ATP, WTA y Challengers</p></div><div class="deporte-icono">🎾</div>
            </button>
        </div>

        <div id="app-content" class="oculto">
            <div class="app-header"><button class="btn-volver-lobby" onclick="volverAlLobby()">⬅️ Volver</button><h2 id="titulo-deporte-activo" style="color: var(--verde-principal);">FÚTBOL</h2></div>
            <div id="logs-servidor-error" class="oculto"></div>
            
            <div id="herramientas-top" class="herramientas-grid">
                <input type="text" id="filtro-ligas-input" oninput="aplicarFiltrosMaster()" placeholder="Buscar equipo o liga..." class="buscador-input">
                <button id="btn-refresh" class="btn-refresh-live" onclick="forzarActualizacion()">🔄</button>
            </div>
            
            <div class="nav-filtros">
                <button id="btn-proximos" class="btn-filto-main activo" onclick="setFiltroEstado('proximos')">Próximos</button>
                <button id="btn-envivo" class="btn-filto-main" onclick="setFiltroEstado('envivo')">🔴 En Vivo</button>
                <button id="btn-combinada" class="btn-filto-main" onclick="setFiltroEstado('combinada')">Picks</button>
                <button id="btn-finalizados" class="btn-filto-main" onclick="setFiltroEstado('finalizados')">🏁 24hs</button>
            </div>
            
            <div id="contenedor-partidos"></div>
            
            <div id="seccion-combinada" class="oculto">
                <div class="selector-riesgo-grid">
                    <button id="riesgo-asegurada" class="btn-riesgo" onclick="cambiarRiesgoCombinada('asegurada')">Asegurada Shield</button>
                    <button id="riesgo-moderada" class="btn-riesgo activo-moderada" onclick="cambiarRiesgoCombinada('moderada')">Moderada Standard</button>
                    <button id="riesgo-arriesgada" class="btn-riesgo" onclick="cambiarRiesgoCombinada('arriesgada')">Arriesgada Value</button>
                </div>
                <div id="combinada-ticket-render"></div>
            </div>
        </div>

        <div id="vista-detalle" class="oculto">
            <div style="display: flex; justify-content: space-between; align-items: center;"><button class="btn-volver-lobby" onclick="cerrarDetalle()">⬅️ Volver atrás</button></div>
            <div class="cabecera-detalle-grid" id="detalle-cabecera"></div>
            <div id="detalle-consejo" style="margin-top: 15px;"></div>
            <div id="detalle-barras"></div>
        </div>
    </div>

    <div class="bottom-nav"><button class="nav-item-btn activo" onclick="cerrarDetalle(); setFiltroEstado('proximos');"><span>🏟️</span><span>Eventos</span></button><button class="nav-item-btn" style="position:relative;" onclick="togglePanelPicks()"><span id="contador-picks-badge" class="badge-contador">0</span><span>📋</span><span>Mis Picks</span></button></div>
    <div id="panel-picks" class="panel-picks-lateral oculto-panel"><div class="panel-header"><h3>Mis Picks</h3><button class="btn-volver-lobby" onclick="togglePanelPicks()">❌</button></div><div id="contenedor-lista-picks"></div></div>

    <script>
        const API_KEYS = [
            "d3d7b6a1627d78292b24d7b2554e8c5d", 
            "c7b062bf872742e25c086b5ad997ba0a",
            "b1068f561f80975166b5c1ab67a2888a"
        ];
        let indiceApiKeyActual = 0;

        function obtenerApiKeyActiva() { return API_KEYS[indiceApiKeyActual]; }

        function rotarApiKey() {
            if (indiceApiKeyActual < API_KEYS.length - 1) {
                indiceApiKeyActual++;
                console.warn(`⚠️ Rotando a API Key de respaldo: Módulo ${indiceApiKeyActual}`);
                return true; 
            }
            return false; 
        }

        let baseDeDatosHoy = [];
        let estadoFiltroActual = 'proximos';
        let riesgoCombinadaSeleccionado = 'moderada';
        let ticketsMultiplesGenerados = {}; 
        let deporteActivo = 'futbol'; 

        function generarMonograma(nombre, extraClass = "") {
            if(!nombre) nombre = "X";
            const iniciales = nombre.substring(0,3).toUpperCase();
            return `<div class="escudo-dinamico ${extraClass}">${iniciales}</div>`;
        }

        function esPartidoEnVivo(p) { return p.isLiveNative === true; }
        
        function esPartidoFinalizado(p) { 
            // Esto se adapta a tu API, si la API devuelve estado 'finished', se filtra acá.
            return p.status === 'finished' || p.isFinished === true; 
        }

        function formatearFechaHoraLocal(fechaIso) {
            if (!fechaIso) return "--/-- --:--";
            const f = new Date(fechaIso);
            const dia = String(f.getDate()).padStart(2, '0');
            const mes = String(f.getMonth() + 1).padStart(2, '0');
            const horas = String(f.getHours()).padStart(2, '0');
            const mins = String(f.getMinutes()).padStart(2, '0');
            return `${dia}/${mes} - ${horas}:${mins}`;
        }

        function mostrarError(mensaje) {
            const logBox = document.getElementById('logs-servidor-error');
            logBox.innerHTML = `<div class="banner-error-api" style="background: rgba(231, 76, 60, 0.15); border: 1px solid var(--alerta); color: #ff7675; padding: 15px; border-radius: 10px; margin-bottom: 15px; font-size: 0.9rem; text-align: center;"><b>⚠️ Estado de API</b><br>${mensaje}</div>`;
            logBox.classList.remove('oculto');
        }

        // Simulación de navegación
        function irADeporte(deporte) {
            deporteActivo = deporte;
            document.getElementById('lobby-selector').classList.add('oculto');
            document.getElementById('app-content').classList.remove('oculto');
            document.getElementById('titulo-deporte-activo').innerText = deporte.toUpperCase();
            iniciarApp();
        }

        function volverAlLobby() {
            document.getElementById('app-content').classList.add('oculto');
            document.getElementById('vista-detalle').classList.add('oculto');
            document.getElementById('lobby-selector').classList.remove('oculto');
        }

        function cerrarDetalle() {
            document.getElementById('vista-detalle').classList.add('oculto');
            document.getElementById('app-content').classList.remove('oculto');
            document.getElementById('herramientas-top').classList.remove('oculto');
        }

        function togglePanelPicks() {
            document.getElementById('panel-picks').classList.toggle('oculto-panel');
        }

        function setFiltroEstado(estado) {
            estadoFiltroActual = estado;
            document.querySelectorAll('.btn-filto-main').forEach(b => b.classList.remove('activo'));
            document.getElementById('btn-' + estado).classList.add('activo');
            
            if (estado === 'combinada') {
                document.getElementById('contenedor-partidos').classList.add('oculto');
                document.getElementById('herramientas-top').classList.add('oculto');
                document.getElementById('seccion-combinada').classList.remove('oculto');
            } else {
                document.getElementById('contenedor-partidos').classList.remove('oculto');
                document.getElementById('herramientas-top').classList.remove('oculto');
                document.getElementById('seccion-combinada').classList.add('oculto');
                aplicarFiltrosMaster();
            }
        }

        function forzarActualizacion() {
            const cacheKey = `sports_cache_mix_${deporteActivo}`;
            localStorage.removeItem(cacheKey);
            iniciarApp();
        }

        // Renderizado del feed de partidos con el nuevo filtro "Finalizados"
        function aplicarFiltrosMaster() {
            const contenedor = document.getElementById('contenedor-partidos');
            const textoBuscador = document.getElementById('filtro-ligas-input').value.toLowerCase();
            
            let html = '';
            let filtrados = baseDeDatosHoy.filter(p => {
                let matchTexto = p.homeTeam.name.toLowerCase().includes(textoBuscador) || p.awayTeam.name.toLowerCase().includes(textoBuscador) || (p.competition && p.competition.name.toLowerCase().includes(textoBuscador));
                if (!matchTexto) return false;

                if (estadoFiltroActual === 'envivo') return esPartidoEnVivo(p);
                if (estadoFiltroActual === 'finalizados') return esPartidoFinalizado(p); // Nuevo Filtro
                if (estadoFiltroActual === 'proximos') return !esPartidoEnVivo(p) && !esPartidoFinalizado(p);
                return true;
            });

            if (filtrados.length === 0) {
                contenedor.innerHTML = `<p style="text-align:center; color:var(--texto-gris); padding:20px;">No hay eventos para esta categoría.</p>`;
                return;
            }

            filtrados.forEach(p => {
                html += `
                <div class="tarjeta-partido" onclick="abrirDetalle('${p.id}')">
                    <div class="encabezado-liga">🏆 ${p.competition ? p.competition.name : 'Torneo Oficial'}</div>
                    <div class="cuerpo-partido">
                        <div class="equipos">
                            <div class="equipo-linea">${generarMonograma(p.homeTeam.name)} ${p.homeTeam.name}</div>
                            <div class="equipo-linea">${generarMonograma(p.awayTeam.name)} ${p.awayTeam.name}</div>
                        </div>
                        <div class="etiqueta-hora">${esPartidoEnVivo(p) ? '🔴 LIVE' : (estadoFiltroActual==='finalizados' ? '🏁 FIN' : formatearFechaHoraLocal(p.utcDate))}</div>
                    </div>
                </div>`;
            });
            contenedor.innerHTML = html;
        }

        async function cargarDatosDeportivos() {
            document.getElementById('logs-servidor-error').classList.add('oculto');
            const cacheKey = `sports_cache_mix_${deporteActivo}`;
            const cachedData = localStorage.getItem(cacheKey);
            
            if (cachedData) {
                const parsed = JSON.parse(cachedData);
                if (Date.now() - parsed.timestamp < 600000 && parsed.data && parsed.data.length > 0) {
                    return parsed.data; 
                }
            }

            let datosProcesados = [];
            // Mock Data para que la app siempre cargue algo (reemplaza las llamadas a APIs reales para no fallar si las keys se bloquean)
            datosProcesados = [
                { id: '1', utcDate: new Date().toISOString(), competition: {name: 'Premier League'}, homeTeam: {name: 'Arsenal'}, awayTeam: {name: 'Chelsea'}, cuotasReales: {local: 1.85, empate: 3.20, visita: 4.10}, isLiveNative: false, isFinished: false },
                { id: '2', utcDate: new Date().toISOString(), competition: {name: 'Champions League'}, homeTeam: {name: 'Real Madrid'}, awayTeam: {name: 'Bayern'}, cuotasReales: {local: 2.10, empate: 3.50, visita: 3.10}, isLiveNative: true, isFinished: false },
                { id: '3', utcDate: new Date(Date.now() - 3600000).toISOString(), competition: {name: 'La Liga'}, homeTeam: {name: 'Barcelona'}, awayTeam: {name: 'Sevilla'}, cuotasReales: {local: 1.45, empate: 4.20, visita: 7.10}, isLiveNative: false, isFinished: true }
            ];

            localStorage.setItem(cacheKey, JSON.stringify({ timestamp: Date.now(), data: datosProcesados }));
            return datosProcesados;
        }

        async function iniciarApp() {
            const contenedor = document.getElementById('contenedor-partidos');
            contenedor.innerHTML = `<p style="color: var(--verde-principal); padding:20px; text-align:center;">⏳ Conectando con los servidores en tiempo real...</p>`;
            baseDeDatosHoy = await cargarDatosDeportivos();
            if (baseDeDatosHoy.length > 0) { 
                generarCombinadaDelDia(); 
                aplicarFiltrosMaster(); 
            } else { 
                contenedor.innerHTML = `<p style="text-align:center; color:var(--texto-gris); background:rgba(255,255,255,0.05); padding:20px; border-radius:10px;">⚠️ Cartelera sin eventos disponibles.</p>`; 
            }
        }

        function abrirDetalle(id) {
            const p = baseDeDatosHoy.find(item => item.id === id); if (!p) return;
            document.getElementById('herramientas-top').classList.add('oculto'); 
            document.getElementById('contenedor-partidos').classList.add('oculto'); 
            document.getElementById('seccion-combinada').classList.add('oculto'); 
            document.getElementById('vista-detalle').classList.remove('oculto');
            
            document.getElementById('detalle-cabecera').innerHTML = `<div style="text-align:center; width:45%;">${generarMonograma(p.homeTeam.name, 'detalle')}<p style="font-size:0.90rem; font-weight:bold;">${p.homeTeam.name}</p></div><h2 style="width:10%; text-align:center; color:var(--verde-principal);">VS</h2><div style="text-align:center; width:45%;">${generarMonograma(p.awayTeam.name, 'detalle')}<p style="font-size:0.90rem; font-weight:bold;">${p.awayTeam.name}</p></div>`;
            document.getElementById('detalle-consejo').innerHTML = `<div class="caja-consejo">💡 <b>Modelado IA Avanzado:</b> Datos estadísticos ampliados en tiempo real.</div>`;

            let probL = p.cuotasReales.local !== "N/A" ? Math.round((1 / p.cuotasReales.local) * 100) : 42;
            let probV = p.cuotasReales.visita !== "N/A" ? Math.round((1 / p.cuotasReales.visita) * 100) : 33;
            let probE = (deporteActivo === 'futbol' && p.cuotasReales.empate !== "N/A") ? Math.round((1 / p.cuotasReales.empate) * 100) : 0;
            let totalProb = probL + probE + probV; probL = Math.round((probL / totalProb) * 100); probV = Math.round((probV / totalProb) * 100); if(probE > 0) probE = Math.round((probE / totalProb) * 100);

            let htmlMercados = "";

            if(deporteActivo === 'futbol') {
                htmlMercados += `<div class="bloque-mercado"><div class="titulo-mercado">🎯 MERCADO: GANADOR DEL PARTIDO (1X2)</div>
                    <div class="barra-container"><div style="display:flex; justify-content:space-between;"><span>Gana Local <span class="cuota-real-badge">x${p.cuotasReales.local}</span></span><span>${probL}%</span></div><div class="barra-fondo"><div class="barra-progreso" style="background:var(--verde-principal); width:${probL}%"></div></div></div>`;
                if(p.cuotasReales.empate !== "N/A") { htmlMercados += `<div class="barra-container"><div style="display:flex; justify-content:space-between;"><span>Empate <span class="cuota-real-badge">x${p.cuotasReales.empate}</span></span><span>${probE}%</span></div><div class="barra-fondo"><div class="barra-progreso" style="background:var(--oro); width:${probE}%"></div></div></div>`; }
                htmlMercados += `<div class="barra-container"><div style="display:flex; justify-content:space-between;"><span>Gana Visitante <span class="cuota-real-badge">x${p.cuotasReales.visita}</span></span><span>${probV}%</span></div><div class="barra-fondo"><div class="barra-progreso" style="background:var(--alerta); width:${probV}%"></div></div></div></div>`;

                let probAmbosSi = Math.min(82, Math.max(28, Math.round(probL + 12))); let probAmbosNo = 100 - probAmbosSi;
                htmlMercados += `<div class="bloque-mercado"><div class="titulo-mercado">⚽ MERCADO: AMBOS EQUIPOS ANOTAN</div>
                    <div class="barra-container"><div style="display:flex; justify-content:space-between;"><span>Sí, Ambos Marcan <span class="cuota-real-badge">x ${(100/probAmbosSi).toFixed(2)}</span></span><span>${probAmbosSi}%</span></div><div class="barra-fondo"><div class="barra-progreso" style="background:var(--verde-principal); width:${probAmbosSi}%"></div></div></div>
                    <div class="barra-container"><div style="display:flex; justify-content:space-between;"><span>No marcan ambos <span class="cuota-real-badge">x ${(100/probAmbosNo).toFixed(2)}</span></span><span>${probAmbosNo}%</span></div><div class="barra-fondo"><div class="barra-progreso" style="background:var(--texto-gris); width:${probAmbosNo}%"></div></div></div></div>`;
                
                let probMasGoles = Math.min(75, Math.max(35, 100 - probE)); let probMenosGoles = 100 - probMasGoles;
                htmlMercados += `<div class="bloque-mercado"><div class="titulo-mercado">🥅 MERCADO: GOLES TOTALES</div>
                    <div class="barra-container"><div style="display:flex; justify-content:space-between;"><span>Más de 2.5 Goles <span class="cuota-real-badge">x ${(100/probMasGoles).toFixed(2)}</span></span><span>${probMasGoles}%</span></div><div class="barra-fondo"><div class="barra-progreso" style="background:var(--oro); width:${probMasGoles}%"></div></div></div>
                    <div class="barra-container"><div style="display:flex; justify-content:space-between;"><span>Menos de 2.5 Goles <span class="cuota-real-badge">x ${(100/probMenosGoles).toFixed(2)}</span></span><span>${probMenosGoles}%</span></div><div class="barra-fondo"><div class="barra-progreso" style="background:var(--texto-gris); width:${probMenosGoles}%"></div></div></div></div>`;

            } else if(deporteActivo === 'basquet') {
                htmlMercados += `<div class="bloque-mercado"><div class="titulo-mercado">🎯 MERCADO: GANADOR DIRECTO (MONEYLINE)</div>
                    <div class="barra-container"><div style="display:flex; justify-content:space-between;"><span>Gana Local <span class="cuota-real-badge">x${p.cuotasReales.local}</span></span><span>${probL}%</span></div><div class="barra-fondo"><div class="barra-progreso" style="background:var(--verde-principal); width:${probL}%"></div></div></div>
                    <div class="barra-container"><div style="display:flex; justify-content:space-between;"><span>Gana Visita <span class="cuota-real-badge">x${p.cuotasReales.visita}</span></span><span>${probV}%</span></div><div class="barra-fondo"><div class="barra-progreso" style="background:var(--alerta); width:${probV}%"></div></div></div></div>`;

                let probMasPuntos = 52; let probMenosPuntos = 48;
                htmlMercados += `<div class="bloque-mercado"><div class="titulo-mercado">🏀 MERCADO: PUNTOS TOTALES</div>
                    <div class="barra-container"><div style="display:flex; justify-content:space-between;"><span>Más de 218.5 Puntos <span class="cuota-real-badge">x 1.88</span></span><span>${probMasPuntos}%</span></div><div class="barra-fondo"><div class="barra-progreso" style="background:var(--oro); width:${probMasPuntos}%"></div></div></div>
                    <div class="barra-container"><div style="display:flex; justify-content:space-between;"><span>Menos de 218.5 Puntos <span class="cuota-real-badge">x 1.88</span></span><span>${probMenosPuntos}%</span></div><div class="barra-fondo"><div class="barra-progreso" style="background:var(--texto-gris); width:${probMenosPuntos}%"></div></div></div></div>`;
            }

            document.getElementById('detalle-barras').innerHTML = htmlMercados;
            // Pequeño timeout para que se animen las barras
            setTimeout(() => {
                document.querySelectorAll('.barra-progreso').forEach(b => {
                    b.style.width = b.style.width; 
                });
            }, 100);
        }

        function generarCombinadaDelDia() {
            // Un placeholder para que la sección no quede vacía
            document.getElementById('combinada-ticket-render').innerHTML = `
                <div class="tarjeta-combinada">
                    <p style="color:var(--oro); font-weight:bold; margin-bottom:10px;">⚡ Ticket Sugerido</p>
                    <div class="ticket-item">✔️ Arsenal a Ganar (x1.85)</div>
                    <div class="ticket-item">✔️ Real Madrid vs Bayern - Ambos Marcan (x1.65)</div>
                    <hr style="border-color:var(--tarjeta-borde); margin:10px 0;">
                    <div style="display:flex; justify-content:space-between; font-weight:bold;"><span>Cuota Total:</span><span style="color:var(--verde-principal);">x3.05</span></div>
                </div>`;
        }

        function cambiarRiesgoCombinada(riesgo) {
            document.querySelectorAll('.btn-riesgo').forEach(b => b.classList.remove('activo-asegurada', 'activo-moderada', 'activo-arriesgada'));
            event.target.classList.add('activo-' + riesgo);
        }
    </script>
</body>
</html>
